  /organizations/{organizationId}/job-requisitions:
    get:
      operationId: listJobRequisitions
      tags: [recruitment]
      summary: List job requisitions
      description: >-
        Visibility-filtered per caller: organization-wide for requisition.update
        holders, otherwise scoped to requisitions the caller requested, is the
        assigned recruiter or hiring manager on, or shares a department/branch
        with (docs/PHASE_3A_RECRUITMENT_IMPLEMENTATION_PLAN.md §7).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_approval, approved, rejected, partially_filled, filled, cancelled, closed]
        - name: requisitionType
          in: query
          schema:
            type: string
            enum: [new_role, replacement, temporary, internship, volunteer, contract, ministry]
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
        - name: hiringManagerEmployeeId
          in: query
          schema:
            type: integer
        - name: recruiterEmployeeId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered job requisition list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisitionListResponse"
    post:
      operationId: createJobRequisition
      tags: [recruitment]
      summary: Create a job requisition
      description: Always created as draft. filledCount is never client-settable.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequisitionInput"
      responses:
        "201":
          description: Job requisition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Invalid fields, or a referenced ID does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/{id}:
    get:
      operationId: getJobRequisition
      tags: [recruitment]
      summary: Get a job requisition
      description: Returns 404 both when the requisition doesn't exist and when it exists but isn't visible to this caller — never distinguishing the two.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job requisition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "404":
          description: Job requisition not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateJobRequisition
      tags: [recruitment]
      summary: Update a draft job requisition
      description: Only permitted while status is draft — protected fields (status, filledCount, audit metadata) are never accepted here.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobRequisitionInput"
      responses:
        "200":
          description: Job requisition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Only a draft requisition can be edited, or a validation/cross-org error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

