          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceReview"

  /organizations/{organizationId}/performance/reviews/{id}/competencies/{competencyId}:
    patch:
      operationId: rateCompetency
      tags: [performance-reviews]
      summary: Employee self-rates a snapshotted competency
      description: >-
        Requires performance.write.own, own review only, self_assessment
        status only. employeeRatingValue must match one of the review's
        own configured rating-scale levels. Never touches
        managerRatingValue/managerComment.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: competencyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCompetencyInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewCompetency"
        "400":
          description: employeeRatingValue does not match a configured rating-scale level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this review's own employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not in self_assessment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/self-assessment:
    post:
      operationId: submitSelfAssessment
      tags: [performance-reviews]
      summary: Employee submits their self-assessment — the authoritative self_assessment -> manager_review transition
      description: >-
        Requires performance.write.own, own review only. Readiness is
        validated first (400, listing every problem): every competency
        has an employeeRatingValue; every accepted, non-qualitative,
        non-N/A goal has a non-empty employeeComment; if any such goals
        exist, their weights sum to exactly 100. An atomic conditional
        UPDATE ... WHERE status = 'self_assessment' then performs the
        transition, setting selfAssessmentSubmittedAt — a concurrent or
        repeat submission affects zero rows and returns 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted — review is now in manager_review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReview"
        "400":
          description: Self-assessment is not ready to submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfAssessmentNotReadyError"
        "403":
          description: Not this review's own employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not (or is no longer) in self_assessment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/team-reviews:
    get:
      operationId: listTeamPerformanceReviews
      tags: [performance-reviews]
      summary: Manager — reviews where the caller is the reviewer of record
      description: Requires performance.review.write. reviewerEmployeeId is always server-resolved from the caller's own employee_user_links row, never client-supplied. Returns an empty array if the caller has no linked employee record.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews where the caller is reviewerEmployeeId
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceReview"

  /organizations/{organizationId}/performance/reviews/{id}/manager-review:
    post:
      operationId: submitManagerReview
      tags: [performance-reviews]
      summary: Reviewer of record submits the manager review — the authoritative manager_review -> hr_review transition
      description: >-
        Requires performance.review.write, reviewer of record only.
        Readiness is validated first (400, listing every problem): every
        proposed goal resolved (accepted or rejected); every accepted,
        non-qualitative, non-N/A goal has actualResult; every non-N/A
        competency has managerRatingValue; accepted, non-qualitative goal
        weights sum to 100; at least one section has a scoreable item. The
        official computedOverallScore is then computed deterministically
        (employee self-ratings never contribute) and an atomic conditional
        UPDATE ... WHERE status = 'manager_review' performs the
        transition, setting managerReviewSubmittedAt — a concurrent or
        repeat submission affects zero rows and returns 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submitted — review is now in hr_review status, computedOverallScore set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReview"
        "400":
          description: Manager review is not ready to submit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfAssessmentNotReadyError"
        "403":
          description: Not this review's reviewer of record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not (or is no longer) in manager_review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/finalize:
    post:
      operationId: finalizePerformanceReview
      tags: [performance-reviews]
      summary: HR finalizes the review, optionally overriding the score — the authoritative hr_review -> finalized transition
      description: >-
        Requires performance.finalize, organization-wide. computedOverallScore
        (set by the manager's own W78 submission) is read-only historical
        input here and is never recomputed or overwritten. hrOverrideScore
        and hrOverrideReason must both be supplied together, or neither —
        finalize with or without an override in the same call (§27 names no
        separate override-only route). An atomic conditional
        UPDATE ... WHERE status = 'hr_review' performs the transition,
        setting hrFinalizedAt — a concurrent or repeat finalization affects
        zero rows and returns 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizePerformanceReviewInput"
      responses:
        "200":
          description: Finalized — review is now in finalized status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReview"
        "400":
          description: hrOverrideScore/hrOverrideReason not supplied together, or the score is out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to finalize this review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not (or is no longer) in hr_review status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/reopen:
    post:
      operationId: reopenPerformanceReview
      tags: [performance-reviews]
      summary: HR reopens a review to an earlier explicit stage
      description: >-
        Requires performance.manage, organization-wide (not
        performance.finalize — §10.1 row 6 / §16 both explicitly assign
        reopen to performance.manage). Valid only from manager_review,
        hr_review, or finalized; targetStage must be one of
        self_assessment/manager_review/hr_review and strictly earlier than
        the review's current status; reason is mandatory. Clears only the
        review-row timestamp/decision fields downstream of the target stage
        (§10.4) — goal/competency/self-assessment content is never blanked.
        revisionNumber increments by 1 in the same atomic
        UPDATE ... WHERE status = '<current>' — a concurrent reopen affects
        zero rows and returns 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenPerformanceReviewInput"
      responses:
        "200":
          description: Reopened — review is now in the target status, revisionNumber incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReview"
        "400":
          description: Missing reason, or an invalid/non-earlier targetStage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to reopen this review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review's current status cannot be reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/acknowledge:
    post:
      operationId: acknowledgePerformanceReview
      tags: [performance-reviews]
      summary: Employee acknowledges a finalized review — the authoritative finalized -> acknowledged transition
      description: >-
        Requires performance.write.own, own review only (§10.1 row 5). "Seen,"
        not "agreed" — never mutates computedOverallScore, hrOverrideScore,
        hrOverrideReason, or any manager/HR field. acknowledgementRequiredSnapshot
        does not gate this route: when false, acknowledgement is optional but
        still permitted (the snapshot is a display-only signal for the ESS UI,
        per §10.1 row 5's own parenthetical), so any own review in finalized
        status may be acknowledged. An optional employeeFinalComment may be
        recorded in the same call — informational only, never a formal appeal
        (Owner Decision 3, deferred) and never validated as a precondition for
        acknowledging. acknowledgedAt is always server-generated, never
        client-supplied. An atomic conditional
        UPDATE ... WHERE status = 'finalized' AND employee_id = <server-resolved>
        performs the transition — a concurrent or repeat acknowledgement
        affects zero rows and returns 409, never a silent double-transition.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgePerformanceReviewInput"
      responses:
        "200":
          description: Acknowledged — review is now in acknowledged status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReview"
        "403":
          description: Not this review's own employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not (or is no longer) in finalized status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/dashboard:
    get:
      operationId: getPerformanceDashboard
      tags: [performance-reporting]
      summary: Performance dashboard — zero-filled lifecycle tile breakdown
      description: >-
        Requires performance.reports.read. Scope resolved in the service
        layer exactly like recruitment.reports.read/attendance.read.own:
        performance.manage holders see the whole organization; everyone
        else sees only reviews where they are the review's own employee or
        its snapshotted reviewerEmployeeId. Optional ?cycleId= narrows
        every review-scoped tile to one cycle; activeCycleCount is always
        organization-wide (cycle existence isn't sensitive). Plain counts
        only — no completion percentage or average-score tile, per the
        frozen plan's own "no invented rate/KPI" scope. A reopened review
        counts only under its current status.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: cycleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard tile breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceDashboard"

  /organizations/{organizationId}/performance/reports/{reportKey}:
    get:
      operationId: runPerformanceReport
      tags: [performance-reporting]
      summary: Run a Performance report
      description: >-
        Computes a registered Performance report (see GET /reports,
        category "performance": performance_review_status,
        performance_scores, performance_goal_results) over the caller's
        own/reviewer-of-record/organization-wide visibility tier (identical
        to the dashboard). Filters mirror GET .../performance/reviews
        (W80) — cycleId/status/departmentId/positionId/reviewerId/
        employeeId, each filtering the review's own historical snapshot
        columns, narrowing the authorized scope but never broadening it.
        Pass ?format=csv for a CSV download instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: cycleId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, self_assessment, manager_review, hr_review, finalized, acknowledged]
        - name: departmentId
          in: query
          required: false
          description: Filters departmentIdSnapshot, not the employee's current department.
          schema:
            type: integer
        - name: positionId
          in: query
          required: false
          description: Filters positionIdSnapshot, not the employee's current position.
          schema:
            type: integer
        - name: reviewerId
          in: query
          required: false
          description: Filters the snapshotted reviewerEmployeeId.
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Performance report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string
        "404":
          description: Unknown Performance report key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/evidence:
    get:
      operationId: listPerformanceReviewEvidence
      tags: [performance-evidence]
      summary: List a review's evidence
      description: >-
        Visible to the same own/reviewer-of-record/organization-wide tier as
        the review itself (§27 line 142's own scope model) — not stage-
        gated, since evidence remains part of the review's durable
        historical record after finalization.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence attached to this review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceReviewEvidence"
        "403":
          description: Not authorized to view this review's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addPerformanceReviewEvidence
      tags: [performance-evidence]
      summary: Attach evidence to a review (or one of its goals)
      description: >-
        multipart/form-data upload. Reuses the existing employee_documents
        storage layer verbatim (§8.9 — "a lightweight join table only, no
        new storage layer") — PDF, JPEG, PNG, DOCX, and XLSX only, validated
        by file signature, 10MB max, identical to the existing employee
        document upload. Server-derived actor identity decides which path
        applies, never a client-supplied flag: the review's own employee
        (performance.write.own) may attach evidence only while the review is
        self_assessment; the reviewer of record (performance.review.write)
        only while manager_review; HR (performance.manage) only while
        hr_review. Optional goalId attaches at a specific goal instead of
        the review as a whole; it must belong to this same review.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                goalId:
                  type: integer
                  description: Must belong to this same review.
      responses:
        "201":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewEvidence"
        "400":
          description: Invalid file, or a goalId that isn't this review's own
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to add evidence to this review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review or goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not in a stage that allows this caller to add evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/evidence/{evidenceId}/download:
    get:
      operationId: downloadPerformanceReviewEvidence
      tags: [performance-evidence]
      summary: Download a single evidence file
      description: >-
        Authorization-checked before any storage read (same own/reviewer-
        of-record/organization-wide tier as the review). No public or
        signed URL is ever generated — the file streams through this
        authenticated route on every request.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not authorized to access this review's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review or evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/courses:
    get:
      operationId: listLearningCourses
      tags: [learning-courses]
      summary: List an organization's Learning courses
      description: Broad read — any authenticated organization member holding learning.read.own may list courses.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
