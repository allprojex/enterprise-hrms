        notApplicableReason:
          type: ["string", "null"]

    PerformanceGoal:
      type: object
      required: [id, organizationId, reviewId, title, measurementType, weight, status, originType, approvalStatus, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        reviewId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        measurementType:
          type: string
          enum: [numeric, percentage, currency, boolean, rating, qualitative]
        target:
          type: ["string", "null"]
        actualResult:
          type: ["string", "null"]
        unit:
          type: ["string", "null"]
        weight:
          type: integer
        dueDate:
          type: ["string", "null"]
          format: date
        status:
          type: string
          enum: [not_started, in_progress, completed, missed]
        employeeComment:
          type: ["string", "null"]
        managerComment:
          type: ["string", "null"]
        computedScore:
          type: ["string", "null"]
        originType:
          type: string
          enum: [manager, employee_proposed]
        approvalStatus:
          type: string
          enum: [accepted, proposed, rejected]
        notApplicable:
          type: boolean
        notApplicableReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePerformanceReviewGoalInput:
      type: object
      required: [title, measurementType]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        measurementType:
          type: string
          enum: [numeric, percentage, currency, boolean, rating, qualitative]
        target:
          type: number
        unit:
          type: string
        weight:
          type: integer
          description: Must be 0 for a qualitative goal.
        dueDate:
          type: string
          format: date

    UpdatePerformanceReviewGoalInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        target:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        weight:
          type: integer
        dueDate:
          type: ["string", "null"]
          format: date
        employeeComment:
          type: ["string", "null"]
          description: >-
            W77 addition — the only field the goal's own employee may set
            on an already-`accepted` official goal, self_assessment only
            (§14's "enter comments on goals"). Structural fields above
            remain reviewer-only on an accepted goal.
        actualResult:
          type: ["number", "null"]
          description: >-
            W78 addition, reviewer-of-record only, manager_review only.
            Validated against the goal's own measurementType — rejected
            for qualitative, must be 0/1 for boolean, must match a
            configured rating-scale level for rating.
        managerComment:
          type: ["string", "null"]
          description: W78 addition, reviewer-of-record only, manager_review only.
        notApplicable:
          type: boolean
          description: W78 addition, reviewer-of-record only, manager_review only. Requires notApplicableReason.
        notApplicableReason:
          type: ["string", "null"]

    AcceptPerformanceReviewGoalInput:
      type: object
      description: All fields optional — accept-as-is, or edit-then-accept in the same action (§12).
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        target:
          type: ["number", "null"]
        unit:
          type: ["string", "null"]
        weight:
          type: integer
        dueDate:
          type: ["string", "null"]
          format: date

    RejectPerformanceReviewGoalInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Stored as the goal's managerComment.

    RateCompetencyInput:
      type: object
      description: >-
        Dual-purpose (W77 employee self-rating / W78 manager rating) —
        which fields apply is resolved server-side from the caller's
        relationship to the review, never a client-supplied flag. The
        review's own employee must supply employeeRatingValue
        (self_assessment only); the reviewer of record may supply any of
        managerRatingValue/managerComment/notApplicable/
        notApplicableReason (manager_review only).
      properties:
        employeeRatingValue:
          type: number
          description: Required for the employee path. Must match one of this review's own configured rating-scale level values.
        employeeComment:
          type: string
        managerRatingValue:
          type: number
          description: W78 addition, reviewer-of-record only. Must match one of this review's own configured rating-scale level values.
        managerComment:
          type: string
        notApplicable:
          type: boolean
          description: W78 addition, reviewer-of-record only. Requires notApplicableReason.
        notApplicableReason:
          type: string

    SelfAssessmentNotReadyError:
      type: object
      required: [error, problems]
      properties:
        error:
          type: string
        problems:
          type: array
          items:
            type: string
          description: Every readiness problem found, listed at once — not just the first.

    FinalizePerformanceReviewInput:
      type: object
      description: Both fields optional, but must be supplied together (or neither) — finalize with or without an override in the same call.
      properties:
        hrOverrideScore:
          type: number
          description: 0-100. computedOverallScore (the manager's own score) is preserved unedited alongside this.
        hrOverrideReason:
          type: string
          description: Mandatory whenever hrOverrideScore is supplied.

    ReopenPerformanceReviewInput:
      type: object
      required: [targetStage, reason]
      properties:
        targetStage:
          type: string
          enum: [self_assessment, manager_review, hr_review]
          description: Must be strictly earlier than the review's current status.
        reason:
          type: string
          minLength: 1

    AcknowledgePerformanceReviewInput:
      type: object
      description: Both fields optional — acknowledgement never requires a comment.
      properties:
        employeeFinalComment:
          type: string
          description: >-
            Optional final response, captured verbatim in employeeFinalComment.
            "I have seen this review," not agreement — never changes any score
            or review field, never constitutes a formal appeal.

    PerformanceReviewWithCompetencies:
      type: object
      required: [review, competencies, goals]
      properties:
        review:
          $ref: "#/components/schemas/PerformanceReview"
        competencies:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceReviewCompetency"
        goals:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceGoal"

    PerformanceReviewEvidence:
      type: object
      required: [id, organizationId, reviewId, goalId, employeeDocumentId, addedByMembershipId, addedAt, fileName, mimeType, fileSize, uploadedBy]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        reviewId:
          type: integer
        goalId:
          type: ["integer", "null"]
        employeeDocumentId:
          type: integer
          description: Points into the existing employee_documents table (§8.9) — no separate Performance storage layer.
        addedByMembershipId:
          type: ["integer", "null"]
        addedAt:
          type: string
          format: date-time
        fileName:
          type: string
          description: Original client-supplied filename, for display only — never used to build a storage path.
        mimeType:
          type: string
        fileSize:
          type: integer
        uploadedBy:
          type: ["integer", "null"]

    LearningCourse:
      type: object
      required:
        [
          id, organizationId, categoryCode, title, deliveryMode, mandatoryDefault,
          requiresApproval, hasAssessment, issuesCertificate, status, createdAt, updatedAt,
        ]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        categoryCode:
          type: string
          description: Free-text code from the training_category Master Data domain, not validated against the domain's item list.
        title:
          type: string
        description:
          type: ["string", "null"]
        deliveryMode:
          type: string
          enum: [self_paced, instructor_led]
        mandatoryDefault:
          type: boolean
          description: Informational default only — snapshotted onto each enrollment, overridable per-assignment (a later workstream's job).
        requiresApproval:
          type: boolean
        hasAssessment:
          type: boolean
        issuesCertificate:
          type: boolean
        certificateValidityMonths:
          type: ["integer", "null"]
          description: Null = certificate never expires. Only meaningful when issuesCertificate is true.
        status:
          type: string
          enum: [draft, active, archived]
        createdBy:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLearningCourseInput:
      type: object
      required: [categoryCode, title, deliveryMode]
      properties:
        categoryCode:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        deliveryMode:
          type: string
          enum: [self_paced, instructor_led]
        mandatoryDefault:
          type: boolean
        requiresApproval:
          type: boolean
        hasAssessment:
          type: boolean
        issuesCertificate:
          type: boolean
        certificateValidityMonths:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, active, archived]

    UpdateLearningCourseInput:
      type: object
      properties:
        categoryCode:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        deliveryMode:
          type: string
          enum: [self_paced, instructor_led]
        mandatoryDefault:
          type: boolean
        requiresApproval:
          type: boolean
        hasAssessment:
          type: boolean
        issuesCertificate:
          type: boolean
        certificateValidityMonths:
          type: ["integer", "null"]
          minimum: 1
        status:
          type: string
          enum: [draft, active, archived]

    LearningCourseSession:
      type: object
      required: [id, organizationId, courseId, scheduledAt, durationMinutes, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        courseId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        instructorEmployeeId:
          type: ["integer", "null"]
        capacity:
          type: ["integer", "null"]
          description: Null = uncapped. Configuration only — enforced against actual enrollments by a later workstream, never here.
        status:
          type: string
          enum: [scheduled, completed, cancelled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLearningCourseSessionInput:
      type: object
      required: [scheduledAt, durationMinutes]
      properties:
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        location:
          type: string
        meetingLink:
          type: string
        instructorEmployeeId:
          type: integer
        capacity:
          type: integer
          minimum: 1

    UpdateLearningCourseSessionInput:
      type: object
      description: >-
        Both ordinary field edits and an optional one-way status
        transition (completed/cancelled) may be supplied in the same call
        — only while the session is still 'scheduled'.
      properties:
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 1
        location:
          type: string
        meetingLink:
          type: string
        instructorEmployeeId:
          type: ["integer", "null"]
        capacity:
          type: ["integer", "null"]
          minimum: 1
        status:
          type: string
          enum: [completed, cancelled]
          description: One-way only — 'scheduled' is never a valid target value here.

