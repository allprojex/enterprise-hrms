      summary: List Master Data items for a domain
      description: >-
        System-defined items (shared by every organization) plus this
        organization's own items for the domain, sorted by sortOrder.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Master Data items for the domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataItem"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createMasterDataItem
      tags: [master-data]
      summary: Add an organization-specific Master Data item
      description: >-
        Rejected for system-defined domains, which never accept
        organization-added items.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataItemInput"
      responses:
        "201":
          description: Master Data item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataItem"
        "400":
          description: Domain is system-defined and does not accept organization-added items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An item with this code already exists for the domain in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles:
    get:
      operationId: listOrganizationRoles
      tags: [roles]
      summary: List roles available to this organization
      description: >-
        System role templates (see GET /roles) plus this organization's own
        customized copies.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles available to this organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationRole"
    post:
      operationId: copyRoleTemplate
      tags: [roles]
      summary: Copy a system role template into this organization
      description: >-
        Creates the organization's own customizable copy of a system role
        template, including the template's current permissions. The
        template itself is never modified (ADR-015).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRoleTemplateInput"
      responses:
        "201":
          description: Organization role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRole"
        "404":
          description: Unknown system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A role with this key already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions:
    post:
      operationId: grantRolePermission
      tags: [roles]
      summary: Grant a permission to an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRolePermissionInput"
      responses:
        "204":
          description: Permission granted
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role or permission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions/{permissionId}:
    delete:
      operationId: revokeRolePermission
      tags: [roles]
      summary: Revoke a permission from an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permission revoked
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit-events]
      summary: List audit events
      description: Paginated, most recent first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: eventType
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: actorApplicationUserId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List the report registry
      description: >-
        System-wide catalog of registered reports (not org-scoped), per the
        Reporting Foundation (ADR-016). A report appearing here does not mean
        the caller can run it — that's gated per-report by
        requiredPermissionKey, checked at run time.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /organizations/{organizationId}/reports/{reportKey}/run:
    get:
      operationId: runReport
      tags: [reports]
      summary: Run a report
      description: >-
        Computes a registered report scoped to this organization. Permission
        required varies by report (see GET /reports). Pass ?format=csv for a
        CSV download instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string

  /organizations/{organizationId}/recruitment/dashboard:
    get:
      operationId: getRecruitmentDashboard
      tags: [recruitment-reporting]
      summary: Recruitment dashboard summary
      description: >-
        Real-time counts (open requisitions, open vacancies, total
        applicants), a current pipeline-stage breakdown, and recruiter/
        hiring-manager workload — computed live, never cached. Organization-
        wide staff see every figure; an assigned recruiter or hiring manager
        sees only their own workload/pipeline scope.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruitmentDashboard"

  /organizations/{organizationId}/recruitment/reports/{reportKey}:
    get:
      operationId: runRecruitmentReport
      tags: [recruitment-reporting]
      summary: Run a recruitment report
      description: >-
        Computes a registered recruitment report (see GET /reports, category
        "recruitment") scoped to this organization and to the caller's
        recruitment visibility tier. Pass ?format=csv for a CSV download
        instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Recruitment report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string

  /organizations/{organizationId}/performance/rating-scales:
    get:
      operationId: listPerformanceRatingScales
      tags: [performance-rating-scales]
      summary: List an organization's Performance rating scales
      description: Broad read — any authenticated organization member holding performance.read.own may list rating scales.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rating scales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceRatingScale"
    post:
      operationId: createPerformanceRatingScale
      tags: [performance-rating-scales]
      summary: Create a Performance rating scale
      description: Requires performance.manage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePerformanceRatingScaleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceRatingScale"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/rating-scales/{id}:
    get:
      operationId: getPerformanceRatingScale
      tags: [performance-rating-scales]
      summary: Get a Performance rating scale with its levels
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rating scale with levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceRatingScaleWithLevels"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePerformanceRatingScale
      tags: [performance-rating-scales]
      summary: Update a Performance rating scale's name, description, or status
      description: Requires performance.manage. name/description/status are always editable — the level set itself is protected separately (see the /levels endpoint).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerformanceRatingScaleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceRatingScale"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/rating-scales/{id}/levels:
    patch:
      operationId: replacePerformanceRatingScaleLevels
      tags: [performance-rating-scales]
      summary: Replace a rating scale's full level set
      description: >-
        Requires performance.manage. Replace-all semantics — the submitted
        array becomes the scale's complete level set. Structurally blocked
        (409) once any Performance review has used this scale; archive it
        and create a new scale instead.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePerformanceRatingScaleLevelsInput"
      responses:
        "200":
          description: The scale's new level set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceRatingScaleLevel"
        "400":
          description: Invalid levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The scale's levels are locked because it has already been used by a review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/templates:
    get:
      operationId: listPerformanceReviewTemplates
      tags: [performance-templates]
      summary: List an organization's Performance review templates
      description: Broad read — any authenticated organization member holding performance.read.own may list templates.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceReviewTemplate"
    post:
      operationId: createPerformanceReviewTemplate
      tags: [performance-templates]
      summary: Create a Performance review template
      description: Requires performance.manage. ratingScaleId must belong to the same organization. goalsWeight + competenciesWeight must sum to exactly 100.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePerformanceReviewTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewTemplate"
        "400":
          description: Invalid input, or ratingScaleId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/templates/{id}:
    get:
      operationId: getPerformanceReviewTemplate
      tags: [performance-templates]
      summary: Get a Performance review template with its competencies
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template with competencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewTemplateWithCompetencies"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePerformanceReviewTemplate
      tags: [performance-templates]
      summary: Update a Performance review template
      description: >-
        Requires performance.manage. Templates carry no usage lock (a
        review snapshots competencies at creation time, so a later
        template edit never rewrites review history) — editing is blocked
        only while the template's own status is already "archived".
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerformanceReviewTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewTemplate"
        "400":
          description: Invalid input, or ratingScaleId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The template is archived and cannot be edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/templates/{id}/competencies:
    patch:
      operationId: replacePerformanceTemplateCompetencies
      tags: [performance-templates]
      summary: Replace a template's full competency set
      description: >-
        Requires performance.manage. Replace-all semantics. Competency
        weights must sum to exactly 100 when the template's
        competenciesWeight is greater than 0, and the set must be empty
        when it is 0. Blocked (409) while the template is archived.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePerformanceTemplateCompetenciesInput"
      responses:
        "200":
          description: The template's new competency set
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceTemplateCompetency"
        "400":
          description: Invalid competencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The template is archived and cannot be edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/cycles:
    get:
      operationId: listPerformanceCycles
      tags: [performance-cycles]
      summary: List an organization's Performance cycles
      description: Requires performance.manage — cycle/assignment configuration is HR/admin territory (W75), unlike the broader read grant W74's rating-scales/templates routes use.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Performance cycles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceCycle"
    post:
      operationId: createPerformanceCycle
      tags: [performance-cycles]
      summary: Create a Performance cycle
      description: Requires performance.manage. templateId/ratingScaleId must belong to the same organization and be 'active'. Created in 'draft' status.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePerformanceCycleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceCycle"
        "400":
          description: Invalid input, or template/rating scale not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/cycles/{id}:
    get:
      operationId: getPerformanceCycle
      tags: [performance-cycles]
      summary: Get a Performance cycle
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Performance cycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceCycle"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updatePerformanceCycle
      tags: [performance-cycles]
      summary: Update a Performance cycle, or transition its status
      description: >-
        Requires performance.manage. Configuration fields are only
        editable while the cycle is 'draft' (409 otherwise). status may
        only move draft->archived, open->closed, or closed->archived —
        'open' can never be set directly, only via generate-reviews.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerformanceCycleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceCycle"
        "400":
          description: Invalid input, or template/rating scale not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The cycle is not editable in its current status, or the requested status transition is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/cycles/{id}/generate-reviews:
    post:
      operationId: generatePerformanceReviews
      tags: [performance-cycles]
      summary: Open a draft cycle and bulk-assign Performance reviews to its eligible employees
      description: >-
        Requires performance.manage. The cycle must be 'draft' (409
        otherwise — this action runs exactly once per cycle). Resolves
        eligible employees per the cycle's own applicabilityScope
        (all_active/department/position use active employmentStatus
        automatically; manual requires an explicit employeeIds list, each
        validated to belong to this organization and be active). Creates
        one performance_reviews row per eligible employee directly in
        self_assessment status, with competencies snapshotted from the
        cycle's template — never goals, which W76 owns entirely. Flips the
        cycle to 'open' in the same atomic transaction.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePerformanceReviewsInput"
      responses:
        "201":
          description: Reviews generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePerformanceReviewsResult"
        "400":
          description: Invalid employeeIds, or an ineligible/cross-organization employee was named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The cycle is not in draft status — reviews were already generated, or the cycle is closed/archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews:
    get:
      operationId: listPerformanceReviews
      tags: [performance-reviews]
      summary: List an organization's Performance reviews (W80 — internal HR workspace)
      description: >-
        Requires performance.manage, organization-wide. Optional cycleId/
        employeeId/status/departmentId/positionId/reviewerId query filters —
        department/position/reviewer filter the review's own historical
        SNAPSHOT columns, never live employee data, so a later transfer
        never changes which reviews a filter surfaces. Paginated
        (items/total/page/pageSize), matching listEmployees' own
        established convention. The manager's own scoped view remains
        GET .../team-reviews (W78) — deliberately not duplicated here.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: cycleId
          in: query
          required: false
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, self_assessment, manager_review, hr_review, finalized, acknowledged]
        - name: departmentId
          in: query
          required: false
          description: Filters departmentIdSnapshot, not the employee's current department.
          schema:
            type: integer
        - name: positionId
          in: query
          required: false
          description: Filters positionIdSnapshot, not the employee's current position.
          schema:
            type: integer
        - name: reviewerId
          in: query
          required: false
          description: Filters the snapshotted reviewerEmployeeId.
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated Performance reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewListResponse"

  /organizations/{organizationId}/performance/reviews/{id}:
    get:
      operationId: getPerformanceReview
      tags: [performance-reviews]
      summary: Get a Performance review with its snapshotted competencies and goals
      description: >-
        Requires performance.read.own (own review, or reviewer-of-record
        via the review's own snapshotted reviewerEmployeeId) or
        performance.manage (organization-wide).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Review with competencies and goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceReviewWithCompetencies"
        "403":
          description: Not authorized to view this review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/goals:
    post:
      operationId: createPerformanceReviewGoal
      tags: [performance-reviews]
      summary: Propose (own review, self_assessment) or create an official goal (reviewer of record, draft/manager_review)
      description: >-
        Requires performance.write.own (own review, self_assessment only —
        inserted approvalStatus 'proposed', not yet official) or
        performance.review.write (reviewer of record, draft or
        manager_review only — inserted approvalStatus 'accepted'
        immediately, no separate approval step). Which path applies is
        resolved entirely from the caller's own server-derived
        relationship to the review, never a client-supplied flag.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePerformanceReviewGoalInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceGoal"
        "400":
          description: Invalid input for the goal's measurementType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this review's own employee or reviewer of record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not in a status that permits this action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/goals/{goalId}:
    patch:
      operationId: updatePerformanceReviewGoal
      tags: [performance-reviews]
      summary: Edit a goal
      description: >-
        Two disjoint paths: the employee may edit only their own
        still-proposed goal, only while self_assessment
        (performance.write.own); the reviewer of record may edit any goal
        on the review, only while manager_review (performance.review.write).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePerformanceReviewGoalInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceGoal"
        "400":
          description: Invalid input for the goal's measurementType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to edit this goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review or goal is not in a status that permits this edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/goals/{goalId}/accept:
    post:
      operationId: acceptPerformanceReviewGoal
      tags: [performance-reviews]
      summary: Reviewer of record accepts a proposed goal
      description: >-
        Requires performance.review.write (reviewer of record), review
        status manager_review. Optionally edits title/description/target/
        unit/weight/dueDate in the same atomic action. An atomic
        conditional update guards against a concurrent double-decision or
        a repeat/terminal-state redecision (409).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptPerformanceReviewGoalInput"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceGoal"
        "400":
          description: Invalid input, or not an employee-proposed goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this review's reviewer of record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not manager_review, or the goal was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/reviews/{id}/goals/{goalId}/reject:
    post:
      operationId: rejectPerformanceReviewGoal
      tags: [performance-reviews]
      summary: Reviewer of record rejects a proposed goal
      description: >-
        Requires performance.review.write (reviewer of record), review
        status manager_review. A reason is required (stored as
        managerComment). The goal is retained, never deleted, and
        permanently excluded from weighting/scoring. Same atomic
        conditional-update guard as accept.
      parameters:
