  /organizations/{organizationId}/employees/{employeeId}/leave-requests:
    get:
      operationId: listLeaveRequests
      tags: [leave-requests]
      summary: List an employee's leave requests
      description: >-
        Own resource, manager-scoped, or leave_request.manage (organization-
        wide) — gated by leave_request.read.own at the route level, refined
        by an authorization check against the specific employee. Gated by
        the "leave" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave requests for the employee, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
        "403":
          description: Not authorized to view this employee's leave requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createLeaveRequest
      tags: [leave-requests]
      summary: Submit a leave request
      description: >-
        Own resource only. The applicable leave policy is resolved
        server-side from the employee's eligibility — never client-supplied.
        Day count is calculated server-side from the policy's rules; the
        client's arithmetic is never trusted.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeaveRequestInput"
      responses:
        "201":
          description: Leave request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Invalid request, ineligible employee, or a conflicting/overlapping request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Can only submit a leave request for yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/leave-requests/{id}/cancel:
    post:
      operationId: cancelLeaveRequest
      tags: [leave-requests]
      summary: Withdraw a pending leave request
      description: Own resource only. Rejected if the request is not currently pending.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave request withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Request is not currently pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Can only withdraw your own leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Leave request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/leave-requests/pending-approvals:
    get:
      operationId: listPendingApprovals
      tags: [leave-approvals]
      summary: List pending leave requests the caller is authorized to act on
      description: >-
        Org-wide for leave_request.manage holders; otherwise scoped to
        direct reports only (employees.reportingManagerId). Gated by the
        "leave" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending requests the caller may approve or reject
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"

  /organizations/{organizationId}/leave-calendar:
    get:
      operationId: listLeaveCalendar
      tags: [leave-calendar]
      summary: Organization-scoped calendar of approved leave within a date range
      description: >-
        A read model over leave_requests — never a second source of truth.
        Only status "approved" is ever included. Org-wide for
        leave_request.manage holders; otherwise scoped to the caller's own
        approved leave plus their direct reports' (employees.
        reportingManagerId), same as leave-requests/pending-approvals.
        Confidential fields (reason, attachments, approval comments) are
        never returned. Holidays (W37) are overlaid as a separate, read-only
        list — never merged into leaveEntries and never represented as a
        leave request. The date range is bounded server-side. Gated by the
        "leave" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: true
          description: Inclusive range start, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive range end, YYYY-MM-DD. Range cannot exceed 100 days.
          schema:
            type: string
            format: date
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Approved leave and overlapping holidays within the requested range, visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveCalendarResponse"
        "400":
          description: Missing/invalid from or to, or the range exceeds 100 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/public-holidays:
    get:
      operationId: listPublicHolidays
      tags: [public-holidays]
      summary: List an organization's public holidays
      description: >-
        Active holidays by default; a recurring holiday always matches
        every year filter, since it applies every year regardless of its
        stored template year. Gated by the "leave" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Public holidays for the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"
    post:
      operationId: createPublicHoliday
      tags: [public-holidays]
      summary: Create a public holiday
      description: >-
        public_holiday.manage required — distinct from leave_request.approve
        and leave_type.manage, neither of which grants holiday management.
        scope is always "organization" in this phase regardless of what's
        sent. effectiveYear is required for a one-off holiday and rejected
        for a recurring one; observedDate is rejected for a recurring one.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
