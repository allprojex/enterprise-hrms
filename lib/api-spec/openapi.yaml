    get:
      operationId: listMasterDataDomains
      tags: [master-data]
      summary: List the Master Data domain registry
      description: >-
        System-wide catalog of Master Data domains (gender, marital_status,
        employment_type, ...) and their classification (system-defined,
        organization-overridable, organization-defined), not org-scoped.
      responses:
        "200":
          description: List of Master Data domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataDomain"

  /organizations/{organizationId}/master-data/{domain}:
    get:
      operationId: listMasterDataItems
      tags: [master-data]
      summary: List Master Data items for a domain
      description: >-
        System-defined items (shared by every organization) plus this
        organization's own items for the domain, sorted by sortOrder.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Master Data items for the domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataItem"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createMasterDataItem
      tags: [master-data]
      summary: Add an organization-specific Master Data item
      description: >-
        Rejected for system-defined domains, which never accept
        organization-added items.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataItemInput"
      responses:
        "201":
          description: Master Data item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataItem"
        "400":
          description: Domain is system-defined and does not accept organization-added items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An item with this code already exists for the domain in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles:
    get:
      operationId: listOrganizationRoles
      tags: [roles]
      summary: List roles available to this organization
      description: >-
        System role templates (see GET /roles) plus this organization's own
        customized copies.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles available to this organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationRole"
    post:
      operationId: copyRoleTemplate
      tags: [roles]
      summary: Copy a system role template into this organization
      description: >-
        Creates the organization's own customizable copy of a system role
        template, including the template's current permissions. The
        template itself is never modified (ADR-015).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRoleTemplateInput"
      responses:
        "201":
          description: Organization role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRole"
        "404":
          description: Unknown system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A role with this key already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions:
    post:
      operationId: grantRolePermission
      tags: [roles]
      summary: Grant a permission to an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRolePermissionInput"
      responses:
        "204":
          description: Permission granted
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role or permission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions/{permissionId}:
    delete:
      operationId: revokeRolePermission
      tags: [roles]
      summary: Revoke a permission from an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permission revoked
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit-events]
      summary: List audit events
      description: Paginated, most recent first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: eventType
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: actorApplicationUserId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List the report registry
      description: >-
        System-wide catalog of registered reports (not org-scoped), per the
        Reporting Foundation (ADR-016). A report appearing here does not mean
        the caller can run it — that's gated per-report by
        requiredPermissionKey, checked at run time.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /organizations/{organizationId}/reports/{reportKey}/run:
    get:
      operationId: runReport
      tags: [reports]
      summary: Run a report
      description: >-
        Computes a registered report scoped to this organization. Permission
        required varies by report (see GET /reports). Pass ?format=csv for a
        CSV download instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string

