            responsibilities:
              type: ["string", "null"]
            requirements:
              type: ["string", "null"]
            preferredQualifications:
              type: ["string", "null"]
            seoTitle:
              type: ["string", "null"]
            seoDescription:
              type: ["string", "null"]
            questions:
              type: array
              items:
