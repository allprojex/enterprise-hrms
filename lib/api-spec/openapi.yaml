        interview is marked completed, never a score/recommendation
        (W55's `interview_scorecards` is a separate table).
      required: [id, organizationId, applicationId, interviewType, scheduledAt, durationMinutes, location, meetingLink, status, outcome, createdAt, updatedAt, panelMembers]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, completed, cancelled, no_show]
        outcome:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/InterviewPanelMember"

    InterviewListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Interview"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ScheduleInterviewInput:
      type: object
      required: [interviewType, scheduledAt, durationMinutes]
      properties:
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/PanelMemberInput"

    UpdateInterviewInput:
      type: object
      description: >-
        Supplying scheduledAt reschedules — cancels the current row and
        creates a brand new one (§4.5), never mutating a scheduled
        interview's date in place. Omitting scheduledAt performs an ordinary
        in-place update, including a status transition to completed/no_show
        and/or a full panel replace.
      properties:
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        status:
          type: string
          enum: [completed, no_show]
        outcome:
          type: ["string", "null"]
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/PanelMemberInput"

    InterviewScorecardResponse:
      type: object
      description: >-
        One per-criterion answer within a scorecard. `criterion` is plain
        free text supplied per submission — no organization-configurable
        criteria/template table exists in this frozen scope. `rating` has no
        defined scale in the frozen plan and is kept an unconstrained
        integer, the same unconstrained-numeric posture application_scores.score
        (W52) already established for a comparable field. Immutable once the
        parent scorecard is submitted (in practice) / finalized (formally).
      required: [id, organizationId, scorecardId, criterion, rating, comment, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        scorecardId:
          type: integer
        criterion:
          type: string
        rating:
          type: ["integer", "null"]
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ResponseInput:
      type: object
      required: [criterion]
      properties:
        criterion:
          type: string
          minLength: 1
        rating:
          type: ["integer", "null"]
        comment:
          type: ["string", "null"]

    InterviewScorecard:
      type: object
      description: >-
        One per panel member per interview. Deliberately never exposes
        externalInterviewerToken/expiry (reserved for a later workstream,
        never consumed by any route here — an internal-only column, never a
        DTO field, so a raw token can never leak through this API even once
        another workstream starts populating it). No weighting/rollup number
        exists in the frozen model — recommendation is the only structured
        summary field.
      required: [id, organizationId, interviewId, interviewerMembershipId, recommendation, overallComment, submittedAt, finalizedAt, createdAt, updatedAt, responses]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        interviewId:
          type: integer
        interviewerMembershipId:
          type: ["integer", "null"]
        recommendation:
          type: ["string", "null"]
          enum: [strong_yes, yes, no, strong_no]
        overallComment:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
          format: date-time
          description: Null while still a draft. Set exactly once — a submitted scorecard is immutable from the owning interviewer's side.
        finalizedAt:
          type: ["string", "null"]
          format: date-time
          description: Set only by an HR/recruiter administrator (scorecard.finalize) — never by the submitting interviewer themselves.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        responses:
          type: array
          items:
            $ref: "#/components/schemas/InterviewScorecardResponse"

    SaveInterviewScorecardInput:
      type: object
      properties:
        recommendation:
          type: ["string", "null"]
          enum: [strong_yes, yes, no, strong_no]
        overallComment:
          type: ["string", "null"]
        responses:
          type: array
          items:
            $ref: "#/components/schemas/ResponseInput"
          description: Full replace of the response set on every save.
        submit:
          type: boolean
          description: When true, transitions this draft to submitted in the same call.

    RecommendationCounts:
      type: object
      required: [strong_yes, yes, no, strong_no]
      properties:
        strong_yes:
          type: integer
        yes:
          type: integer
        no:
          type: integer
        strong_no:
          type: integer

    InterviewScorecardListResponse:
      type: object
      required: [scorecards, panelSummary]
      properties:
        scorecards:
          type: array
          items:
            $ref: "#/components/schemas/InterviewScorecard"
        panelSummary:
          type: ["object", "null"]
          description: >-
            Computed on every read, never stored — the same discipline as
            W52's scoreRollup. Null unless the caller holds scorecard.read_all.
          required: [totalPanelMembers, submittedCount, pendingCount, recommendationCounts]
          properties:
            totalPanelMembers:
              type: integer
            submittedCount:
              type: integer
            pendingCount:
              type: integer
            recommendationCounts:
              $ref: "#/components/schemas/RecommendationCounts"

    ReferenceBackgroundCheckStatus:
      type: string
      description: Shared status model (§4.7) for both reference and background checks. No "cancelled"/"expired" state exists — a check that can't be completed is recorded as unable_to_complete.
      enum: [requested, in_progress, completed, flagged, unable_to_complete]

    ReferenceCheck:
      type: object
      description: >-
        Referee contact + outcome, status-tracked, no vendor integration.
        Column list is exactly §9's `reference_checks` row. No dedicated
        reference-check permission exists — visibility/write reuse the
        application's own read/manage pair.
      required: [id, organizationId, applicationId, refereeName, refereeContact, refereeRelationship, status, notes, completedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        refereeName:
          type: string
        refereeContact:
          type: string
        refereeRelationship:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ReferenceBackgroundCheckStatus"
        notes:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateReferenceCheckInput:
      type: object
      required: [refereeName, refereeContact]
      properties:
        refereeName:
          type: string
          minLength: 1
        refereeContact:
          type: string
          minLength: 1
        refereeRelationship:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    UpdateReferenceCheckStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, flagged, unable_to_complete]
        notes:
          type: ["string", "null"]

    BackgroundCheck:
      type: object
      description: >-
        Background check tracking, status-tracked, no vendor integration —
        vendorReference is a plain, manually-entered string, never a real
        provider API call. Column list is exactly §9's `background_checks`
        row, minus the raw documentStorageKey (never exposed — hasEvidence
        signals its presence instead). Gated by its own dedicated
        background_check.read/.manage pair, organization-wide only.
      required: [id, organizationId, applicationId, checkType, status, vendorReference, resultSummary, hasEvidence, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        checkType:
          type: string
          description: Free text — no organization-configurable criteria/type table exists in this frozen scope.
        status:
          $ref: "#/components/schemas/ReferenceBackgroundCheckStatus"
        vendorReference:
          type: ["string", "null"]
        resultSummary:
          type: ["string", "null"]
        hasEvidence:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateBackgroundCheckInput:
      type: object
      required: [checkType]
      properties:
        checkType:
          type: string
          minLength: 1
        vendorReference:
          type: ["string", "null"]

    UpdateBackgroundCheckStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, flagged, unable_to_complete]
        resultSummary:
          type: ["string", "null"]
        vendorReference:
          type: ["string", "null"]

    OfferVersion:
      type: object
      description: >-
        One immutable revision of an offer's content — column list is
        exactly §9's `offer_versions` row, minus the raw
        generatedDocumentStorageKey (a reserved, never-populated internal
        file-storage reference, never exposed — same DTO-shaping discipline
        as W55/W56's own stripped internal-only columns). letterTemplateId
        is a plain, unpopulated reserved FK-shaped integer — no offer-letter
        template mechanism exists in this workstream's scope.
      required:
        - id
        - organizationId
        - offerId
        - versionNumber
        - proposedStartDate
        - employmentType
        - workplaceType
        - location
        - compensationSummary
        - conditions
        - expiryDate
        - letterTemplateId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        offerId:
          type: integer
        versionNumber:
          type: integer
        proposedStartDate:
          type: ["string", "null"]
          format: date
        employmentType:
          type: ["string", "null"]
          enum: [full_time, part_time, contract, intern, temporary, null]
        workplaceType:
          type: ["string", "null"]
          enum: [onsite, remote, hybrid, null]
        location:
          type: ["string", "null"]
        compensationSummary:
          description: Recruitment-scoped fields only (base salary, currency, bonus, benefits summary) — never a full payroll/compensation structure. Caller-supplied, unvalidated shape.
          type: ["object", "null"]
          additionalProperties: true
        conditions:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date
        letterTemplateId:
          type: ["integer", "null"]
          description: Reserved — no offer-letter template mechanism exists in this workstream's scope. Always null.
        status:
          type: string
          enum: [draft, pending_approval, approved, issued, accepted, declined, expired, withdrawn, superseded]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Offer:
      type: object
      description: >-
        A stable envelope per application — the actual content lives in
        OfferVersion, never here (§14). currentVersionId always points at
        the latest non-superseded version.
      required: [id, organizationId, applicationId, currentVersionId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        currentVersionId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OfferDetail:
      type: object
      required: [offer, versions]
      properties:
        offer:
          $ref: "#/components/schemas/Offer"
        versions:
          type: array
          description: Every version of this offer, oldest first (versionNumber ascending) — including superseded ones, for full history.
          items:
            $ref: "#/components/schemas/OfferVersion"

    OfferListItem:
      type: object
      required: [offer, currentVersion, vacancyTitle, applicationId]
      properties:
        offer:
          $ref: "#/components/schemas/Offer"
        currentVersion:
          description: >-
            Null only for the brief instant between creating the offer
            envelope and its first version within the same transaction —
            never observable via this list endpoint in practice. Inlined
            (not $ref'd) because a nullable $ref/allOf combination breaks
            this repo's orval codegen (see the `offers` tag description /
            W55's own documented fix for the same issue).
          type: ["object", "null"]
          required:
            - id
            - organizationId
            - offerId
            - versionNumber
            - proposedStartDate
            - employmentType
            - workplaceType
            - location
            - compensationSummary
            - conditions
            - expiryDate
            - letterTemplateId
            - status
            - createdAt
            - updatedAt
          properties:
            id:
              type: integer
            organizationId:
              type: integer
            offerId:
              type: integer
            versionNumber:
              type: integer
            proposedStartDate:
              type: ["string", "null"]
              format: date
            employmentType:
              type: ["string", "null"]
              enum: [full_time, part_time, contract, intern, temporary, null]
            workplaceType:
              type: ["string", "null"]
              enum: [onsite, remote, hybrid, null]
            location:
              type: ["string", "null"]
            compensationSummary:
              type: ["object", "null"]
              additionalProperties: true
            conditions:
              type: ["string", "null"]
            expiryDate:
              type: ["string", "null"]
              format: date
            letterTemplateId:
              type: ["integer", "null"]
            status:
              type: string
              enum: [draft, pending_approval, approved, issued, accepted, declined, expired, withdrawn, superseded]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        vacancyTitle:
          type: string
        applicationId:
          type: integer

    OfferListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OfferListItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    OfferApproval:
      type: object
      description: >-
        A single approval step's decision record — mirrors
        RequisitionApproval exactly (§9's own "mirrors requisition_approvals"
        instruction). This workstream writes only sequence 1. No reject
        route exists (see the `offers` tag description) — "rejected" is a
        structurally valid but currently unreachable decision value.
      required: [id, organizationId, offerVersionId, sequence, approverMembershipId, decision, decidedAt, comment, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        offerVersionId:
          type: integer
        sequence:
          type: integer
        approverMembershipId:
          type: ["integer", "null"]
          description: Resolved at decision time (who actually decided) — null while pending.
        decision:
          type: string
          enum: [pending, approved, rejected]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CreateOfferInput:
      type: object
      description: Fields for the offer's first (draft) version. Every field is optional — an empty draft can be created and filled in later via PATCH.
      properties:
        proposedStartDate:
          type: ["string", "null"]
          format: date
        employmentType:
          type: ["string", "null"]
          enum: [full_time, part_time, contract, intern, temporary, null]
        workplaceType:
          type: ["string", "null"]
          enum: [onsite, remote, hybrid, null]
        location:
          type: ["string", "null"]
        compensationSummary:
          type: ["object", "null"]
          additionalProperties: true
        conditions:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date

    UpdateOfferVersionInput:
      type: object
      description: Used both for PATCH .../offers/{id} (edit the current draft in place) and POST .../offers/{id}/versions (create a new draft from an approved/issued version) — same field shape either way.
      properties:
        proposedStartDate:
          type: ["string", "null"]
          format: date
        employmentType:
          type: ["string", "null"]
          enum: [full_time, part_time, contract, intern, temporary, null]
        workplaceType:
          type: ["string", "null"]
          enum: [onsite, remote, hybrid, null]
        location:
          type: ["string", "null"]
        compensationSummary:
          type: ["object", "null"]
          additionalProperties: true
        conditions:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date

    ApproveOfferVersionInput:
      type: object
      properties:
        comment:
          type: ["string", "null"]

    WithdrawOfferVersionInput:
      type: object
      properties:
        reason:
          type: ["string", "null"]

    PreEmploymentRequirement:
      type: object
      description: >-
        A single checklist item tracked against an application before
        employee conversion. Column list is exactly §9's
        `pre_employment_requirements` row. No dedicated permission exists —
        visibility/write reuse the application's own read/manage pair.
        requirementCode is a Master Data reference (free text, not
        FK-validated), the same convention as candidate_documents.categoryCode.
      required: [id, organizationId, applicationId, requirementCode, status, satisfiedAt, notes, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        requirementCode:
          type: string
          description: Free text (e.g. right-to-work doc, medical, reference-complete) — no fixed/Ghana-specific list is hard-coded.
        status:
          type: string
          enum: [pending, satisfied, waived]
        satisfiedAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PreEmploymentRequirementSummary:
      type: object
      description: Computed on every read, never stored — the same discipline as W52's scoreRollup/W55's panelSummary.
      required: [totalCount, pendingCount, satisfiedCount, waivedCount, readyForConversion]
      properties:
        totalCount:
          type: integer
        pendingCount:
          type: integer
        satisfiedCount:
          type: integer
        waivedCount:
          type: integer
        readyForConversion:
          type: boolean
          description: Mirrors §13's own convert-to-employee readiness rule ("every non-waived row is satisfied"). Vacuously true when no requirements are tracked. Informational only — does not itself gate or trigger conversion.

    PreEmploymentRequirementListResponse:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PreEmploymentRequirement"
        summary:
          $ref: "#/components/schemas/PreEmploymentRequirementSummary"

    CreatePreEmploymentRequirementInput:
      type: object
      required: [requirementCode]
      properties:
        requirementCode:
          type: string
          minLength: 1
        notes:
          type: ["string", "null"]

    UpdatePreEmploymentRequirementStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, satisfied, waived]
        notes:
          type: ["string", "null"]

    CandidateEmployeeLink:
