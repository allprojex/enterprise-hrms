                  $ref: "#/components/schemas/LearningCourse"
    post:
      operationId: createLearningCourse
      tags: [learning-courses]
      summary: Create a Learning course
      description: >-
        Requires learning.manage. categoryCode is a free-text code from the
        training_category Master Data domain, not validated against the
        domain's item list (§8.1). certificateValidityMonths may only be
        supplied when issuesCertificate is true.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearningCourseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/courses/{id}:
    get:
      operationId: getLearningCourse
      tags: [learning-courses]
      summary: Get a Learning course
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateLearningCourse
      tags: [learning-courses]
      summary: Update a Learning course
      description: >-
        Requires learning.manage. Courses carry no usage lock (an
        enrollment snapshots the course's own fields at creation time, so a
        later course edit never rewrites enrollment history) — editing is
        blocked only while the course's own status is already "archived".
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLearningCourseInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The course is archived and cannot be edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/courses/{id}/sessions:
    get:
      operationId: listLearningCourseSessions
      tags: [learning-course-sessions]
      summary: List a course's scheduled sessions
      description: Broad read — any authenticated organization member holding learning.read.own may list sessions.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCourseSession"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createLearningCourseSession
      tags: [learning-course-sessions]
      summary: Schedule a session for a course
      description: >-
        Requires learning.manage. instructorEmployeeId, if supplied, must
        belong to the same organization.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearningCourseSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourseSession"
        "400":
          description: Invalid input, or instructorEmployeeId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/sessions/{id}:
    get:
      operationId: getLearningCourseSession
      tags: [learning-course-sessions]
      summary: Get a Learning course session
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourseSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateLearningCourseSession
      tags: [learning-course-sessions]
      summary: Edit a session, or transition it to completed/cancelled
      description: >-
        Requires learning.manage. A single atomic conditional
        UPDATE ... WHERE status = 'scheduled' performs both ordinary field
        edits and, optionally in the same call, the one-way transition to
        completed/cancelled (§10.2) — once a session leaves 'scheduled' it
        is permanently locked, no further edit or transition of any kind
        is ever permitted. A concurrent or repeat transition affects zero
        rows and returns 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLearningCourseSessionInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCourseSession"
        "400":
          description: Invalid input, or instructorEmployeeId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The session is no longer scheduled and can no longer be edited or transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/courses/{id}/enroll:
    post:
      operationId: requestLearningEnrollment
      tags: [learning-enrollments]
      summary: Employee self-enrolls or requests enrollment in a course
      description: >-
        Requires learning.write.own. Employee identity is always
        server-derived — never a client-supplied employeeId. sessionId is
        required for an instructor-led course, forbidden for a self-paced
        one. approvalStatus starts 'pending' if the course requires
        approval, else 'auto_approved'; status is always 'assigned'
        regardless (§10.3). A duplicate non-terminal enrollment for the
        same course/session is rejected 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestLearningEnrollmentInput"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "400":
          description: Invalid input (e.g. missing/unexpected sessionId for this course's delivery mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Course/session not open for enrollment, session at capacity, or a duplicate non-terminal enrollment already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/courses/{id}/assign:
    post:
      operationId: assignLearningEnrollments
      tags: [learning-enrollments]
      summary: Assign a course to one or more employees (HR/L&D bulk-assign, or a manager assigning direct reports)
      description: >-
        Requires learning.manage (full audience targeting — all_active/
        department/position/manual, any employee in the organization) or
        learning.review.write (manager of record — scope must be 'manual',
        and every employeeId must be the caller's own direct report,
        server-verified). Both paths bypass approval entirely
        (approvalStatus = auto_approved) — the assigner's own authority is
        the approval. An eligible employee who already holds a
        non-terminal enrollment for the target course/session is skipped,
        not treated as a whole-batch failure; the result reports both
        counts.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLearningEnrollmentsInput"
      responses:
        "201":
          description: Assignment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignLearningEnrollmentsResult"
        "400":
          description: Invalid input, a manager attempting audience-targeting scope, or a cross-organization employee/department/position reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: A manager attempting to assign an employee who is not their direct report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Course/session not open for enrollment, or session at capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/my-enrollments:
    get:
      operationId: listMyLearningEnrollments
      tags: [learning-enrollments]
      summary: List the caller's own Learning enrollments
      description: Requires learning.read.own. employeeId is always server-resolved from the caller's own employee_user_links row, never client-supplied. Returns an empty array if the caller has no linked employee record.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The caller's own enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningEnrollment"

  /organizations/{organizationId}/learning/team-enrollments:
    get:
      operationId: listTeamLearningEnrollments
      tags: [learning-enrollments]
      summary: Manager — enrollments where the caller is the manager of record
      description: Requires learning.review.write. managerEmployeeIdSnapshot is always server-resolved, never client-supplied. Returns an empty array if the caller has no linked employee record.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Enrollments where the caller is the manager of record
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningEnrollment"

  /organizations/{organizationId}/learning/enrollments:
    get:
      operationId: listLearningEnrollments
      tags: [learning-enrollments]
      summary: List an organization's Learning enrollments (internal HR/L&D workspace)
      description: >-
        Requires learning.manage, organization-wide. Optional courseId/
        employeeId/status/approvalStatus query filters. Paginated
        (items/total/page/pageSize). The manager's own scoped view remains
        GET .../team-enrollments — deliberately not duplicated here.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [assigned, in_progress, completed, failed, cancelled]
        - name: approvalStatus
          in: query
          required: false
          schema:
            type: string
            enum: [auto_approved, pending, approved, rejected]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated Learning enrollments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollmentListResponse"

  /organizations/{organizationId}/learning/enrollments/{id}:
    get:
      operationId: getLearningEnrollment
      tags: [learning-enrollments]
      summary: Get a Learning enrollment
      description: Requires learning.read.own (own, manager-of-record, or instructor-of-record) or learning.manage (organization-wide).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "403":
          description: Not authorized to view this enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/approve:
    post:
      operationId: approveLearningEnrollment
      tags: [learning-enrollments]
      summary: Approve a pending employee-requested enrollment
      description: >-
        Requires learning.review.write (manager of record only) or
        learning.manage (organization-wide). The enrollment's own employee
        may never decide their own request. Atomic conditional
        UPDATE ... WHERE approvalStatus = 'pending' — a repeat or
        already-decided request returns 409, never a silent overwrite.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "403":
          description: Not this enrollment's manager of record, or an attempt to decide one's own request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This enrollment is not awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/reject:
    post:
      operationId: rejectLearningEnrollment
      tags: [learning-enrollments]
      summary: Reject a pending employee-requested enrollment
      description: >-
        Identical authorization/atomicity to the approve route. A rejected
        enrollment is permanently inert (status remains 'assigned' but can
        never progress) — never physically deleted, never silently
        converted into a cancellation.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "403":
          description: Not this enrollment's manager of record, or an attempt to decide one's own request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This enrollment is not awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/cancel:
    post:
      operationId: cancelLearningEnrollment
      tags: [learning-enrollments]
      summary: Cancel an enrollment
      description: >-
        Requires learning.write.own (the enrollment's own employee,
        non-mandatory, only while still 'assigned', no reason required) or
        learning.manage (any non-terminal enrollment, reason always
        required — §10.5). Atomic conditional
        UPDATE ... WHERE status IN ('assigned','in_progress').
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelLearningEnrollmentInput"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "400":
          description: cancelReason missing where required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this enrollment's own employee (without learning.manage), or a mandatory enrollment being self-cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This enrollment can no longer be cancelled (already terminal, or already in_progress for an employee's own non-mandatory cancel attempt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/progress:
    patch:
      operationId: advanceLearningEnrollmentProgress
      tags: [learning-enrollments]
      summary: Employee advances their own self-paced enrollment (assigned → in_progress → completed)
      description: >-
        Requires learning.write.own, own enrollment, self-paced delivery
        mode only (instructor-led completion belongs to the instructor of
        record or HR/L&D, a later workstream). There is no numeric
        "percentage complete" — only the two one-way transitions
        assigned→in_progress and in_progress→completed, each an atomic
        conditional update guarded by the enrollment's current `status`
        (§10.3.1) — a concurrent or repeat call against the same prior
        state returns a controlled 409, never a silent double-transition.
        The enrollment must also have `approvalStatus` of `auto_approved`
        or `approved` — approval gates actionability, not row existence
        (§0, §10.3) — a still-`pending` or `rejected` request 409s. This
        route never accepts or records an assessment result
        (`passed`/`score`) — an employee can never grade themselves,
        regardless of `hasAssessmentSnapshot` (§10.3.1, §11).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceLearningEnrollmentProgressInput"
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "400":
          description: Invalid target status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this enrollment's own employee, or the enrollment is not self-paced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Not yet approved, or the enrollment is not in the expected prior state for this transition (already advanced, already terminal, or a concurrent request already won)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/attendance:
    post:
      operationId: markLearningEnrollmentAttendance
      tags: [learning-enrollments]
      summary: Record attendance for an instructor-led enrollment
      description: >-
        Requires learning.review.write (the session's own instructor of
        record, a live comparison against the session's instructorEmployeeId
        — never inferred from role or from holding the permission alone) or
        learning.manage (HR/L&D, organization-wide). Instructor-led only —
        a self-paced enrollment has no session to attend. Attendance is a
        separate fact from status (§10.3) and does not by itself transition
        it. Recorded once — an atomic conditional update guarded by both
        the enrollment's non-terminal status and attended still being null;
        a repeat or concurrent call, or a call against an already-terminal
        enrollment, returns a controlled 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkLearningEnrollmentAttendanceInput"
      responses:
        "200":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "400":
          description: This enrollment is self-paced — attendance does not apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this session's own instructor, and not learning.manage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Attendance already recorded, or the enrollment is no longer in a non-terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/complete:
    post:
      operationId: completeLearningEnrollment
      tags: [learning-enrollments]
      summary: Complete an enrollment (instructor-led, or HR/L&D administrative completion of any enrollment)
      description: >-
        Requires learning.review.write (the session's own instructor of
        record, instructor-led enrollments only) or learning.manage (HR/L&D,
        any enrollment organization-wide — the only path for a self-paced
        enrollment, since no instructor-of-record relationship exists
        without a session). When the enrollment's own hasAssessmentSnapshot
        is true, `passed` is required and determines the resulting status
        server-side (completed if true, failed if false — never accepted
        directly from the caller, §10.3); when false, `passed`/`score` must
        not be supplied at all. The employee can never complete an assessed
        enrollment through their own `.../progress` route — this is the
        only route that can. Atomic conditional update guarded by
        non-terminal status — a concurrent or repeat completion, or one
        against an already-terminal enrollment, returns a controlled 409.
        Certificate issuance is not performed by this route — W90 owns
        issuance exclusively, per this workstream's own frozen STOP
        boundary.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLearningEnrollmentInput"
      responses:
        "200":
          description: Completed (or failed, for an assessed course with passed=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollment"
        "400":
          description: passed missing for an assessed course, or passed/score supplied where no assessment applies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this session's own instructor and not learning.manage, or a self-paced enrollment without learning.manage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The enrollment is no longer in a non-terminal state (already completed/failed/cancelled, or a concurrent request already won)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/my-certificates:
    get:
      operationId: listMyLearningCertificates
      tags: [learning-certificates]
      summary: List the caller's own Learning certificates
      description: Requires learning.read.own. employeeId is always server-resolved from the caller's own employee_user_links row. "Expired" is never a stored status — compute it client-side from expiresAt < now(); status here is only ever active or revoked (§10.4 rule 9).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The caller's own certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningCertificate"

  /organizations/{organizationId}/learning/certificates:
    get:
      operationId: listLearningCertificates
      tags: [learning-certificates]
      summary: List an organization's Learning certificates (org-wide)
      description: >-
        Requires learning.manage, organization-wide. No manager-of-record
        or instructor-of-record certificate visibility route exists —
        §21's own frozen table names only own (my-certificates) and
        org-wide (this route) for certificates; none other is built.
        Paginated (items/total/page/pageSize), mirroring
        LearningEnrollmentListResponse's own established shape.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, revoked]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated Learning certificates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCertificateListResponse"

  /organizations/{organizationId}/learning/certificates/{id}/revoke:
    post:
      operationId: revokeLearningCertificate
      tags: [learning-certificates]
      summary: Revoke an active certificate
      description: >-
        Requires learning.manage. Mandatory revokeReason. Permanently
        terminal — active → revoked only, no restore/un-revoke/reopen path
        exists anywhere (§10.4 rule 8). Atomic conditional update guarded
        by status = 'active' — a repeat or concurrent revocation returns a
        controlled 409.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeLearningCertificateInput"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningCertificate"
        "400":
          description: revokeReason missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Certificate not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/dashboard:
    get:
      operationId: getLearningDashboard
      tags: [learning-reporting]
      summary: Learning dashboard — zero-filled enrollment tile breakdown
      description: >-
        Requires learning.reports.read. Scope resolved in the service layer
        exactly like performance.reports.read: learning.manage holders see
        the whole organization; everyone else sees only enrollments where
        they are the enrollment's own employee or its snapshotted
        managerEmployeeIdSnapshot. activeCourseCount is always
        organization-wide (course catalog existence isn't sensitive
        enrollment data). overdueCount excludes every terminal status
        (completed/failed/cancelled), not merely "not yet completed".
        certificatesExpiringSoonCount uses a fixed 30-day window. Plain
        counts only — no completion percentage or average-score tile.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard tile breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningDashboard"

  /organizations/{organizationId}/learning/reports/{reportKey}:
    get:
      operationId: runLearningReport
      tags: [learning-reporting]
      summary: Run a Learning report
      description: >-
        Computes a registered Learning report (see GET /reports, category
        "learning": learning_enrollment_status, learning_completion_summary,
        learning_certificate_expiry) over the caller's own/manager-of-
        record/organization-wide visibility tier (identical to the
        dashboard). No instructor-of-record reporting tier exists.
        learning_completion_summary is a per-course aggregate; its
        completionPercentage excludes pending-approval and rejected
        enrollments from the denominator, and excludes cancelled
        enrollments, but includes failed. Pass ?format=csv for a CSV
        download instead of JSON — CSV scope is always identical to the
        already-authorized JSON scope.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: Enrollment status for learning_enrollment_status; certificate status (active/revoked) for learning_certificate_expiry.
          schema:
            type: string
        - name: approvalStatus
          in: query
          required: false
          schema:
            type: string
            enum: [auto_approved, pending, approved, rejected]
        - name: departmentId
          in: query
          required: false
          description: Filters departmentIdSnapshot, not the employee's current department.
          schema:
            type: integer
        - name: positionId
          in: query
          required: false
          description: Filters positionIdSnapshot, not the employee's current position.
          schema:
            type: integer
        - name: managerId
          in: query
          required: false
          description: Filters the snapshotted managerEmployeeIdSnapshot.
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Learning report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string
        "404":
          description: Unknown Learning report key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/evidence:
    get:
      operationId: listLearningEnrollmentEvidence
      tags: [learning-evidence]
      summary: List an enrollment's evidence
      description: >-
        Visible to the same own/manager-of-record/instructor-of-record/
        organization-wide tier as the enrollment itself (§21's own frozen
        row) — no stage/status restriction, at any enrollment status,
        including terminal.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence attached to this enrollment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningEnrollmentEvidence"
        "403":
          description: Not authorized to view this enrollment's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addLearningEnrollmentEvidence
      tags: [learning-evidence]
      summary: Attach evidence to an enrollment
      description: >-
        multipart/form-data upload. Reuses the existing employee_documents
        storage layer verbatim (§18) — PDF, JPEG, PNG, DOCX, and XLSX
        only, validated by file signature, 10MB max, identical to every
        other document upload on this platform. Same own/manager-of-
        record/instructor-of-record/organization-wide tier as the
        enrollment itself, no stage/status restriction.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningEnrollmentEvidence"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to add evidence to this enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/learning/enrollments/{id}/evidence/{evidenceId}/download:
    get:
      operationId: downloadLearningEnrollmentEvidence
      tags: [learning-evidence]
      summary: Download a single evidence file
      description: >-
        Authorization-checked before any storage read (same own/manager-
        of-record/instructor-of-record/organization-wide tier as the
        enrollment). No public or signed URL is ever generated — the file
        streams through this authenticated route on every request.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not authorized to access this enrollment's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Enrollment or evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List an organization's assets (Asset Register)
      description: >-
        Requires asset_management.manage, organization-wide (§20 — the
        register itself is HR/Asset Officer only in V1, no broader own-scope
        catalog rule is frozen). Optional status/condition/categoryCode/
        branchId/search query filters. Paginated (items/total/page/pageSize).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [available, assigned, maintenance, lost, retired]
        - name: condition
          in: query
          required: false
          schema:
            type: string
            enum: [new, good, fair, poor, damaged]
        - name: categoryCode
          in: query
          required: false
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Matches asset tag, name, serial number, manufacturer, or model.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
    post:
      operationId: createAsset
      tags: [assets]
      summary: Register a new asset
      description: >-
        Requires asset_management.manage. assetTag is always server-generated
        (sequential, per-organization) — never client-supplied. status always
        starts "available" — never client-supplied. categoryCode is
        free-text from the asset_category Master Data domain, not validated
        against the domain's item list (§4, §5, Owner Decision 8). A
        submitted empty-string serialNumber is stored as null. branchId, when
        supplied, must belong to the caller's own organization.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input, or branchId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}:
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get an asset
      description: >-
        Requires asset_management.read.own — org-wide reach for a caller who
        additionally holds asset_management.manage, otherwise only if the
        caller currently holds this specific asset via an active assignment
        (§20's own frozen dual-floor; no assignment exists until W97 ships,
        so this narrower reach is presently unreachable in practice but is
        implemented exactly as frozen).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "403":
          description: Not authorized to view this asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset's base register fields
      description: >-
        Requires asset_management.manage. Base register fields only — never
        status, never condition (each has its own dedicated, mandatory-
        reason, audited action: retire/mark-lost/recover and
        POST .../condition respectively). assetTag is never editable
        (server-generated only). branchId, when supplied, must belong to the
        caller's own organization.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input, or a referenced organization-scoped ID does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicate serial number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/retire:
    post:
      operationId: retireAsset
      tags: [assets]
      summary: Retire an asset (permanently terminal)
      description: >-
        Requires asset_management.manage. Mandatory reason. Allowed only
        from available/maintenance/lost — never directly from assigned (the
        assign-side custody must close first, W97). Retired is permanently
        terminal — no reopen path exists anywhere (§7, Owner Decision 10).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetireAssetInput"
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Currently assigned (return it first), or already retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/mark-lost:
    post:
      operationId: markAssetLost
      tags: [assets]
      summary: Mark an asset lost
      description: >-
        Requires asset_management.manage. Mandatory reason. Allowed from
        available/assigned/maintenance. If the asset currently has an active
        assignment, that custody period is closed in the same transaction
        (endReason=lost) — the transition's own defined effect, not an
        assign/return action in its own right.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAssetLostInput"
      responses:
        "200":
          description: Marked lost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already lost or retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/recover:
    post:
      operationId: recoverAsset
      tags: [assets]
      summary: Recover a lost asset back to available
      description: Requires asset_management.manage. Mandatory reason. Allowed only from lost.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoverAssetInput"
      responses:
        "200":
          description: Recovered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Not currently lost
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/condition:
    post:
      operationId: updateAssetCondition
      tags: [assets]
      summary: Record a condition change for an asset
      description: >-
        Requires asset_management.manage. Mandatory reason, always audited.
        Condition is kept structurally separate from status (§7) — never
        editable through the base-field PATCH.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetConditionInput"
      responses:
        "200":
          description: Condition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/assign:
    post:
      operationId: assignAsset
      tags: [assets]
      summary: Assign an asset to an employee (issue custody)
      description: >-
        Requires asset_management.manage. available -> assigned only (§7).
        Atomic — the status transition and the new asset_assignments
        history row are created in one transaction. employeeId must belong
        to the caller's own organization. issueCondition defaults to the
        asset's own current condition when omitted. Snapshots
        (assetTag/name/category/department/position) are captured
        server-side at this moment and never later rewritten by an asset or
        employee edit (§14).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAssetInput"
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input, or employeeId does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This asset is not currently available for assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/return:
    post:
      operationId: returnAsset
      tags: [assets]
      summary: Return an asset (close active custody)
      description: >-
        Requires asset_management.manage. assigned -> available only (§7).
        Closes the currently active asset_assignments row
        (custodyEndedAt/endReason=returned/receivedByMembershipId/
        returnCondition/returnNotes) and atomically flips the asset back to
        available, one transaction. The historical assignment row is never
        deleted or reused — a later re-issue always creates a new row.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnAssetInput"
      responses:
        "200":
          description: Returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This asset has no active assignment to return
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/assignments:
    get:
      operationId: listAssetAssignments
      tags: [assets]
      summary: List an asset's custody history
      description: >-
        Requires asset_management.read.own. Organization-wide reach (via
        asset_management.manage) returns this asset's full custody history;
        otherwise only the caller's own rows for this asset (current +
        historical). No manager tier on this route — Decision 3's
        current-only manager reach is the separate team-assets route (W98).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assignment history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetAssignment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/asset-assignments/{id}/acknowledge:
    post:
      operationId: acknowledgeAssetAssignment
      tags: [assets]
      summary: Acknowledge receipt of an asset (own currently-open assignment only)
      description: >-
        Requires asset_management.write.own. Decision 1. Identity is
        server-resolved from the caller's own linked employee record —
        never client-supplied. Only the caller's own currently-open
        (custodyEndedAt IS NULL) assignment may be acknowledged.
        acknowledgedAt is server-generated and never cleared by a later
        return. A repeat or concurrent call, or one against an already-
        closed assignment, returns a controlled 409. A non-owner receives
        the same 404 a nonexistent id would.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeAssetAssignmentInput"
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetAssignment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already acknowledged, or no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/my-assets:
    get:
      operationId: listMyAssetAssignments
      tags: [assets]
      summary: List my own current and historical asset custody
      description: >-
        Requires asset_management.read.own. Identity is server-resolved from
        the caller's own linked employee record — never client-supplied.
        Returns the caller's own current + full historical assignments
        across every asset, newest first. A caller with no linked employee
        record gets an empty list, never an error.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The caller's own assignment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetAssignment"

  /organizations/{organizationId}/assets/team-assets:
    get:
      operationId: listTeamAssetAssignments
      tags: [assets]
      summary: List current custody for my current direct reports (Decision 3)
      description: >-
        Requires asset_management.read.own. Current custody only, for
        current direct reports only — the reportingManagerId relationship is
        resolved live on every call, never snapshotted, never falling back
        to organization-wide reach. No closed/historical assignment is ever
        returned through this route. A caller with no linked employee record,
        or with zero current direct reports, gets an empty list.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current custody for the caller's current direct reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetAssignment"

  /organizations/{organizationId}/assets/{id}/report-issue:
    post:
      operationId: reportAssetIssue
      tags: [assets]
      summary: Report a loss/damage issue on an asset currently assigned to me
      description: >-
        Requires asset_management.write.own. Decision 2 — report-only.
        Identity is server-resolved, never client-supplied. Only on an asset
        with an active assignment belonging to the caller. Creates exactly
        one asset_incidents row (status=open) — never mutates asset status,
        condition, or custody state. HR/Asset-Officer review (reviewed/
        dismissed) is a separate, later workstream's own routes.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportAssetIssueInput"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIncident"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: This asset is not currently assigned to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/asset-incidents:
    get:
      operationId: listAssetIncidents
      tags: [assets]
      summary: List an organization's asset incidents (HR/Asset-Officer)
      description: >-
        Requires asset_management.manage. Organization-wide, optionally
        filtered by status. Intentionally lightweight — no pagination, no
        case-management fields.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssetIncidentStatus"
      responses:
        "200":
          description: Incidents, newest-reported first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetIncident"

  /organizations/{organizationId}/asset-incidents/{id}/review:
    post:
      operationId: reviewAssetIncident
      tags: [assets]
      summary: Mark an open incident reviewed
      description: >-
        Requires asset_management.manage. open -> reviewed only, terminal —
        no reopen, no reviewed -> dismissed. Sets reviewedByMembershipId/
        reviewedAt server-side; resolutionNotes is optional. Deliberately
        independent of any asset-level action — reviewing an incident never
        itself changes assets.status/.condition or custody; if a resulting
        action (damage/loss/retirement) is warranted, the HR/Asset-Officer
        actor performs it separately through the existing asset routes.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewAssetIncidentInput"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIncident"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This incident is no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/asset-incidents/{id}/dismiss:
    post:
      operationId: dismissAssetIncident
      tags: [assets]
      summary: Dismiss an open incident
      description: >-
        Requires asset_management.manage. open -> dismissed only, terminal —
        no reopen, no dismissed -> reviewed. Same actor/timestamp shape as
        review; resolutionNotes is optional.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissAssetIncidentInput"
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetIncident"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This incident is no longer open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/maintenance:
    get:
      operationId: listAssetMaintenance
      tags: [assets]
      summary: List an asset's maintenance history (HR/Asset-Officer)
      description: >-
        Requires asset_management.manage — org-wide only; no own/manager
        visibility is frozen for maintenance history (§20). Simple history,
        newest first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Maintenance history for this asset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetMaintenance"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createAssetMaintenance
      tags: [assets]
      summary: Schedule a maintenance record for an asset (HR/Asset-Officer)
      description: >-
        Requires asset_management.manage. Creates a `scheduled` maintenance
        record — never touches the asset's own status (§7). Blocked only on
        a retired asset.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetMaintenanceInput"
      responses:
        "201":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMaintenance"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This asset is retired and cannot be scheduled for maintenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/asset-maintenance/{id}:
    patch:
      operationId: updateAssetMaintenance
      tags: [assets]
      summary: Transition a maintenance record (start / complete / cancel)
      description: >-
        Requires asset_management.manage. The single frozen route for every
        maintenance lifecycle transition (§20) — dispatched by the `action`
        field, never a raw target status. `start` atomically sets the
        asset's own status to `maintenance` (from `available`/`assigned`
        only). `complete`/`cancel` (from `in_progress`) atomically derive
        the asset's own post-maintenance status — `assigned` if an active
        custody row still exists, `available` otherwise — live, inside the
        same transaction; this is never caller-suppliable. `cancel` is also
        accepted from `scheduled`, which never touched the asset's own
        status in the first place.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetMaintenanceInput"
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMaintenance"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This maintenance record is not in a state that permits this action, or the asset is no longer in a maintenance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/evidence:
    get:
      operationId: listAssetEvidence
      tags: [assets]
      summary: List evidence attached to an asset
      description: >-
        Same visibility tier as the asset itself (§20) — organization-wide
        (asset_management.manage) or own-scope (the caller currently holds
        this specific asset).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Evidence attached to this asset
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetEvidence"
        "403":
          description: Not authorized to view this asset's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addAssetEvidence
      tags: [assets]
      summary: Attach evidence to an asset
      description: >-
        multipart/form-data upload. Reuses the existing employee_documents
        storage layer verbatim (§13) — PDF, JPEG, PNG, DOCX, and XLSX only,
        validated by file signature, 10MB max, identical to every other
        document upload on this platform. Same visibility tier as the asset
        itself — organization-wide or own-scope (currently holds this
        asset). The created employee_documents row has employeeId=null (an
        asset has no natural single-employee owner, §13).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEvidence"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to add evidence to this asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/{id}/evidence/{evidenceId}/download:
    get:
      operationId: downloadAssetEvidence
      tags: [assets]
      summary: Download a single evidence file
      description: >-
        Authorization-checked before any storage read (same visibility tier
        as the asset itself). No public or signed URL is ever generated —
        the file streams through this authenticated route on every request.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: evidenceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Not authorized to access this asset's evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Asset or evidence not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/assets/dashboard:
    get:
      operationId: getAssetDashboard
      tags: [asset-reporting]
      summary: Asset dashboard — zero-filled deterministic tile breakdown
      description: >-
        Requires asset_management.reports.read. Scope resolved in the
        service layer: asset_management.manage holders see the whole
        organization; everyone else sees only assets currently under an
        active assignment to themselves or a CURRENT (live-resolved, never
        snapshotted) direct report. Plain zero-filled counts only — no
        financial/rate/KPI tile, per the frozen plan's own §18 scope.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard tile breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDashboard"

  /organizations/{organizationId}/assets/reports/{reportKey}:
    get:
      operationId: runAssetReport
      tags: [asset-reporting]
      summary: Run an Asset report
      description: >-
        Computes a registered Asset report (see GET /reports, category
        "asset_management": asset_register, asset_unreturned_by_employee,
        asset_maintenance_history). asset_register and
        asset_maintenance_history are organization-wide only (§17) — a
        non-asset_management.manage caller receives 403.
        asset_unreturned_by_employee follows the same own/manager-current-
        only/organization-wide tier as the dashboard. Pass ?format=csv for
        a CSV download instead of JSON, identical scope/filters/rows to
        JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: categoryCode
          in: query
          required: false
          description: asset_register only.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: asset_register's own asset status, or asset_maintenance_history's own maintenance status — whichever the selected report actually uses.
          schema:
            type: string
        - name: branchId
          in: query
          required: false
          description: asset_register only.
          schema:
            type: integer
        - name: employeeId
          in: query
          required: false
          description: asset_unreturned_by_employee only.
          schema:
            type: integer
        - name: departmentId
          in: query
          required: false
          description: asset_unreturned_by_employee only — filters departmentIdSnapshot (department at issue time), not the employee's current department.
          schema:
            type: integer
        - name: assetId
          in: query
          required: false
          description: asset_maintenance_history only.
          schema:
            type: integer
        - name: dateFrom
          in: query
          required: false
          description: asset_maintenance_history only — inclusive lower bound on the maintenance record's own createdAt.
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          description: asset_maintenance_history only — inclusive upper bound on the maintenance record's own createdAt.
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Asset report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string
        "403":
          description: This report requires organization-wide asset access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown Asset report key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
      required:
        - status

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: string
          enum: [ok, error]
      required:
        - status
        - database

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    AuthSession:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string

    UserProfile:
      type: object
      required: [id, email, firstName, lastName, role, organizationId]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, org_admin, hr_manager, employee]
        organizationId:
          type: integer
        activeOrganizationId:
          type: ["integer", "null"]
          description: >-
            The organization currently in scope for this session, resolved
            server-side from the session's switched organization (falling
            back to organizationId, then to any other active membership).
            Org-scoped requests should use this value, not organizationId.
        avatarUrl:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]

    Organization:
      type: object
      required: [id, name, slug, type, status]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [business, church, ngo, school, hospital, hotel, government, other]
        status:
          type: string
          enum: [active, suspended, trial]
        logoUrl:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        employeeCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    CreateOrganizationInput:
      type: object
      required: [name, slug, type]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          type: string
          enum: [business, church, ngo, school, hospital, hotel, government, other]

    UpdateOrganizationInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          type: string
          enum: [business, church, ngo, school, hospital, hotel, government, other]
        logoUrl:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        employeeCount:
          type: ["integer", "null"]

    OrganizationDomain:
      type: object
      required: [id, organizationId, hostname, domainType, status, isPrimary, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        hostname:
          type: string
        domainType:
          type: string
          enum: [platform_subdomain, custom_domain]
        status:
          type: string
          enum: [pending, active, disabled]
        isPrimary:
          type: boolean
        verifiedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrganizationDomainInput:
      type: object
      required: [hostname, domainType]
      properties:
        hostname:
          type: string
          minLength: 1
        domainType:
          type: string
          enum: [platform_subdomain, custom_domain]

    TenantContext:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
        organizationId:
          type: integer
        organizationName:
          type: string
        organizationSlug:
          type: string
        organizationType:
