      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job requisition submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Only a draft requisition can be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/{id}/cancel:
    post:
      operationId: cancelJobRequisition
