        is always 0 in this workstream; nothing increments it.
      required:
        - id
        - organizationId
        - requisitionId
        - workflowId
        - publicId
        - title
        - visibility
        - status
        - openingsCount
        - filledCount
        - openDate
        - closeDate
        - jobDescription
        - responsibilities
        - requirements
        - preferredQualifications
        - seoTitle
        - seoDescription
        - featured
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
        - locations
        - questions
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        requisitionId:
          type: integer
        workflowId:
          type: ["integer", "null"]
        publicId:
          type: string
          description: Reserved for a later public careers workstream — not consumed by anything in this workstream.
        title:
          type: string
        visibility:
          type: string
          enum: [internal, external, both]
        status:
          type: string
          enum: [draft, scheduled, published, paused, closed, archived]
        openingsCount:
          type: integer
        filledCount:
          type: integer
          description: Never client-settable. Always 0 in this workstream.
        openDate:
          type: ["string", "null"]
          format: date-time
        closeDate:
          type: ["string", "null"]
          format: date-time
        jobDescription:
          type: ["string", "null"]
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        preferredQualifications:
          type: ["string", "null"]
        seoTitle:
          type: ["string", "null"]
        seoDescription:
          type: ["string", "null"]
        featured:
          type: boolean
        createdBy:
          type: ["integer", "null"]
        updatedBy:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        locations:
          type: array
          items:
            $ref: "#/components/schemas/VacancyLocation"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/VacancyQuestion"

