        rejection deducts nothing.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectLeaveRequestInput"
      responses:
        "200":
          description: Leave request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "403":
          description: Not authorized over this employee, or self-rejection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Leave request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not currently pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

