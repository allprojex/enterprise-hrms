          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/move-stage:
    post:
      operationId: moveApplicationStage
      tags: [applications]
      summary: Move an application to another active, non-terminal stage in its vacancy's own workflow
      description: >-
        Validated server-side against the vacancy's own workflow stage
        list — never a client-supplied "next stage" trusted as-is.
        Rejected with 400 if the application is currently in a terminal
        stage (use reopen first), the vacancy has no configured workflow,
        or toStageId doesn't belong to that workflow. Terminal categories
        (hired/rejected/withdrawn) are reachable only through their own
        dedicated actions, never through this one.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveApplicationStageInput"
      responses:
        "200":
          description: Application moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [applications]
      summary: Reject an application
      description: Moves the application to the vacancy's workflow's rejected-category stage. 400 if no such stage is configured, or the application is already in a terminal stage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectApplicationInput"
      responses:
        "200":
          description: Application rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/withdraw:
    post:
      operationId: withdrawApplication
      tags: [applications]
      summary: Withdraw an application
      description: Moves the application to the vacancy's workflow's withdrawn-category stage. 400 if no such stage is configured, or the application is already in a terminal stage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawApplicationInput"
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/reopen:
    post:
      operationId: reopenApplication
      tags: [applications]
      summary: Reopen a rejected or withdrawn application
      description: Moves the application from its terminal stage back to the vacancy's workflow's applied-category stage, clearing any rejection/withdrawal reason. 400 if the application isn't currently in a terminal stage, or no applied-category stage is configured.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenApplicationInput"
      responses:
        "200":
          description: Application reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/scores:
    post:
      operationId: submitApplicationScore
      tags: [applications]
      summary: Submit a scoring entry for an application (W52)
      description: >-
        Append-only — a new row every time, never an edit. Distinct from
        stage movement: scoring evaluates an application without changing
        its stage, so this is gated by application.manage, not
        application.pipeline.move. applications.score is never written —
        the rollup is always recomputed on read (see ApplicationDetail.scoreRollup, §12).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationScoreInput"
      responses:
        "201":
          description: Score submitted — returns the refreshed application detail (including the recomputed scoreRollup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid score
