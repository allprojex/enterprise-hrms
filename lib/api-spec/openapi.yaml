    ApplicationSummary:
      type: object
      description: >-
        Internal ATS view — unlike the public careers DTOs, this freely
        exposes internal ids (this route requires authentication and
        application.read).
      required:
        - id
        - vacancyId
        - vacancyTitle
        - candidateId
        - candidateName
        - candidateEmail
        - currentStageId
        - currentStageName
        - currentStageCategory
        - submittedAt
      properties:
        id:
          type: integer
        vacancyId:
          type: integer
        vacancyTitle:
          type: string
        candidateId:
          type: integer
        candidateName:
          type: string
        candidateEmail:
          type: string
        currentStageId:
          type: ["integer", "null"]
        currentStageName:
          type: ["string", "null"]
        currentStageCategory:
          type: string
          description: The current stage's fixed category, or "applied" for a never-triaged application (currentStageId null) — computed for display, never stored.
          enum: [applied, screening, interview, assessment, offer, hired, rejected, withdrawn]
        submittedAt:
          type: string
          format: date-time

    ApplicationListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ApplicationDocumentSummary:
      type: object
      description: Metadata only — this workstream does not add a document download/streaming endpoint.
      required: [id, categoryCode, fileName, mimeType, fileSize]
      properties:
        id:
          type: integer
        categoryCode:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer

    ApplicationStageHistoryEntry:
      type: object
      description: Immutable — never updated or deleted through any application API.
      required: [id, organizationId, applicationId, fromStageId, toStageId, movedByMembershipId, reason, movedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        fromStageId:
          type: ["integer", "null"]
          description: Null for an application's first recorded movement.
        toStageId:
          type: integer
        movedByMembershipId:
          type: ["integer", "null"]
        reason:
          type: ["string", "null"]
          description: Optional free-text comment supplied with the movement.
        movedAt:
          type: string
          format: date-time

    ApplicationAnswerSummary:
      type: object
      description: A candidate's response to one of the vacancy's screening questions (W52), captured at apply time — write-once, never edited.
      required: [id, vacancyQuestionId, questionText, answerText, knockoutFailed, createdAt]
      properties:
        id:
          type: integer
        vacancyQuestionId:
          type: integer
        questionText:
          type: string
        answerText:
          type: string
        knockoutFailed:
          type: boolean
          description: Computed server-side at submission for yes_no/multiple_choice knockout questions only. A failed knockout flags this row for review — it never auto-rejects the application (§12).
        createdAt:
          type: string
          format: date-time

    ApplicationScoreEntry:
      type: object
      description: Append-only — no update/delete path exists. Multiple entries per scoreType are expected as different reviewers score independently.
      required: [id, organizationId, applicationId, scoredByMembershipId, scoreType, score, notes, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        scoredByMembershipId:
          type: ["integer", "null"]
        scoreType:
          type: string
          enum: [screening, interview, overall]
        score:
          type: string
          description: Decimal string (numeric(5,2) column) — parse to a number for display/arithmetic.
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SubmitApplicationScoreInput:
      type: object
      required: [scoreType, score]
      properties:
        scoreType:
          type: string
          enum: [screening, interview, overall]
        score:
          type: number
        notes:
          type: ["string", "null"]

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationSummary"
        - type: object
          required: [candidatePhone, rejectionReasonCode, withdrawalReasonCode, documents, history, answers, scores, scoreRollup]
          properties:
            candidatePhone:
              type: ["string", "null"]
            rejectionReasonCode:
              type: ["string", "null"]
            withdrawalReasonCode:
              type: ["string", "null"]
            documents:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationDocumentSummary"
            history:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationStageHistoryEntry"
            answers:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationAnswerSummary"
            scores:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationScoreEntry"
              description: Newest first.
            scoreRollup:
              type: ["number", "null"]
              description: >-
                Computed on read from `scores` — an explicit "overall"
                entry wins outright if one exists, otherwise the average of
                whichever of screening/interview have a latest entry. Null
                when no scores exist. Never applications.score (that column
                stays permanently unused — §12).

    MoveApplicationStageInput:
      type: object
      required: [toStageId]
      properties:
