      summary: Mark all notifications as read
      description: Mark all notifications for the current user as read
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [users]
      summary: Dashboard summary
      description: >-
        Returns summary counts and status for the authenticated user's
        organization. `leaveMetrics` (W40) is null when the "leave" module is
        disabled for the organization — never a zero-filled placeholder.
      responses:
        "200":
          description: Dashboard summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles
      description: System-wide role catalog (not org-scoped)
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List the platform module registry
      description: >-
        System-wide catalog of togglable feature modules (not org-scoped).
        Core Platform / HR Foundation capabilities are not modules and don't
        appear here — every organization always has them. A module appearing
        here does not mean any organization has it enabled; that's a
        separate, not-yet-built concern.
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: List permissions
      description: System-wide permission catalog (not org-scoped)
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /organizations/{organizationId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List organization members
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
    post:
      operationId: addMember
      tags: [members]
      summary: Add an existing user as a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: No user with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: User is already an active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}:
    delete:
      operationId: revokeMember
      tags: [members]
      summary: Revoke a membership
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}/roles:
    post:
      operationId: assignMemberRole
      tags: [members]
      summary: Assign a role to a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleInput"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}/roles/{roleId}:
    delete:
      operationId: revokeMemberRole
      tags: [members]
      summary: Revoke a role from a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/invitations:
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Invite a new user to the organization
      description: >-
        Invites someone who may not yet have an account. Returns the accept
        link's token directly -- no email is sent; the inviting admin shares
        the link out-of-band.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreated"
        "409":
          description: User already has a membership in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Preview an invitation
      description: Public -- no authentication required. Used by the accept-invitation page.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: Invalid invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation
      description: >-
        Public -- no authentication required. Sets the invitee's name and
        password and activates their membership. Does not log them in;
        first login is a separate /auth/login call.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Invalid invitation link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Invitation already used or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Invitation expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/primary-hr:
    get:
      operationId: getPrimaryHr
      tags: [primary-hr]
      summary: Get the current Primary HR assignment
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current Primary HR assignment, or null if none is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryHrAssignmentOrNull"
    post:
      operationId: setPrimaryHr
      tags: [primary-hr]
      summary: Appoint or transfer Primary HR
      description: Atomically revokes the current Primary HR (if any) and appoints the given membership.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrimaryHrInput"
      responses:
        "200":
          description: Primary HR appointed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryHrAssignment"
        "400":
          description: Target membership does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/config/{namespace}:
    get:
      operationId: getOrganizationConfig
      tags: [organizations]
      summary: Get an organization configuration namespace
      description: >-
        Returns the namespace's saved configuration, or its safe defaults if
        nothing has been saved yet. 404s for a namespace the Configuration
        Engine doesn't recognize.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology, attendance — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time. A
            namespace may additionally require its owning module to be
            enabled for the organization (e.g. attendance requires the
            "attendance" module) — see requireModuleEnabled (W5); such a
            namespace 403s instead of 404ing when its module is disabled.
      responses:
        "200":
          description: Organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
    patch:
      operationId: updateOrganizationConfig
      tags: [organizations]
      summary: Update an organization configuration namespace
      description: >-
        Merges the given keys into the namespace's existing configuration and
        validates the merged result against that namespace's schema before
        saving.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology, attendance — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time. A
            namespace may additionally require its owning module to be
            enabled for the organization (e.g. attendance requires the
            "attendance" module) — see requireModuleEnabled (W5); such a
            namespace 403s instead of 404ing when its module is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationConfigInput"
      responses:
        "200":
          description: Updated organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
        "400":
          description: The merged configuration failed namespace validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/modules:
    get:
      operationId: listOrganizationModules
      tags: [modules]
      summary: List modules with this organization's enablement state
      description: >-
        Merges the platform module registry (see GET /modules) with this
        organization's per-module enablement overrides. A module with no
        override row falls back to its registry defaultEnabled value. Does
        not gate access to anything yet — enforcing enabled/disabled on
        routes/navigation is a later workstream.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules with this organization's enablement state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationModule"

  /organizations/{organizationId}/modules/{moduleKey}:
    patch:
      operationId: updateOrganizationModule
      tags: [modules]
      summary: Enable or disable a module for this organization
      description: >-
        Enabling requires the module's registry status to be active or beta
        (hidden and deprecated modules have no owning workstream yet and
        cannot be turned on) and requires every module in its
        requiredModuleKeys to already be enabled for this organization.
        Disabling is rejected if another currently-enabled module in this
        organization requires it.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationModuleInput"
      responses:
        "200":
          description: Updated module enablement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationModule"
        "400":
          description: Module cannot be enabled or disabled (not enableable, missing dependencies, or required by another enabled module)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown module key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /master-data/domains:
    get:
      operationId: listMasterDataDomains
      tags: [master-data]
      summary: List the Master Data domain registry
      description: >-
        System-wide catalog of Master Data domains (gender, marital_status,
        employment_type, ...) and their classification (system-defined,
        organization-overridable, organization-defined), not org-scoped.
      responses:
        "200":
          description: List of Master Data domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataDomain"

  /organizations/{organizationId}/master-data/{domain}:
    get:
      operationId: listMasterDataItems
      tags: [master-data]
      summary: List Master Data items for a domain
      description: >-
        System-defined items (shared by every organization) plus this
        organization's own items for the domain, sorted by sortOrder.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Master Data items for the domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataItem"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createMasterDataItem
      tags: [master-data]
      summary: Add an organization-specific Master Data item
      description: >-
        Rejected for system-defined domains, which never accept
        organization-added items.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataItemInput"
      responses:
        "201":
          description: Master Data item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataItem"
        "400":
          description: Domain is system-defined and does not accept organization-added items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An item with this code already exists for the domain in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles:
    get:
      operationId: listOrganizationRoles
      tags: [roles]
      summary: List roles available to this organization
      description: >-
        System role templates (see GET /roles) plus this organization's own
        customized copies.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Roles available to this organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationRole"
    post:
      operationId: copyRoleTemplate
      tags: [roles]
      summary: Copy a system role template into this organization
      description: >-
        Creates the organization's own customizable copy of a system role
        template, including the template's current permissions. The
        template itself is never modified (ADR-015).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyRoleTemplateInput"
      responses:
        "201":
          description: Organization role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationRole"
        "404":
          description: Unknown system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A role with this key already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions:
    post:
      operationId: grantRolePermission
      tags: [roles]
      summary: Grant a permission to an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRolePermissionInput"
      responses:
        "204":
          description: Permission granted
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role or permission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/roles/{roleId}/permissions/{permissionId}:
    delete:
      operationId: revokeRolePermission
      tags: [roles]
      summary: Revoke a permission from an organization's own role
      description: Rejected for system role templates, which are never modified directly.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permission revoked
        "400":
          description: Target role is a system role template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Role not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit-events]
      summary: List audit events
      description: Paginated, most recent first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: eventType
          in: query
          schema:
            type: string
        - name: targetType
          in: query
          schema:
            type: string
        - name: targetId
          in: query
          schema:
            type: string
        - name: actorApplicationUserId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List the report registry
      description: >-
        System-wide catalog of registered reports (not org-scoped), per the
        Reporting Foundation (ADR-016). A report appearing here does not mean
        the caller can run it — that's gated per-report by
        requiredPermissionKey, checked at run time.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /organizations/{organizationId}/reports/{reportKey}/run:
    get:
      operationId: runReport
      tags: [reports]
      summary: Run a report
      description: >-
        Computes a registered report scoped to this organization. Permission
        required varies by report (see GET /reports). Pass ?format=csv for a
        CSV download instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    AuthSession:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        token:
          type: string

    UserProfile:
      type: object
      required: [id, email, firstName, lastName, role, organizationId]
      properties:
        id:
          type: integer
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, org_admin, hr_manager, employee]
        organizationId:
          type: integer
        activeOrganizationId:
          type: ["integer", "null"]
          description: >-
            The organization currently in scope for this session, resolved
            server-side from the session's switched organization (falling
            back to organizationId, then to any other active membership).
            Org-scoped requests should use this value, not organizationId.
        avatarUrl:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        jobTitle:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]

    Organization:
      type: object
      required: [id, name, slug, type, status]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [business, church, ngo, school, hospital, hotel, government, other]
        status:
          type: string
          enum: [active, suspended, trial]
        logoUrl:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        employeeCount:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    CreateOrganizationInput:
      type: object
      required: [name, slug, type]
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
