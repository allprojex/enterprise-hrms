        employmentType:
          type: ["string", "null"]
        workplaceType:
          type: ["string", "null"]
        openingsCount:
          type: integer
        openDate:
          type: ["string", "null"]
          format: date-time
        closeDate:
          type: ["string", "null"]
          format: date-time
        summary:
          type: ["string", "null"]
