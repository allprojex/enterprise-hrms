        attendanceMarkedByMembershipId:
          type: ["integer", "null"]
        attendanceMarkedAt:
          type: ["string", "null"]
          format: date-time
        passed:
          type: ["boolean", "null"]
        score:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        cancelReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestLearningEnrollmentInput:
      type: object
      description: employeeId is never accepted here — always server-derived from the caller's own linked employee record.
      properties:
        sessionId:
          type: integer
          description: Required for an instructor-led course, forbidden for a self-paced one.

    AssignLearningEnrollmentsInput:
      type: object
      required: [scope]
      description: >-
        A caller holding only learning.review.write (manager of record) is
        restricted server-side to scope = 'manual' with every employeeId
        validated as their own current direct report — audience-targeting
        scopes are learning.manage only.
      properties:
        sessionId:
          type: integer
          description: Required for an instructor-led course, forbidden for a self-paced one.
        scope:
          type: string
          enum: [all_active, department, position, manual]
        departmentId:
          type: integer
          description: Required and used only when scope = department.
        positionId:
          type: integer
          description: Required and used only when scope = position.
        employeeIds:
          type: array
          items:
            type: integer
          description: Required and used only when scope = manual.
        mandatory:
          type: boolean
          description: Overrides the course's own mandatoryDefault for these enrollments. Defaults to the course's mandatoryDefault when omitted.
        dueDate:
          type: string
          format: date-time

    AssignLearningEnrollmentsResult:
      type: object
      required: [assignedCount, skippedCount, enrollments, skippedEmployeeIds]
      properties:
        assignedCount:
          type: integer
        skippedCount:
          type: integer
          description: Eligible employees skipped because they already held a non-terminal enrollment for this course/session — not treated as a batch failure.
        enrollments:
          type: array
          items:
            $ref: "#/components/schemas/LearningEnrollment"
        skippedEmployeeIds:
          type: array
          items:
            type: integer

    CancelLearningEnrollmentInput:
      type: object
      properties:
        cancelReason:
          type: string
          description: Required when the caller is not the enrollment's own employee, or when the enrollment is mandatory. Optional for an employee self-cancelling their own non-mandatory, not-yet-started enrollment.

    LearningEnrollmentListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LearningEnrollment"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    AdvanceLearningEnrollmentProgressInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed]
          description: The one-way target state — assigned→in_progress or in_progress→completed only. No other value is ever accepted here.

    MarkLearningEnrollmentAttendanceInput:
      type: object
      required: [attended]
      properties:
        attended:
          type: boolean

    CompleteLearningEnrollmentInput:
      type: object
      properties:
        passed:
          type: boolean
          description: Required when the enrollment's own hasAssessmentSnapshot is true; must not be supplied otherwise. Determines completed (true) vs. failed (false) server-side.
        score:
          type: number
          description: Optional free-form numeric result, only meaningful alongside passed. Never a substitute for passed — there is no derived pass threshold.

    LearningCertificateStatus:
      type: string
      enum: [active, revoked]
      description: '"Expired" is never a stored value here (§10.4 rule 9) — always computed live from expiresAt < now().'

    LearningCertificate:
      type: object
      required:
        [
          id,
          organizationId,
          enrollmentId,
          employeeId,
          courseTitleSnapshot,
          certificateNumber,
          issuedAt,
          expiresAt,
          status,
          revokedByMembershipId,
          revokedAt,
          revokeReason,
          employeeDocumentId,
          createdAt,
        ]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        enrollmentId:
          type: integer
        employeeId:
          type: integer
        courseTitleSnapshot:
          type: string
          description: Copied from the enrollment's own courseTitleSnapshot at issuance — a chain of snapshots, never re-read from the live course.
        certificateNumber:
          type: ["string", "null"]
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
          description: Computed exactly once at issuance from the enrollment's own certificateValidityMonthsSnapshot. Null means never expires. Never recomputed.
        status:
          $ref: "#/components/schemas/LearningCertificateStatus"
        revokedByMembershipId:
          type: ["integer", "null"]
        revokedAt:
          type: ["string", "null"]
          format: date-time
        revokeReason:
          type: ["string", "null"]
        employeeDocumentId:
          type: ["integer", "null"]
          description: Optional attached file. V1 never generates a certificate PDF — this field is only ever populated by a future HR-uploaded-file workstream, not W90.
        createdAt:
          type: string
          format: date-time

    LearningCertificateListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LearningCertificate"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    RevokeLearningCertificateInput:
      type: object
      required: [revokeReason]
      properties:
        revokeReason:
          type: string
          minLength: 1

    LearningDashboardStatusItem:
      type: object
