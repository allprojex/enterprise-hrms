          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: goalId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPerformanceReviewGoalInput"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceGoal"
        "400":
          description: Missing reason, or not an employee-proposed goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not this review's reviewer of record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The review is not manager_review, or the goal was already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/performance/my-reviews:
    get:
      operationId: listMyPerformanceReviews
      tags: [performance-reviews]
      summary: ESS — the caller's own Performance reviews
      description: Requires performance.read.own. employeeId is always server-resolved from the caller's own employee_user_links row, never client-supplied. Returns an empty array if the caller has no linked employee record.
      parameters:
        - name: organizationId
          in: path
