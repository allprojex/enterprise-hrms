            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered candidate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateListResponse"

  /organizations/{organizationId}/candidates/{id}:
    get:
      operationId: getCandidate
      tags: [candidates]
      summary: Get a candidate
