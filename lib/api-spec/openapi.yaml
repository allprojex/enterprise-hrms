  /organizations/{organizationId}/interviews:
    get:
      operationId: listInterviews
      tags: [interviews]
      summary: List interviews across applications (calendar/list view)
      description: >-
        Top-level, not nested under one application — backs the frozen §11
        frontend route `/interviews` ("calendar/list of scheduled interviews
        for the caller"). Visibility-filtered per caller: organization-wide
        for interview.manage holders, otherwise scoped to interviews where
        the caller's own membership appears on the panel (§7 — "own
        scheduled interviews as interviewer").
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, completed, cancelled, no_show]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered interview list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewListResponse"

  /organizations/{organizationId}/interviews/{id}:
    get:
      operationId: getInterview
      tags: [interviews]
      summary: Get an interview (including its panel)
      description: Returns 404 both when the interview doesn't exist and when it exists but isn't visible to this caller — never distinguishing the two.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
