          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No employee record linked to this account, or the employee is not eligible to record attendance (on_leave, suspended, terminated, or before hireDate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
