        cancelledAt:
          type: ["string", "null"]
          format: date-time
        cancelledBy:
          type: ["integer", "null"]
        approvedBy:
          type: ["integer", "null"]
          description: Set only on an actual approval. A rejection's actor/timestamp lives in the audit trail instead (Architecture Principle 6).
        approvedAt:
          type: ["string", "null"]
          format: date-time
        rejectionReason:
          type: ["string", "null"]
        createdBy:
          type: ["integer", "null"]
