      summary: Self-service clock-in or clock-out
      description: >-
        Own resource only. employeeId is always resolved server-side via
        employee_user_links — never accepted from the client. occurredAt is
        always the server's own clock — never client-supplied. No sequencing
        validation is applied (Phase 3B, Open Decision 1): a multi-segment
        day, or a raw duplicate clock-in with no intervening clock-out, is
        recorded as-is; the daily summary (a later workstream) decides how
        to interpret it. Gated by the "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
