          type: string
          format: date-time
          description: Server-authoritative instant — never client-supplied for a self-service event.
        source:
          type: string
          enum: [self_service, hr_manual, biometric, import]
          description: biometric and import are schema-reserved values; no W65 route writes either.
        recordedByMembershipId:
