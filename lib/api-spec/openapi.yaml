        hasAssessmentSnapshot:
          type: boolean
        issuesCertificateSnapshot:
          type: boolean
        certificateValidityMonthsSnapshot:
          type: ["integer", "null"]
        departmentIdSnapshot:
          type: ["integer", "null"]
        positionIdSnapshot:
          type: ["integer", "null"]
        managerEmployeeIdSnapshot:
          type: ["integer", "null"]
        mandatoryAtAssignment:
          type: boolean
        originType:
          type: string
          enum: [hr_assigned, manager_assigned, employee_requested]
        assignedByMembershipId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
        approvalStatus:
          type: string
          enum: [auto_approved, pending, approved, rejected]
        approvalDecidedByMembershipId:
          type: ["integer", "null"]
        approvalDecidedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [assigned, in_progress, completed, failed, cancelled]
        attended:
