  /organizations/{organizationId}/applications/{applicationId}/interviews/{id}:
    patch:
      operationId: updateInterview
      tags: [interviews]
      summary: Update, reschedule, or replace the panel of an interview
      description: >-
        Supplying scheduledAt reschedules (cancels the current row, creates
        a new one — §4.5) rather than mutating the date in place; otherwise
        performs an ordinary in-place update. Only a currently-scheduled
        interview can be updated.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInterviewInput"
      responses:
        "200":
          description: Interview updated (or the newly-created rescheduled interview)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        "400":
          description: Invalid fields, or the interview is not currently scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/interviews/{id}/scorecards:
    get:
      operationId: listInterviewScorecards
      tags: [interview-scorecards]
      summary: List scorecards for an interview
      description: >-
        Visibility-filtered: a scorecard.read_all holder sees every panel
        member's scorecard plus a computed panelSummary (submitted/pending
        counts, recommendation tally — never stored, always recomputed on
        read, the same discipline as W52's scoreRollup); anyone else sees
        only their own scorecard (possibly none), and panelSummary is null.
        scorecard.submit never implies scorecard.read_all — an interviewer
        never sees a colleague's scorecard through this route, submitted or
        not.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scorecards visible to this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewScorecardListResponse"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: saveInterviewScorecard
      tags: [interview-scorecards]
      summary: Save or submit the caller's own scorecard for an interview
      description: >-
        Upserts the caller's own draft — panel membership is re-verified
        fresh on every call, never cached. Supplying `submit: true`
        transitions draft -> submitted in the same call (§10 lists no
        separate submit route); once submitted, further calls are rejected
        (400) — a submitted scorecard cannot be silently replaced. Rejected
        for a cancelled interview.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInterviewScorecardInput"
      responses:
        "200":
          description: Scorecard saved (or submitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewScorecard"
        "400":
          description: Invalid fields, the interview is cancelled, the caller is not a panel member, or the scorecard is already submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Interview not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/scorecards/{id}/finalize:
    post:
      operationId: finalizeInterviewScorecard
      tags: [interview-scorecards]
      summary: Finalize (lock) a submitted scorecard
      description: >-
        HR/recruiter-only — there is no "own" tier for finalize; the
        submitting interviewer can never finalize their own scorecard. Only
        a submitted, not-yet-finalized scorecard can be finalized.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scorecard finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewScorecard"
        "400":
          description: Only a submitted, not-yet-finalized scorecard can be finalized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Scorecard not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/reference-checks:
    get:
      operationId: listReferenceChecks
      tags: [reference-checks]
      summary: List reference checks for an application
      description: >-
        No dedicated reference-check permission exists — visibility reuses
        the application's own (assigned recruiter/hiring manager +
        organization-wide via application.read). Returns 404 both when the
        application doesn't exist and when it exists but isn't visible to
        this caller.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reference checks for this application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferenceCheck"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createReferenceCheck
      tags: [reference-checks]
      summary: Request a reference check for an application
      description: >-
        Created at status "requested". Rejected (400) if an active
        (requested/in_progress) reference check already exists for the same
        refereeContact on this application.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReferenceCheckInput"
      responses:
        "201":
          description: Reference check requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceCheck"
        "400":
          description: Invalid fields, or a duplicate active reference check for this referee already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/reference-checks/{id}:
    patch:
      operationId: updateReferenceCheckStatus
      tags: [reference-checks]
      summary: Record a reference check's status/outcome
      description: >-
        Valid target statuses are in_progress, completed, flagged, or
        unable_to_complete (never back to requested). Sets completedAt when
        moving to a terminal status. A completed/flagged/unable_to_complete
        reference check is immutable — no further update is accepted.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReferenceCheckStatusInput"
      responses:
        "200":
          description: Reference check updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceCheck"
        "400":
          description: Invalid status, or the reference check is already terminal (immutable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Reference check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/background-checks:
    get:
      operationId: listBackgroundChecks
      tags: [background-checks]
      summary: List background checks for an application
      description: >-
        Gated by the dedicated background_check.read permission —
        organization-wide only, no assigned tier at all (§7's narrowest
        permission row). Holding application.read/.manage never implies
        access here. Never exposes the raw evidence storage key — each item
        carries a hasEvidence boolean instead.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Background checks for this application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackgroundCheck"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createBackgroundCheck
      tags: [background-checks]
      summary: Request a background check for an application
      description: >-
        Created at status "requested". checkType is free text (no
        Master Data domain exists in this frozen scope). Rejected (400) if
        an active (requested/in_progress) background check of the same
        checkType already exists for this application.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackgroundCheckInput"
      responses:
        "201":
          description: Background check requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundCheck"
        "400":
          description: Invalid fields, or a duplicate active check of this type already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/background-checks/{id}:
    patch:
      operationId: updateBackgroundCheckStatus
      tags: [background-checks]
      summary: Record a background check's status/result
      description: >-
        Valid target statuses are in_progress, completed, flagged, or
        unable_to_complete (never back to requested). A completed/flagged/
        unable_to_complete background check is immutable — no further
        update is accepted, and no automatic rejection, stage move, offer,
        or hiring action is ever triggered by a result.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBackgroundCheckStatusInput"
      responses:
        "200":
          description: Background check updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundCheck"
        "400":
          description: Invalid status, or the background check is already terminal (immutable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Background check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/background-checks/{id}/evidence:
    post:
      operationId: attachBackgroundCheckEvidence
      tags: [background-checks]
      summary: Attach (or replace) evidence for a background check
      description: >-
        multipart/form-data upload, validated by file signature (not just
        Content-Type), 10MB max, same allowed types as every other document
        upload in this codebase. Replaces any prior evidence file for this
        check (the old file is deleted). Rejected once the check is
        terminal (completed/flagged/unable_to_complete) — no silent
        overwrite of finalized evidence.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Evidence attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundCheck"
        "400":
          description: Invalid file, or the background check is already terminal (immutable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Background check not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getBackgroundCheckEvidence
      tags: [background-checks]
      summary: Retrieve a background check's evidence file
      description: >-
        Signed, authenticated access only — never a public URL. Gated by
        background_check.read, same as the rest of this resource.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The evidence file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Background check not found, or no evidence has been attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers:
    get:
      operationId: listOffers
      tags: [offers]
      summary: List offers
      description: >-
        Visibility-filtered per caller: organization-wide for offer.approve/
        .issue/.withdraw holders, otherwise scoped to offers whose linked
        requisition assigns the caller as recruiter or hiring manager
        (docs/PHASE_3A_RECRUITMENT_IMPLEMENTATION_PLAN.md §7).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered offer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferListResponse"

  /organizations/{organizationId}/offers/{id}:
    get:
      operationId: getOffer
      tags: [offers]
      summary: Get an offer by ID
      description: Returns 404 both when the offer doesn't exist and when it exists but isn't visible to this caller — never distinguishing the two.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer, including every version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetail"
        "404":
          description: Offer not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateDraftOfferVersion
      tags: [offers]
      summary: Edit the offer's current version in place
      description: >-
        Only permitted while the current version is "draft" (§14). An
        approved/issued version must go through `POST
        .../offers/{id}/versions` instead — this endpoint returns 400 if
        called on anything else (pending_approval or a terminal state too).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfferVersionInput"
      responses:
        "200":
          description: Offer's draft version updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetail"
        "400":
          description: The current version is not editable in place (not draft)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/{id}/versions:
    post:
      operationId: createNewOfferVersion
      tags: [offers]
      summary: Create a new offer version
      description: >-
        Only permitted while the current version is "approved" or "issued"
        (§14's second editing branch) — the prior version is marked
        superseded in the same transaction as the new draft version is
        created. Returns 400 if the current version is still draft (edit it
        in place via PATCH .../offers/{id} instead), awaiting a decision, or
        terminal.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOfferVersionInput"
      responses:
        "201":
          description: New draft offer version created; the prior version is now superseded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetail"
        "400":
          description: The current version does not accept a new version in its current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Offer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/offers:
    get:
      operationId: getOfferForApplication
      tags: [offers]
      summary: Get the offer for an application
      description: >-
        At most one offer ever exists per application
        (offers_application_unique) — returns a single object, not a list.
        404 both when no offer exists yet and when one exists but isn't
        visible to this caller.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The application's offer, including every version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetail"
        "404":
          description: No offer exists for this application (or it exists but isn't visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createOffer
      tags: [offers]
      summary: Create an offer for an application
      description: >-
        Creates the offer envelope and its first (draft) version in one
        transaction. Requires offer.manage — org-wide holders may create an
        offer for any application; an assigned recruiter or hiring manager
        (per the application's linked requisition) may create one for their
        own application, §7's first "assigned tier can really write" case
        this phase. 409 if the application already has an offer.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOfferInput"
      responses:
        "201":
          description: Offer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferDetail"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This application already has an offer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/versions/{id}/submit-for-approval:
    post:
      operationId: submitOfferVersionForApproval
      tags: [offers]
      summary: Submit a draft offer version for approval
      description: >-
        draft -> pending_approval only, creating the single required
        approval step in the same transaction. Requires offer.manage
        (org-wide or assigned, same as create/edit).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer version submitted for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferVersion"
        "400":
          description: Only a draft offer version can be submitted for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Offer version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/versions/{id}/approvals:
    get:
      operationId: listOfferApprovals
      tags: [offers]
      summary: Immutable approval decision history for an offer version
      description: >-
        Same visibility as GET .../offers/{id} (resolved via the version's
        parent offer) — 404 both when the version doesn't exist and when it
        exists but isn't visible to this caller.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approval decision history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OfferApproval"
        "404":
          description: Offer version not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/versions/{id}/approve:
    post:
      operationId: approveOfferVersion
      tags: [offers]
      summary: Approve a pending offer version
      description: >-
        Requires offer.approve (organization-wide only — no assigned tier
        for this action per §7). Atomically finalizes the single approval
        step and transitions the offer version pending_approval -> approved
        in one transaction; 409 if the version is no longer awaiting a
        decision.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveOfferVersionInput"
      responses:
        "200":
          description: Offer version approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferVersion"
        "404":
          description: Offer version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Offer version is not currently awaiting a decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/versions/{id}/issue:
    post:
      operationId: issueOfferVersion
      tags: [offers]
      summary: Issue an approved offer version
      description: approved -> issued only. Requires offer.issue (organization-wide only — no assigned tier for this action per §7).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Offer version issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferVersion"
        "400":
          description: Only an approved offer version can be issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Offer version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/offers/versions/{id}/withdraw:
    post:
      operationId: withdrawOfferVersion
      tags: [offers]
      summary: Withdraw a pending, approved, or issued offer version
      description: >-
        pending_approval, approved, or issued -> withdrawn. The only abort
        action this workstream builds — no separate reject route exists (§10
        names only submit-for-approval/approve/issue/withdraw), so this also
        doubles as "reject a pending version". Requires offer.withdraw
        (organization-wide only — no assigned tier for this action per §7).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawOfferVersionInput"
      responses:
        "200":
          description: Offer version withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferVersion"
        "400":
          description: Only a pending, approved, or issued offer version can be withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Offer version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/pre-employment-requirements:
    get:
      operationId: listPreEmploymentRequirements
      tags: [pre-employment-requirements]
      summary: List pre-employment requirements for an application
      description: >-
        No dedicated permission exists — visibility reuses the
        application's own (assigned recruiter/hiring manager +
        organization-wide via application.read). Returns 404 both when the
        application doesn't exist and when it exists but isn't visible to
        this caller. `summary.readyForConversion` mirrors §13's own
        convert-to-employee readiness rule exactly ("every non-waived row
        is satisfied") — computed on every read, never stored, and does
        not itself gate or trigger conversion.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pre-employment requirements for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreEmploymentRequirementListResponse"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createPreEmploymentRequirement
      tags: [pre-employment-requirements]
      summary: Track a new pre-employment requirement for an application
      description: >-
        Created at status "pending". Rejected (400) if this requirementCode
        is already tracked for this application (unique per
        applicationId/requirementCode).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePreEmploymentRequirementInput"
      responses:
        "201":
          description: Pre-employment requirement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreEmploymentRequirement"
        "400":
          description: Invalid fields, or this requirement is already tracked for this application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/pre-employment-requirements/{id}:
    patch:
      operationId: updatePreEmploymentRequirementStatus
      tags: [pre-employment-requirements]
      summary: Update a pre-employment requirement's status
      description: >-
        Status is freely settable between pending/satisfied/waived — no
        one-way lifecycle is enforced (a checklist correction, e.g.
        reverting a mistaken "satisfied" back to "pending", is allowed).
        Sets satisfiedAt when moving to "satisfied"; clears it otherwise.
        Never creates an employee or activates any HR module by itself.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreEmploymentRequirementStatusInput"
      responses:
        "200":
          description: Pre-employment requirement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreEmploymentRequirement"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pre-employment requirement not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{applicationId}/convert-to-employee:
    post:
      operationId: convertApplicationToEmployee
      tags: [employee-conversion]
      summary: Convert a hired application into an employee
      description: >-
        Requires both candidate.convert_to_employee and employee.write —
        neither alone is sufficient. Eligible only when the application is
        in a hired-category stage AND every non-waived pre-employment
        requirement is satisfied (no offer-status check — this workstream
        builds no candidate-facing offer acceptance flow). Reuses the
        existing employee-creation service unchanged; an internal
        candidate (candidates.linkedInternalEmployeeId already set) reuses
        that existing employee rather than creating a second one. 409 if
        this application (or, for an internal candidate, this employee)
        has already been converted — genuinely idempotent under retry.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Application converted to an employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionResult"
        "400":
          description: The application is not eligible for conversion yet (not hired-category, or a non-waived pre-employment requirement is not satisfied)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: This application has already been converted to an employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /careers/{orgSlug}:
    get:
      operationId: getPublicCareersOrganization
      tags: [public-careers]
      summary: Public organization profile for a careers page
      description: >-
        No authentication. Resolves the organization by its own slug only —
        never a numeric ID. Returns the same 404 whether the slug doesn't
        exist, the organization is suspended, or its careers portal isn't
        enabled (recruitment_settings.enabled / externalRecruitmentEnabled)
        — these are never distinguished, so a probing request can never
        learn which condition applied.
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public organization profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrganization"
        "404":
          description: Careers page not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /careers/{orgSlug}/vacancies:
    get:
      operationId: listPublicVacancies
      tags: [public-careers]
      summary: Public, paginated, filterable vacancy list
      description: >-
        Only vacancies with status=published, visibility != internal, and
        (if set) a closeDate that has not yet passed. Never includes
        salary, internal IDs, requisition linkage, or any recruiter/hiring-
        manager identity — vacancies carry no salary field at all, and
        job_requisitions' own salary range is explicitly org-internal-only,
        never surfaced here (docs/PHASE_3A_RECRUITMENT_IMPLEMENTATION_PLAN.md
        §9). Reads never mutate a vacancy's lifecycle, even when its
        closeDate has passed.
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: employmentType
          in: query
          schema:
            type: string
        - name: workplaceType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: Paginated public vacancy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVacancyListResponse"
        "404":
          description: Careers page not available (same collapsed 404 as GET /careers/{orgSlug})
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /careers/{orgSlug}/jobs/{vacancyPublicId}:
    get:
      operationId: getPublicVacancy
      tags: [public-careers]
      summary: Public vacancy detail
      description: >-
        Looked up by publicId only — the internal serial ID is never
        accepted or exposed. Returns 404 whether the vacancy doesn't exist,
        belongs to a different organization than orgSlug resolves to, or
        simply isn't publicly eligible right now (draft/scheduled/paused/
        closed/archived/internal-only/past its own closeDate) — never
        distinguished.
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
        - name: vacancyPublicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public vacancy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVacancyDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /careers/{orgSlug}/jobs/{vacancyPublicId}/apply:
    post:
      operationId: applyToPublicVacancy
      tags: [public-careers]
      summary: Submit an anonymous application (submission only, no candidate account)
      description: >-
        The highest-risk public route in this codebase. Rate-limited per IP
        (5/15min, stricter than /auth/login's 10/15min given the larger
        file-upload payload). A hidden honeypot field ("website") that a
        real applicant never sees — if filled, the exact same success
        response is returned with nothing persisted, never revealing
        detection to an automated submitter. The resume file passes through
        the same documentValidation.ts signature/size/type checks as every
        other upload in this codebase (PDF/JPEG/PNG/DOCX/XLSX, 10MB max). A
        second submission from the same email against the same vacancy is
        idempotent — returns the existing application (200, not 201), never
        creates a second row. On a genuinely new submission, an
        application-status link is emailed via the existing Resend
        provider (reused unchanged from the forgot-password flow, W19) —
        delivery failure is logged, never surfaced to the caller. Never
        reveals whether a given email has applied before.
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
        - name: vacancyPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [firstName, lastName, email, resume]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
                resume:
                  type: string
                  format: binary
                answers:
                  type: string
                  description: >-
                    JSON-encoded array of {vacancyQuestionId, answerText}
                    objects (W52) — optional, answers to any subset of the
                    vacancy's screening questions. A vacancyQuestionId that
                    doesn't belong to this vacancy is silently ignored, not
                    an error. Knockout evaluation happens server-side at
                    submission and never auto-rejects (§12).
                website:
                  type: string
                  description: Honeypot — must always be left empty. Not a real field.
      responses:
        "201":
          description: Application submitted (new)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmittedResponse"
        "200":
          description: Application already existed for this email and vacancy (idempotent repeat submission)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSubmittedResponse"
        "400":
          description: Missing required fields, invalid resume file, or the organization's applicationLimitPerCandidate was reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job not found (or not publicly eligible for application)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many applications submitted from this IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /careers/{orgSlug}/application-status/{token}:
    get:
      operationId: getPublicApplicationStatus
      tags: [public-careers]
      summary: Anonymous application status check by emailed token
      description: >-
        Never a bare email lookup — only the signed, time-limited token
        emailed at submission (90-day TTL). Scoped to the organization
        resolved from orgSlug; a token belonging to a different
        organization is indistinguishable from an unknown one. Rate-limited
        per IP to prevent token brute-forcing.
      parameters:
        - name: orgSlug
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusResponse"
        "404":
          description: Not found (unknown, expired, or cross-organization token)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many status checks from this IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/leave-requests/{id}/approve:
    post:
      operationId: approveLeaveRequest
      tags: [leave-approvals]
      summary: Approve a pending leave request
      description: >-
        Manager-scoped or organization-wide (leave_request.manage) approval
        authority required, on top of holding leave_request.approve —
        neither alone is sufficient. Self-approval is rejected. Atomically
        transitions the request and posts the immutable usage ledger entry
        (W34) in one transaction; rejected with a 409 if the request is no
        longer pending (already decided, concurrently or otherwise).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "400":
          description: Approving would take the balance negative and the policy disallows it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized over this employee, or self-approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Leave request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Request is not currently pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/leave-requests/{id}/reject:
