openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Enterprise HRMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: organizations
    description: Organization operations
  - name: notifications
    description: Notification operations
  - name: employees
    description: Employee directory operations
  - name: branches
    description: Branch operations
  - name: departments
    description: Department operations
  - name: positions
    description: Position operations
  - name: roles
    description: Role operations
  - name: permissions
    description: Permission operations
  - name: members
    description: Organization membership management
  - name: primary-hr
    description: Primary HR assignment operations
  - name: audit-events
    description: Audit log operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      description: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      description: Invalidate the current session
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      description: Send a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Password reset email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/switch-organization:
    post:
      operationId: switchOrganization
      tags: [auth]
      summary: Switch active organization
      description: >-
        Switches the caller's active organization context for the current
        session. Only succeeds if the caller has an active membership in the
        target organization; never trusts the client beyond that check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationInput"
      responses:
        "200":
          description: Active organization switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active membership in the requested organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user's profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/me:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update own profile
      description: Update the current user's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations the user has access to
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create (onboard) an organization
      description: >-
        Creates a new organization and, atomically, makes the caller its
        first active member with the org_admin role and Primary HR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      description: Returns an organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/organizations:
    get:
      operationId: listMyOrganizations
      tags: [organizations]
      summary: List my organization memberships
      description: >-
        Returns every organization the caller has an active membership in,
        with their role(s) and Primary HR status in each.
      responses:
        "200":
          description: List of memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      description: Search, filter, and paginate the organization's employee directory
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
        - name: positionId
          in: query
          schema:
            type: integer
        - name: employmentStatus
          in: query
          schema:
            type: string
            enum: [active, probation, on_leave, suspended, terminated]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated employee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "403":
          description: No active membership in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid input, or a referenced department/branch/position/manager is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeInput"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid input, or a referenced department/branch/position/manager is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/profile-picture:
    post:
      operationId: uploadEmployeeProfilePicture
      tags: [employees]
      summary: Upload or replace an employee's profile picture
      description: >-
        multipart/form-data upload. JPEG/PNG/WebP only, validated by file
        signature (not just Content-Type), 5MB max. Re-encoded to a resized,
        EXIF-stripped JPEG before storage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeEmployeeProfilePicture
      tags: [employees]
      summary: Remove an employee's profile picture
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile picture removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /organizations/{organizationId}/employees/{employeeId}/link-user:
    post:
      operationId: linkEmployeeToUser
      tags: [employees]
      summary: Link an employee record to a login account
      description: >-
        Optional. The target application user must already have an active
        membership in this organization — linking never grants access on its
        own.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkEmployeeUserInput"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Target user has no active membership in this organization, or is already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create a branch
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchInput"
      responses:
        "201":
          description: Branch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        "409":
          description: A branch with this code already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "409":
          description: A department with this code already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List positions
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
    post:
      operationId: createPosition
      tags: [positions]
      summary: Create a position
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePositionInput"
      responses:
        "201":
          description: Position created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "409":
          description: A position with this title already exists in the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications
      description: Returns notifications for the current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      description: Mark a specific notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      description: Mark all notifications for the current user as read
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [users]
      summary: Dashboard summary
      description: Returns summary counts and status for the authenticated user's organization
      responses:
        "200":
          description: Dashboard summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List roles
      description: System-wide role catalog (not org-scoped)
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /modules:
    get:
      operationId: listModules
      tags: [modules]
      summary: List the platform module registry
      description: >-
        System-wide catalog of togglable feature modules (not org-scoped).
        Core Platform / HR Foundation capabilities are not modules and don't
        appear here — every organization always has them. A module appearing
        here does not mean any organization has it enabled; that's a
        separate, not-yet-built concern.
      responses:
        "200":
          description: List of modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Module"

  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: List permissions
      description: System-wide permission catalog (not org-scoped)
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  /organizations/{organizationId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List organization members
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
    post:
      operationId: addMember
      tags: [members]
      summary: Add an existing user as a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: No user with that email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: User is already an active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}:
    delete:
      operationId: revokeMember
      tags: [members]
      summary: Revoke a membership
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}/roles:
    post:
      operationId: assignMemberRole
      tags: [members]
      summary: Assign a role to a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleInput"
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership or role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/members/{membershipId}/roles/{roleId}:
    delete:
      operationId: revokeMemberRole
      tags: [members]
      summary: Revoke a role from a member
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "404":
          description: Membership not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/primary-hr:
    get:
      operationId: getPrimaryHr
      tags: [primary-hr]
      summary: Get the current Primary HR assignment
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current Primary HR assignment, or null if none is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryHrAssignmentOrNull"
    post:
      operationId: setPrimaryHr
      tags: [primary-hr]
      summary: Appoint or transfer Primary HR
      description: Atomically revokes the current Primary HR (if any) and appoints the given membership.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPrimaryHrInput"
      responses:
        "200":
          description: Primary HR appointed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrimaryHrAssignment"
        "400":
          description: Target membership does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/config/{namespace}:
    get:
      operationId: getOrganizationConfig
      tags: [organizations]
      summary: Get an organization configuration namespace
      description: >-
        Returns the namespace's saved configuration, or its safe defaults if
        nothing has been saved yet. 404s for a namespace the Configuration
        Engine doesn't recognize.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time.
      responses:
        "200":
          description: Organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
    patch:
      operationId: updateOrganizationConfig
      tags: [organizations]
      summary: Update an organization configuration namespace
      description: >-
        Merges the given keys into the namespace's existing configuration and
        validates the merged result against that namespace's schema before
        saving.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationConfigInput"
      responses:
        "200":
          description: Updated organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
        "400":
          description: The merged configuration failed namespace validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/modules:
    get:
      operationId: listOrganizationModules
      tags: [modules]
      summary: List modules with this organization's enablement state
      description: >-
        Merges the platform module registry (see GET /modules) with this
        organization's per-module enablement overrides. A module with no
        override row falls back to its registry defaultEnabled value. Does
        not gate access to anything yet — enforcing enabled/disabled on
        routes/navigation is a later workstream.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules with this organization's enablement state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationModule"

  /organizations/{organizationId}/modules/{moduleKey}:
    patch:
      operationId: updateOrganizationModule
      tags: [modules]
      summary: Enable or disable a module for this organization
      description: >-
        Enabling requires the module's registry status to be active or beta
        (hidden and deprecated modules have no owning workstream yet and
        cannot be turned on) and requires every module in its
        requiredModuleKeys to already be enabled for this organization.
        Disabling is rejected if another currently-enabled module in this
        organization requires it.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationModuleInput"
      responses:
        "200":
          description: Updated module enablement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationModule"
        "400":
          description: Module cannot be enabled or disabled (not enableable, missing dependencies, or required by another enabled module)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown module key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /master-data/domains:
    get:
      operationId: listMasterDataDomains
      tags: [master-data]
      summary: List the Master Data domain registry
      description: >-
        System-wide catalog of Master Data domains (gender, marital_status,
        employment_type, ...) and their classification (system-defined,
        organization-overridable, organization-defined), not org-scoped.
      responses:
        "200":
          description: List of Master Data domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataDomain"

  /organizations/{organizationId}/master-data/{domain}:
    get:
      operationId: listMasterDataItems
      tags: [master-data]
      summary: List Master Data items for a domain
      description: >-
        System-defined items (shared by every organization) plus this
        organization's own items for the domain, sorted by sortOrder.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Master Data items for the domain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterDataItem"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createMasterDataItem
      tags: [master-data]
      summary: Add an organization-specific Master Data item
      description: >-
        Rejected for system-defined domains, which never accept
        organization-added items.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: domain
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMasterDataItemInput"
      responses:
        "201":
          description: Master Data item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterDataItem"
        "400":
          description: Domain is system-defined and does not accept organization-added items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An item with this code already exists for the domain in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/audit-events:
    get:
      operationId: listAuditEvents
      tags: [audit-events]
      summary: List audit events
      description: Paginated, most recent first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"

