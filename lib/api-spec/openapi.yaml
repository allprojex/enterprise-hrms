          format: date-time
        closeDate:
          type: ["string", "null"]
          format: date-time
        jobDescription:
          type: ["string", "null"]
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        preferredQualifications:
          type: ["string", "null"]
        seoTitle:
          type: ["string", "null"]
        seoDescription:
          type: ["string", "null"]
        featured:
          type: boolean
        locations:
          type: array
          items:
            $ref: "#/components/schemas/VacancyLocationInput"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/VacancyQuestionInput"

    UpdateVacancyInput:
      type: object
      description: Only accepted while the vacancy is in draft — status, filledCount, publicId, and audit fields are never accepted here.
      properties:
        workflowId:
          type: ["integer", "null"]
        title:
          type: string
          minLength: 1
        visibility:
          type: string
          enum: [internal, external, both]
        openingsCount:
          type: integer
          minimum: 1
        openDate:
          type: ["string", "null"]
          format: date-time
        closeDate:
          type: ["string", "null"]
          format: date-time
        jobDescription:
          type: ["string", "null"]
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        preferredQualifications:
          type: ["string", "null"]
        seoTitle:
          type: ["string", "null"]
        seoDescription:
          type: ["string", "null"]
        featured:
          type: boolean
        locations:
          type: array
          items:
            $ref: "#/components/schemas/VacancyLocationInput"
        questions:
          type: array
          items:
            $ref: "#/components/schemas/VacancyQuestionInput"

    ApplicationSummary:
      type: object
      description: >-
        Internal ATS view — unlike the public careers DTOs, this freely
        exposes internal ids (this route requires authentication and
        application.read).
      required:
        - id
        - vacancyId
        - vacancyTitle
        - candidateId
        - candidateName
        - candidateEmail
        - currentStageId
        - currentStageName
        - currentStageCategory
        - submittedAt
      properties:
        id:
          type: integer
        vacancyId:
          type: integer
        vacancyTitle:
          type: string
        candidateId:
          type: integer
        candidateName:
          type: string
        candidateEmail:
          type: string
        currentStageId:
          type: ["integer", "null"]
        currentStageName:
          type: ["string", "null"]
        currentStageCategory:
          type: string
          description: The current stage's fixed category, or "applied" for a never-triaged application (currentStageId null) — computed for display, never stored.
          enum: [applied, screening, interview, assessment, offer, hired, rejected, withdrawn]
        submittedAt:
          type: string
          format: date-time

    ApplicationListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationSummary"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ApplicationDocumentSummary:
      type: object
      description: Metadata only — this workstream does not add a document download/streaming endpoint.
      required: [id, categoryCode, fileName, mimeType, fileSize]
      properties:
        id:
          type: integer
        categoryCode:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer

    ApplicationStageHistoryEntry:
      type: object
      description: Immutable — never updated or deleted through any application API.
      required: [id, organizationId, applicationId, fromStageId, toStageId, movedByMembershipId, reason, movedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        fromStageId:
          type: ["integer", "null"]
          description: Null for an application's first recorded movement.
        toStageId:
          type: integer
        movedByMembershipId:
          type: ["integer", "null"]
        reason:
          type: ["string", "null"]
          description: Optional free-text comment supplied with the movement.
        movedAt:
          type: string
          format: date-time

    ApplicationAnswerSummary:
      type: object
      description: A candidate's response to one of the vacancy's screening questions (W52), captured at apply time — write-once, never edited.
      required: [id, vacancyQuestionId, questionText, answerText, knockoutFailed, createdAt]
      properties:
        id:
          type: integer
        vacancyQuestionId:
          type: integer
        questionText:
          type: string
        answerText:
          type: string
        knockoutFailed:
          type: boolean
          description: Computed server-side at submission for yes_no/multiple_choice knockout questions only. A failed knockout flags this row for review — it never auto-rejects the application (§12).
        createdAt:
          type: string
          format: date-time

    ApplicationScoreEntry:
      type: object
      description: Append-only — no update/delete path exists. Multiple entries per scoreType are expected as different reviewers score independently.
      required: [id, organizationId, applicationId, scoredByMembershipId, scoreType, score, notes, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        scoredByMembershipId:
          type: ["integer", "null"]
        scoreType:
          type: string
          enum: [screening, interview, overall]
        score:
          type: string
          description: Decimal string (numeric(5,2) column) — parse to a number for display/arithmetic.
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SubmitApplicationScoreInput:
      type: object
      required: [scoreType, score]
      properties:
        scoreType:
          type: string
          enum: [screening, interview, overall]
        score:
          type: number
        notes:
          type: ["string", "null"]

    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationSummary"
        - type: object
          required: [candidatePhone, rejectionReasonCode, withdrawalReasonCode, documents, history, answers, scores, scoreRollup]
          properties:
            candidatePhone:
              type: ["string", "null"]
            rejectionReasonCode:
              type: ["string", "null"]
            withdrawalReasonCode:
              type: ["string", "null"]
            documents:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationDocumentSummary"
            history:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationStageHistoryEntry"
            answers:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationAnswerSummary"
            scores:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationScoreEntry"
              description: Newest first.
            scoreRollup:
              type: ["number", "null"]
              description: >-
                Computed on read from `scores` — an explicit "overall"
                entry wins outright if one exists, otherwise the average of
                whichever of screening/interview have a latest entry. Null
                when no scores exist. Never applications.score (that column
                stays permanently unused — §12).

    MoveApplicationStageInput:
      type: object
      required: [toStageId]
      properties:
        toStageId:
          type: integer
        comment:
          type: ["string", "null"]

    RejectApplicationInput:
      type: object
      properties:
        reasonCode:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]

    WithdrawApplicationInput:
      type: object
      properties:
        reasonCode:
          type: ["string", "null"]
        comment:
          type: ["string", "null"]

    ReopenApplicationInput:
      type: object
      properties:
        comment:
          type: ["string", "null"]

    Candidate:
      type: object
      description: >-
        Internal ATS view of a W49 candidate record (this route requires
        authentication and candidate.read). Visibility-filtered per caller
        the same way as Applications — organization-wide for candidate.manage
        holders, otherwise scoped to candidates reachable via an application
        to a requisition that assigns the caller as recruiter or hiring
        manager. This workstream (W53) never redesigns the candidate record
        itself, only adds this internal read path.
      required: [id, organizationId, firstName, lastName, email, phone, source, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        source:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CandidateListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    CandidateNote:
      type: object
      description: >-
        Create-only — no update/delete path exists (a correction is a new
        note, never an edit of a past one). Never exposed to an applicant —
        no candidate-session read path exists anywhere in this codebase (W50
        deferred).
      required: [id, organizationId, candidateId, applicationId, authorMembershipId, note, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        candidateId:
          type: integer
        applicationId:
          type: ["integer", "null"]
          description: Null for a candidate-level note; set for a note scoped to one specific application.
        authorMembershipId:
          type: ["integer", "null"]
        note:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateCandidateNoteInput:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
        applicationId:
          type: ["integer", "null"]
          description: Must belong to this candidate if supplied.

    CandidateTag:
      type: object
      description: Free-text label, never a fixed enum — tag values are never hard-coded.
      required: [id, organizationId, candidateId, tag, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        candidateId:
          type: integer
        tag:
          type: string
        createdAt:
          type: string
          format: date-time

    AddCandidateTagInput:
      type: object
      required: [tag]
      properties:
        tag:
          type: string
          minLength: 1

    TalentPool:
      type: object
      description: Reusable, org-scoped candidate grouping — never tied to a single vacancy or requisition.
      required: [id, organizationId, name, description, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTalentPoolInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    UpdateTalentPoolInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    TalentPoolMember:
      type: object
      required: [id, organizationId, talentPoolId, candidateId, addedByMembershipId, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        talentPoolId:
          type: integer
        candidateId:
          type: integer
        addedByMembershipId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    AddTalentPoolMemberInput:
      type: object
      required: [candidateId]
      properties:
        candidateId:
          type: integer

    InterviewPanelMember:
      type: object
      description: >-
        Panel composition only, independent from interview results.
        `interviewerMembershipId` is null for an external interviewer,
        captured by name/email only (no login, no external-interviewer
        portal).
      required: [id, organizationId, interviewId, interviewerMembershipId, externalInterviewerName, externalInterviewerEmail, role, conflictDeclared, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        interviewId:
          type: integer
        interviewerMembershipId:
          type: ["integer", "null"]
        externalInterviewerName:
          type: ["string", "null"]
        externalInterviewerEmail:
          type: ["string", "null"]
        role:
          type: string
          enum: [lead, member]
        conflictDeclared:
          type: boolean
          description: A plain self-declared flag — no automated behavior is attached to it in this workstream.
        createdAt:
          type: string
          format: date-time

    PanelMemberInput:
      type: object
      description: Either interviewerMembershipId (internal) or both externalInterviewerName and externalInterviewerEmail (external) must be supplied, never both, never neither.
      properties:
        interviewerMembershipId:
          type: ["integer", "null"]
        externalInterviewerName:
          type: ["string", "null"]
        externalInterviewerEmail:
          type: ["string", "null"]
        role:
          type: string
          enum: [lead, member]
        conflictDeclared:
          type: boolean

    Interview:
      type: object
      description: >-
        Scheduling only — never evaluation. Column list is exactly §9's
        `interviews` row; no notes/timezone/separate-end-time field exists.
        `outcome` is a short free-text summary settable only once the
        interview is marked completed, never a score/recommendation
        (W55's `interview_scorecards` is a separate table).
      required: [id, organizationId, applicationId, interviewType, scheduledAt, durationMinutes, location, meetingLink, status, outcome, createdAt, updatedAt, panelMembers]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        status:
          type: string
          enum: [scheduled, completed, cancelled, no_show]
        outcome:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/InterviewPanelMember"

    InterviewListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Interview"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    ScheduleInterviewInput:
      type: object
      required: [interviewType, scheduledAt, durationMinutes]
      properties:
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/PanelMemberInput"

    UpdateInterviewInput:
      type: object
      description: >-
        Supplying scheduledAt reschedules — cancels the current row and
        creates a brand new one (§4.5), never mutating a scheduled
        interview's date in place. Omitting scheduledAt performs an ordinary
        in-place update, including a status transition to completed/no_show
        and/or a full panel replace.
      properties:
        interviewType:
          type: string
          enum: [phone, virtual, in_person]
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        location:
          type: ["string", "null"]
        meetingLink:
          type: ["string", "null"]
        status:
          type: string
          enum: [completed, no_show]
        outcome:
          type: ["string", "null"]
        panelMembers:
          type: array
          items:
            $ref: "#/components/schemas/PanelMemberInput"

    InterviewScorecardResponse:
      type: object
      description: >-
        One per-criterion answer within a scorecard. `criterion` is plain
        free text supplied per submission — no organization-configurable
        criteria/template table exists in this frozen scope. `rating` has no
        defined scale in the frozen plan and is kept an unconstrained
        integer, the same unconstrained-numeric posture application_scores.score
        (W52) already established for a comparable field. Immutable once the
        parent scorecard is submitted (in practice) / finalized (formally).
      required: [id, organizationId, scorecardId, criterion, rating, comment, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        scorecardId:
          type: integer
        criterion:
          type: string
        rating:
          type: ["integer", "null"]
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ResponseInput:
      type: object
      required: [criterion]
      properties:
        criterion:
          type: string
          minLength: 1
        rating:
          type: ["integer", "null"]
        comment:
          type: ["string", "null"]

    InterviewScorecard:
      type: object
      description: >-
        One per panel member per interview. Deliberately never exposes
        externalInterviewerToken/expiry (reserved for a later workstream,
        never consumed by any route here — an internal-only column, never a
        DTO field, so a raw token can never leak through this API even once
        another workstream starts populating it). No weighting/rollup number
        exists in the frozen model — recommendation is the only structured
        summary field.
      required: [id, organizationId, interviewId, interviewerMembershipId, recommendation, overallComment, submittedAt, finalizedAt, createdAt, updatedAt, responses]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        interviewId:
          type: integer
        interviewerMembershipId:
          type: ["integer", "null"]
        recommendation:
          type: ["string", "null"]
          enum: [strong_yes, yes, no, strong_no]
        overallComment:
          type: ["string", "null"]
        submittedAt:
          type: ["string", "null"]
          format: date-time
          description: Null while still a draft. Set exactly once — a submitted scorecard is immutable from the owning interviewer's side.
        finalizedAt:
          type: ["string", "null"]
          format: date-time
          description: Set only by an HR/recruiter administrator (scorecard.finalize) — never by the submitting interviewer themselves.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        responses:
          type: array
          items:
            $ref: "#/components/schemas/InterviewScorecardResponse"

    SaveInterviewScorecardInput:
      type: object
      properties:
        recommendation:
          type: ["string", "null"]
          enum: [strong_yes, yes, no, strong_no]
        overallComment:
          type: ["string", "null"]
        responses:
          type: array
          items:
            $ref: "#/components/schemas/ResponseInput"
          description: Full replace of the response set on every save.
        submit:
          type: boolean
          description: When true, transitions this draft to submitted in the same call.

    RecommendationCounts:
      type: object
      required: [strong_yes, yes, no, strong_no]
      properties:
        strong_yes:
          type: integer
        yes:
          type: integer
        no:
          type: integer
        strong_no:
          type: integer

    InterviewScorecardListResponse:
      type: object
      required: [scorecards, panelSummary]
      properties:
        scorecards:
          type: array
          items:
            $ref: "#/components/schemas/InterviewScorecard"
        panelSummary:
          type: ["object", "null"]
          description: >-
            Computed on every read, never stored — the same discipline as
            W52's scoreRollup. Null unless the caller holds scorecard.read_all.
          required: [totalPanelMembers, submittedCount, pendingCount, recommendationCounts]
          properties:
            totalPanelMembers:
              type: integer
            submittedCount:
              type: integer
            pendingCount:
              type: integer
            recommendationCounts:
              $ref: "#/components/schemas/RecommendationCounts"

    ReferenceBackgroundCheckStatus:
      type: string
      description: Shared status model (§4.7) for both reference and background checks. No "cancelled"/"expired" state exists — a check that can't be completed is recorded as unable_to_complete.
      enum: [requested, in_progress, completed, flagged, unable_to_complete]

    ReferenceCheck:
      type: object
      description: >-
        Referee contact + outcome, status-tracked, no vendor integration.
        Column list is exactly §9's `reference_checks` row. No dedicated
        reference-check permission exists — visibility/write reuse the
        application's own read/manage pair.
      required: [id, organizationId, applicationId, refereeName, refereeContact, refereeRelationship, status, notes, completedAt, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        refereeName:
          type: string
        refereeContact:
          type: string
        refereeRelationship:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/ReferenceBackgroundCheckStatus"
        notes:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateReferenceCheckInput:
      type: object
      required: [refereeName, refereeContact]
      properties:
        refereeName:
          type: string
          minLength: 1
        refereeContact:
          type: string
          minLength: 1
        refereeRelationship:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    UpdateReferenceCheckStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, flagged, unable_to_complete]
        notes:
          type: ["string", "null"]

    BackgroundCheck:
      type: object
      description: >-
        Background check tracking, status-tracked, no vendor integration —
        vendorReference is a plain, manually-entered string, never a real
        provider API call. Column list is exactly §9's `background_checks`
        row, minus the raw documentStorageKey (never exposed — hasEvidence
        signals its presence instead). Gated by its own dedicated
        background_check.read/.manage pair, organization-wide only.
      required: [id, organizationId, applicationId, checkType, status, vendorReference, resultSummary, hasEvidence, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
