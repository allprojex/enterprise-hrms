              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/config/{namespace}:
    get:
      operationId: getOrganizationConfig
      tags: [organizations]
      summary: Get an organization configuration namespace
      description: >-
        Returns the namespace's saved configuration, or its safe defaults if
        nothing has been saved yet. 404s for a namespace the Configuration
        Engine doesn't recognize.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology, attendance — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time. A
            namespace may additionally require its owning module to be
            enabled for the organization (e.g. attendance requires the
            "attendance" module) — see requireModuleEnabled (W5); such a
            namespace 403s instead of 404ing when its module is disabled.
      responses:
        "200":
          description: Organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
    patch:
      operationId: updateOrganizationConfig
      tags: [organizations]
      summary: Update an organization configuration namespace
      description: >-
        Merges the given keys into the namespace's existing configuration and
        validates the merged result against that namespace's schema before
        saving.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: namespace
          in: path
          required: true
          schema:
            type: string
          description: >-
            One of the namespaces registered with the Configuration Engine
            (currently general, terminology, attendance — see
            artifacts/api-server/src/services/organizationConfig.ts for the
            authoritative list). Left as an open string, not an enum, so new
            namespaces can be registered in code without an API contract
            change; an unrecognized namespace 404s at request time. A
            namespace may additionally require its owning module to be
            enabled for the organization (e.g. attendance requires the
            "attendance" module) — see requireModuleEnabled (W5); such a
            namespace 403s instead of 404ing when its module is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationConfigInput"
      responses:
        "200":
          description: Updated organization configuration namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationConfig"
        "400":
          description: The merged configuration failed namespace validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/modules:
    get:
      operationId: listOrganizationModules
      tags: [modules]
      summary: List modules with this organization's enablement state
      description: >-
        Merges the platform module registry (see GET /modules) with this
        organization's per-module enablement overrides. A module with no
        override row falls back to its registry defaultEnabled value. Does
        not gate access to anything yet — enforcing enabled/disabled on
        routes/navigation is a later workstream.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Modules with this organization's enablement state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationModule"

  /organizations/{organizationId}/modules/{moduleKey}:
    patch:
      operationId: updateOrganizationModule
      tags: [modules]
      summary: Enable or disable a module for this organization
      description: >-
        Enabling requires the module's registry status to be active or beta
        (hidden and deprecated modules have no owning workstream yet and
        cannot be turned on) and requires every module in its
        requiredModuleKeys to already be enabled for this organization.
        Disabling is rejected if another currently-enabled module in this
        organization requires it.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: moduleKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationModuleInput"
      responses:
        "200":
          description: Updated module enablement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationModule"
        "400":
          description: Module cannot be enabled or disabled (not enableable, missing dependencies, or required by another enabled module)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown module key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /master-data/domains:
    get:
      operationId: listMasterDataDomains
      tags: [master-data]
      summary: List the Master Data domain registry
      description: >-
