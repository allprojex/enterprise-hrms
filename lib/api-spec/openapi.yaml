        - name: from
          in: query
          required: true
          description: Inclusive range start, YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive range end, YYYY-MM-DD. Range cannot exceed 100 days.
          schema:
            type: string
            format: date
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Approved leave and overlapping holidays within the requested range, visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveCalendarResponse"
        "400":
          description: Missing/invalid from or to, or the range exceeds 100 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance-events:
