    RecoverAssetInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    UpdateAssetConditionInput:
      type: object
      required: [condition, reason]
      properties:
        condition:
          $ref: "#/components/schemas/AssetCondition"
        reason:
          type: string
          minLength: 1

    AssetAssignmentEndReason:
      type: string
      enum: [returned, lost, transferred, retired]

    AssetAssignment:
      type: object
      required:
        [
          id,
          organizationId,
          assetId,
          employeeId,
          assetTagSnapshot,
          assetNameSnapshot,
          categorySnapshot,
          issuedAt,
          issueCondition,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        assetId:
          type: integer
        employeeId:
          type: integer
          description: Live reference — current identity, used for manager-scope resolution elsewhere. Not a historical snapshot.
        assetTagSnapshot:
          type: string
        assetNameSnapshot:
          type: string
        categorySnapshot:
          type: string
        departmentIdSnapshot:
          type: ["integer", "null"]
          description: The employee's department at issue time — never re-derived from a later transfer.
        positionIdSnapshot:
          type: ["integer", "null"]
        issuedAt:
          type: string
          format: date-time
        issuedByMembershipId:
          type: ["integer", "null"]
        expectedReturnDate:
          type: ["string", "null"]
          format: date
        issueCondition:
          $ref: "#/components/schemas/AssetCondition"
        issueNotes:
          type: ["string", "null"]
        acknowledgedAt:
          type: ["string", "null"]
          format: date-time
          description: Set once, only while custodyEndedAt is null. Never cleared by a later return.
        acknowledgementNote:
          type: ["string", "null"]
        custodyEndedAt:
          type: ["string", "null"]
          format: date-time
          description: NULL means this is the currently-active assignment.
        endReason:
          anyOf:
            - $ref: "#/components/schemas/AssetAssignmentEndReason"
            - type: "null"
        receivedByMembershipId:
          type: ["integer", "null"]
        returnCondition:
          anyOf:
            - $ref: "#/components/schemas/AssetCondition"
            - type: "null"
        returnNotes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AssignAssetInput:
      type: object
      required: [employeeId]
      properties:
        employeeId:
          type: integer
          description: Must belong to the caller's own organization.
        issueCondition:
          $ref: "#/components/schemas/AssetCondition"
        expectedReturnDate:
          type: string
          format: date
        issueNotes:
          type: string

    ReturnAssetInput:
      type: object
      properties:
        returnCondition:
          $ref: "#/components/schemas/AssetCondition"
        returnNotes:
          type: string

    AcknowledgeAssetAssignmentInput:
      type: object
      properties:
        acknowledgementNote:
          type: string


    AssetIncidentType:
      type: string
      enum: [damage, loss]

    AssetIncidentStatus:
      type: string
      enum: [open, reviewed, dismissed]
      description: Minimal lifecycle. open -> reviewed | dismissed are HR/Asset-Officer-only transitions, both terminal (no reopen).

    AssetIncident:
      type: object
      required: [id, organizationId, assetId, assignmentId, reportedByEmployeeId, incidentType, description, reportedAt, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        assetId:
          type: integer
        assignmentId:
          type: integer
          description: The specific custody period this report concerns.
        reportedByEmployeeId:
          type: integer
          description: Server-derived from caller identity at creation — never client-supplied.
        incidentType:
          $ref: "#/components/schemas/AssetIncidentType"
        description:
          type: string
        reportedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AssetIncidentStatus"
        reviewedByMembershipId:
          type: ["integer", "null"]
        reviewedAt:
          type: ["string", "null"]
          format: date-time
        resolutionNotes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReportAssetIssueInput:
      type: object
      required: [incidentType, description]
      properties:
        incidentType:
          $ref: "#/components/schemas/AssetIncidentType"
        description:
          type: string
          minLength: 1


    ReviewAssetIncidentInput:
      type: object
      properties:
        resolutionNotes:
          type: string

    DismissAssetIncidentInput:
      type: object
      properties:
        resolutionNotes:
          type: string

    AssetMaintenanceStatus:
      type: string
      enum: [scheduled, in_progress, completed, cancelled]
      description: scheduled -> in_progress -> completed | cancelled. Both completed and cancelled are terminal — no reopen (§7).

    AssetMaintenance:
      type: object
      required: [id, organizationId, assetId, maintenanceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        assetId:
          type: integer
        maintenanceType:
          type: string
        description:
          type: ["string", "null"]
        providerText:
          type: ["string", "null"]
          description: Free text — no vendor/provider table (§11).
        status:
          $ref: "#/components/schemas/AssetMaintenanceStatus"
        startedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        cost:
          type: ["string", "null"]
          description: Optional, reference-only. No depreciation/accounting logic.
        notes:
          type: ["string", "null"]
        createdByMembershipId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssetMaintenanceInput:
      type: object
      required: [maintenanceType]
      properties:
        maintenanceType:
          type: string
          minLength: 1
        description:
          type: string
        providerText:
          type: string
        cost:
          type: number
          minimum: 0
        notes:
          type: string

    AssetMaintenanceAction:
      type: string
      enum: [start, complete, cancel]
      description: >-
        The server maps this to the correct validated conditional UPDATE —
        the request body never accepts a raw target status.

    UpdateAssetMaintenanceInput:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/AssetMaintenanceAction"
        cost:
          type: number
          minimum: 0
        notes:
          type: string

    AssetEvidence:
      type: object
      required: [id, organizationId, assetId, employeeDocumentId, addedByMembershipId, addedAt, fileName, mimeType, fileSize, uploadedBy]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        assetId:
          type: integer
        employeeDocumentId:
          type: integer
          description: Points into the existing employee_documents table — no separate Assets storage layer (§13).
        addedByMembershipId:
          type: ["integer", "null"]
        addedAt:
          type: string
          format: date-time
        fileName:
          type: string
          description: Original client-supplied filename, for display only — never used to build a storage path.
        mimeType:
          type: string
        fileSize:
          type: integer
        uploadedBy:
          type: ["integer", "null"]

    AssetDashboardStatusItem:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: "#/components/schemas/AssetStatus"
        count:
          type: integer

    AssetDashboard:
      type: object
      required: [totalAssetCount, statusBreakdown, employeesWithAssignedAssetsCount, overdueReturnCount, openIncidentCount]
      properties:
        totalAssetCount:
          type: integer
          description: In scope for the caller (§18) — organization-wide total, or the count of assets currently under an active assignment to the caller/a current direct report.
        statusBreakdown:
          type: array
          description: All 5 asset statuses, zero-filled, fixed order.
          items:
            $ref: "#/components/schemas/AssetDashboardStatusItem"
        employeesWithAssignedAssetsCount:
          type: integer
          description: Distinct employees currently holding an in-scope asset.
        overdueReturnCount:
          type: integer
          description: In-scope active assignments past their own expectedReturnDate — only for assignments that set one.
        openIncidentCount:
          type: integer
          description: In-scope asset_incidents with status = open.

    EmploymentPeriodSummary:
      type: object
      description: >-
        One employment_periods row (Phase 2A, W22) — append-only, never
        edited or deleted. previousState/newState snapshot the raw ids that
        changed at the time of the event; they are never resolved to
        current department/branch/position names, since that would silently
        replace historical meaning with present-day meaning.
      required: [id, eventType, effectiveDate, newState, createdAt]
      properties:
        id:
          type: integer
        eventType:
          type: string
          description: Free text — "transfer" | "promotion" | "confirmation" today, per each writing workstream's own event type.
        effectiveDate:
          type: string
          format: date-time
        previousState:
          nullable: true
          description: Raw snapshot of the fields that changed, before the event. Null for the first employment_periods row on a given employee.
        newState:
          description: Raw snapshot of the fields that changed, after the event.
        createdAt:
          type: string
          format: date-time

    MyEmploymentHistoryResponse:
      type: object
      description: >-
        Employee Self-Service Career Profile foundation (Phase 3F, W105).
        `linked: false` (with `items: []`) mirrors GET /me/employee's own
        intentional not-linked state, not an error.
      required: [linked, items]
      properties:
        linked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentPeriodSummary"

    SelfServiceSkill:
      type: object
      description: Career Profile (Phase 3F, W106) — the caller's own skill, restricted from the HR EmployeeSkill shape (organizationId/employeeId/createdBy excluded as redundant/internal).
      required: [id, skillCode, createdAt]
      properties:
        id:
          type: integer
        skillCode:
          type: string
          description: Code from the "skill" Master Data domain.
        proficiencyLevel:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MySkillsResponse:
      type: object
      required: [linked, items]
      properties:
        linked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/SelfServiceSkill"

    SelfServiceQualification:
      type: object
      description: Career Profile (Phase 3F, W106) — the caller's own qualification, restricted from the HR EmployeeQualification shape.
      required: [id, qualificationTypeCode, createdAt]
      properties:
        id:
          type: integer
        qualificationTypeCode:
          type: string
          description: Code from the "qualification_type" Master Data domain.
        institution:
          type: ["string", "null"]
        fieldOfStudy:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          format: date-time
        endDate:
          type: ["string", "null"]
          format: date-time
        grade:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MyQualificationsResponse:
      type: object
      required: [linked, items]
      properties:
        linked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/SelfServiceQualification"

    SelfServiceCertification:
      type: object
      description: >-
        Career Profile (Phase 3F, W106) — the caller's own HR-maintained/
        external certification (employee_certifications only). Never
        includes system-issued Learning certificates (learning_certificates)
        — those remain My Learning's own exclusive surface. Expired records
        are always included; expiry status is computed client-side from
        expiryDate, mirroring My Learning's own established convention, never
        returned as a field here.
      required: [id, certificationTypeCode, createdAt]
      properties:
        id:
          type: integer
        certificationTypeCode:
          type: string
          description: Code from the "certification_type" Master Data domain.
        issuingOrganization:
          type: ["string", "null"]
        issueDate:
          type: ["string", "null"]
          format: date-time
        expiryDate:
          type: ["string", "null"]
          format: date-time
        credentialId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MyCertificationsResponse:
      type: object
      required: [linked, items]
      properties:
        linked:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/SelfServiceCertification"
