          description: Public holidays for the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"
    post:
      operationId: createPublicHoliday
      tags: [public-holidays]
      summary: Create a public holiday
      description: >-
        public_holiday.manage required — distinct from leave_request.approve
        and leave_type.manage, neither of which grants holiday management.
        scope is always "organization" in this phase regardless of what's
        sent. effectiveYear is required for a one-off holiday and rejected
