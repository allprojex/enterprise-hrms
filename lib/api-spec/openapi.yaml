openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Enterprise HRMS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: organizations
    description: Organization operations
  - name: notifications
    description: Notification operations
  - name: employees
    description: Employee directory operations
  - name: branches
    description: Branch operations
  - name: departments
    description: Department operations
  - name: positions
    description: Position operations
  - name: roles
    description: Role operations
  - name: permissions
    description: Permission operations
  - name: members
    description: Organization membership management
  - name: primary-hr
    description: Primary HR assignment operations
  - name: audit-events
    description: Audit log operations
  - name: invitations
    description: Administrative user invitation operations
  - name: reports
    description: Reporting Foundation operations
  - name: self-service
    description: Employee Self-Service operations
  - name: recruitment
    description: Recruitment Configuration operations (settings, workflows, stages)
  - name: vacancies
    description: Vacancy management operations (the postable unit produced from an approved job requisition)
  - name: applications
    description: Internal recruitment application pipeline operations (review, stage movement, reject/withdraw/reopen) — the start of the ATS
  - name: public-careers
    description: Unauthenticated public careers portal operations (organization-slug-scoped listing, detail, and anonymous application submission)
  - name: candidates
    description: Internal candidate directory, notes, and tags operations (W53 — candidate records themselves are W49's, this workstream adds internal read access plus collaboration features)
  - name: talent-pools
    description: Reusable, org-scoped candidate grouping operations (W53) — never tied to a single vacancy or requisition
  - name: interviews
    description: Interview scheduling and panel composition operations (W54) — scheduling only, never evaluation (scores/recommendations/hiring decisions are W55's interview_scorecards)
  - name: interview-scorecards
    description: Independent, lockable interview evaluation operations (W55) — one scorecard per panel member per interview, never redesigning W54 scheduling or mixing with W52's screening scores
  - name: reference-checks
    description: Referee contact and outcome tracking operations (W56) — status-tracked, no vendor integration
  - name: background-checks
    description: Background check tracking operations (W56) — status-tracked, no vendor/government integration; its own dedicated, organization-wide-only permission pair since result content is highly sensitive
  - name: offers
    description: >-
      Versioned offer envelope, single-step approval, and issue/withdraw
      operations (W57) — the final Recruitment stage. offer.manage is the
      first Recruitment write permission this phase seeded to every role
      (assigned recruiter/hiring manager can manage their own draft, per
      §7); offer.approve/.issue/.withdraw stay organization-wide only
  - name: pre-employment-requirements
    description: >-
      Checklist tracking before employee conversion (W58) — no dedicated
      permission exists, reuses application.read/.manage; status is freely
      settable (pending/satisfied/waived, no one-way lifecycle) and never
      itself creates an employee or activates any HR module
  - name: employee-conversion
    description: >-
      The controlled hand-off from Recruitment to HR (W59) — reuses the
      existing employee-creation service unchanged (one authoritative
      pathway); requires both candidate.convert_to_employee and
      employee.write, neither alone sufficient
  - name: recruitment-reporting
    description: >-
      Recruitment Dashboard & Reporting operations (W61) — read-only,
      server-computed metrics over existing Recruitment tables, no stored
      aggregate. Reuses the Reporting Foundation's registry/export
      conventions (W17/ADR-016) via dedicated, visibility-scoped routes
      (GET /reports still lists these entries for catalog purposes, but
      they only execute here — see report-definitions.ts). Single
      permission, recruitment.reports.read: assigned recruiter/hiring
      manager sees their own workload/pipeline scope, organization-wide
      HR sees everything.
  - name: organization-domains
    description: >-
      Multi-Organization Tenant Infrastructure — platform-admin management
      of the hostnames (platform testing subdomains and custom domains)
      that resolve a request to an organization. Reserved to the platform
      super_admin role; a resolved hostname only ever identifies tenant
      context, it never grants authorization on its own — every
      org-scoped route still independently re-verifies a live membership
      the same way it always has. See docs/TENANT_DOMAINS_AND_ACCESS.md.
  - name: tenant-context
    description: >-
      Unauthenticated, safe tenant branding lookup for the login
      experience — resolved only from the caller's own request hostname,
      never from a client-supplied hostname parameter (not a tenant
      directory).
  - name: performance-cycles
    description: Phase 3C, W75 — Performance cycle configuration and bulk review assignment. HR/admin only (performance.manage).
  - name: performance-reviews
    description: Phase 3C, W75 — read access to assigned Performance reviews. HR/admin only (performance.manage); self/manager visibility is a later workstream's concern.
  - name: performance-reporting
    description: Phase 3C, W81 — Performance dashboard and reports. Read-only, server-computed aggregation over existing Performance data, no stored analytics table. Scoped own/reviewer-of-record/organization-wide (performance.reports.read, org-wide reach signaled by performance.manage).
  - name: performance-evidence
    description: Phase 3C, W82 — Evidence/attachments on Performance reviews. A lightweight join over the existing employee_documents storage layer (§8.9) — no new file-storage code. No new permission key; upload is stage-gated by the caller's own relationship to the review, view/download are not.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check (liveness)
      description: >-
        Liveness only — confirms the process itself is up. Never touches the
        database, so it can't be dragged down by a database outage; see
        /readyz for that. Includes the deploy-time release version when set
        (RELEASE_VERSION / GIT_COMMIT_SHA), "unknown" otherwise.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      description: >-
        Confirms this instance can actually reach the database. A load
        balancer/orchestrator should stop routing traffic here (not restart
        the process) on a failing readiness check — that distinction is why
        this is a separate endpoint from /healthz.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready — the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /tenant-context:
    get:
      operationId: getTenantContext
      tags: [tenant-context]
      summary: Get safe tenant context for the current hostname
      description: >-
        Public, unauthenticated. Resolved only from the request's own
        hostname (Host header, or X-Tenant-Hostname in this project's
        split-port dev setup) — accepts no hostname parameter, so it can
        never be used to enumerate other tenants. Returns `resolved: false`
        for every unresolvable case alike (unmapped hostname, disabled
        domain, suspended organization) — the response never distinguishes
        which.
      responses:
        "200":
          description: Safe tenant context, or an unresolved marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantContext"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      description: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      description: Invalidate the current session
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      description: >-
        Sends a password reset email via Resend if the address is registered.
        Always returns the same confirmation regardless of whether the email
        is registered or delivery succeeds, to avoid revealing account
        existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password/{token}:
    get:
      operationId: getPasswordResetStatus
      tags: [auth]
      summary: Preview a password reset token
      description: Public -- no authentication required. Used by the reset-password page.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reset token status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetStatus"
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password
      description: >-
        Public -- no authentication required. Sets a new password and
        consumes the token so the link can't be replayed.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Invalid or already-used reset link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: Reset link expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/switch-organization:
    post:
      operationId: switchOrganization
      tags: [auth]
      summary: Switch active organization
      description: >-
        Switches the caller's active organization context for the current
        session. Only succeeds if the caller has an active membership in the
        target organization; never trusts the client beyond that check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchOrganizationInput"
      responses:
        "200":
          description: Active organization switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active membership in the requested organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user's profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /users/me:
    patch:
      operationId: updateMyProfile
      tags: [users]
      summary: Update own profile
      description: Update the current user's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations
      description: Returns all organizations the user has access to
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create (onboard) an organization
      description: >-
        Creates a new organization and, atomically, makes the caller its
        first active member with the org_admin role and Primary HR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization
      description: Returns an organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization details
      description: >-
        Partial update of name/slug/type/logoUrl/industry/employeeCount.
        Does not change lifecycle status — use suspend/reactivate for that.
        Requires org_admin (within the organization) or super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationInput"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{id}/suspend:
    post:
      operationId: suspendOrganization
      tags: [organizations]
      summary: Suspend an organization
      description: Sets status to suspended. Requires org_admin (within the organization) or super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{id}/reactivate:
    post:
      operationId: reactivateOrganization
      tags: [organizations]
      summary: Reactivate a suspended organization
      description: Sets status to active. Requires org_admin (within the organization) or super_admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization reactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/domains:
    get:
      operationId: listOrganizationDomains
      tags: [organization-domains]
      summary: List an organization's domains
      description: Platform super_admin only.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of domains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationDomain"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createOrganizationDomain
      tags: [organization-domains]
      summary: Assign a domain to an organization
      description: >-
        Platform super_admin only. platform_subdomain hostnames become
        active immediately (the platform itself controls those);
        custom_domain hostnames start pending until an operator activates
        them once DNS ownership has been confirmed out-of-band.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationDomainInput"
      responses:
        "201":
          description: Domain created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomain"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Hostname already assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/domains/{id}/activate:
    post:
      operationId: activateOrganizationDomain
      tags: [organization-domains]
      summary: Activate a domain
      description: >-
        Platform super_admin only. Moves a pending custom domain (DNS
        ownership confirmed out-of-band) or a disabled domain to active.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomain"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/domains/{id}/disable:
    post:
      operationId: disableOrganizationDomain
      tags: [organization-domains]
      summary: Disable a domain
      description: >-
        Platform super_admin only. The domain immediately stops resolving
        to any tenant context; the row and its history are kept, not
        deleted. Clears the domain's primary flag if it held one.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomain"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/domains/{id}/set-primary:
    post:
      operationId: setPrimaryOrganizationDomain
      tags: [organization-domains]
      summary: Mark a domain primary
      description: >-
        Platform super_admin only. Only an active domain may become
        primary; atomically clears any previous primary for the same
        organization.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Domain marked primary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDomain"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Domain is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/organizations:
    get:
      operationId: listMyOrganizations
      tags: [organizations]
      summary: List my organization memberships
      description: >-
        Returns every organization the caller has an active membership in,
        with their role(s) and Primary HR status in each.
      responses:
        "200":
          description: List of memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/employee:
    get:
      operationId: getMyEmployee
      tags: [self-service]
      summary: Resolve the caller's own linked employee (Employee Self-Service, W39)
      description: >-
        Resolves "which employee is me" via the employee-user link (W14) for
        the caller's currently active organization only — never a
        client-supplied employee ID, never another organization's data.
        `linked: false` (with `employee: null`) is the intentional response
        when the caller's login isn't yet linked to an employee record, or
        no longer has an active organization membership resolvable — not an
        error. Gated by the `employee_self_service` module.
      responses:
        "200":
          description: The caller's own employee, or an intentional not-linked response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEmployeeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or the employee_self_service module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/employment-history:
    get:
      operationId: getMyEmploymentHistory
      tags: [self-service]
      summary: The caller's own internal employment history (Employee Self-Service Career Profile foundation, Phase 3F, W105)
      description: >-
        Resolves "which employee is me" the same way GET /me/employee does —
        never a client-supplied employee ID. Reuses the existing
        employment_periods table (Phase 2A, W22) verbatim — transfer/
        promotion/confirmation events, most recent first. `linked: false`
        (with `items: []`) is the intentional not-linked response, mirroring
        GET /me/employee. Gated by the employee_self_service module.
      responses:
        "200":
          description: The caller's own employment history, or the controlled not-linked state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyEmploymentHistoryResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or the employee_self_service module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/skills:
    get:
      operationId: getMySkills
      tags: [self-service]
      summary: The caller's own skills (Employee Self-Service Career Profile, Phase 3F, W106)
      description: >-
        Resolves "which employee is me" the same way GET /me/employee does —
        never a client-supplied employee ID. Reuses the existing
        employee_skills table (Phase 2A, W24) verbatim. `linked: false` (with
        `items: []`) mirrors GET /me/employee's own intentional not-linked
        state. Gated by the employee_self_service module.
      responses:
        "200":
          description: The caller's own skills, or the controlled not-linked state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MySkillsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or the employee_self_service module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/qualifications:
    get:
      operationId: getMyQualifications
      tags: [self-service]
      summary: The caller's own qualifications (Employee Self-Service Career Profile, Phase 3F, W106)
      description: >-
        Resolves "which employee is me" the same way GET /me/employee does.
        Reuses the existing employee_qualifications table (Phase 2A, W24)
        verbatim. `linked: false` (with `items: []`) mirrors GET /me/employee's
        own intentional not-linked state. Gated by the employee_self_service
        module.
      responses:
        "200":
          description: The caller's own qualifications, or the controlled not-linked state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyQualificationsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or the employee_self_service module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/certifications:
    get:
      operationId: getMyCertifications
      tags: [self-service]
      summary: The caller's own external/HR-maintained certifications (Employee Self-Service Career Profile, Phase 3F, W106)
      description: >-
        Resolves "which employee is me" the same way GET /me/employee does.
        Reuses the existing employee_certifications table (Phase 2A, W24)
        verbatim — deliberately never learning_certificates (Phase 3D), which
        remains My Learning's own exclusive surface. Expired records are
        always included, never filtered. `linked: false` (with `items: []`)
        mirrors GET /me/employee's own intentional not-linked state. Gated by
        the employee_self_service module.
      responses:
        "200":
          description: The caller's own certifications, or the controlled not-linked state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCertificationsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or the employee_self_service module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/internal-vacancies:
    get:
      operationId: listMyInternalVacancies
      tags: [self-service]
      summary: List internal vacancies eligible for the caller to apply to (Employee Self-Service Internal Applications, W60)
      description: >-
        Resolves "which employee is me" the same way GET /me/employee does —
        never a client-supplied employee ID. `linked: false` (unlinked
        login) or `active: false` (linked but not an active employee) both
        return `items: []` as an intentional 200-OK controlled state, not
        an error, mirroring GET /me/employee's own "linked: false"
        precedent. Only vacancies that are published, internally visible
        (visibility internal or both), and within their open/close window
        are included — never recruiter, hiring-manager, requisition,
        approval, or audit detail. Gated by both employee_self_service and
        recruitment (independently — a disabled recruitment module
        degrades only this section, per §8).
      responses:
        "200":
          description: Eligible internal vacancies, or the controlled not-linked/not-active state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalVacanciesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or a required module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/internal-vacancies/{publicId}/apply:
    post:
      operationId: applyToInternalVacancy
      tags: [self-service]
      summary: Submit an internal application to a vacancy (W60)
      description: >-
        Employee identity, candidate resolution/linkage, and vacancy
        eligibility are all re-derived and re-validated server-side —
        nothing supplied by the caller beyond the vacancy's publicId and
        optional screening answers is trusted. Idempotent: a repeat
        submission to the same vacancy returns the existing application
        (isNew: false), never a second row (applications.candidateId +
        vacancyId is unique). Enters the existing W51 pipeline unchanged,
        source marked "internal_ess". Never invokes W59's employee
        conversion and never changes the employee record. 403 if the
        caller has no active employee link (unlike the two GET endpoints,
        a blocked write action is a conventional error here, not a
        200-with-flag response).
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInternalApplicationInput"
      responses:
        "201":
          description: Application submitted (or the existing one returned idempotently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyInternalApplicationSubmitResult"
        "403":
          description: No active employee link for this user in this organization, or the employee is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found (or not internally eligible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /me/applications:
    get:
      operationId: listMyInternalApplications
      tags: [self-service]
      summary: List the caller's own internal applications (W60)
      description: >-
        Only the caller's own applications, resolved via the same
        employee-candidate linkage established at submission time — never
        another employee's. No recruiter notes, screening scores, interview
        scorecards, reference/background checks, or offer/approval detail
        is ever included. Same controlled `linked`/`active` 200-OK state as
        GET /me/internal-vacancies.
      responses:
        "200":
          description: The caller's own internal applications, or the controlled not-linked/not-active state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyInternalApplicationsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No active organization membership, or a required module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      description: Search, filter, and paginate the organization's employee directory
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: branchId
          in: query
          schema:
            type: integer
        - name: positionId
          in: query
          schema:
            type: integer
        - name: employmentStatus
          in: query
          schema:
            type: string
            enum: [active, probation, on_leave, suspended, terminated]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated employee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
        "403":
          description: No active membership in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeInput"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid input, or a referenced department/branch/position/manager is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeInput"
      responses:
        "200":
          description: Employee updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid input, or a referenced department/branch/position/manager is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/profile-picture:
    post:
      operationId: uploadEmployeeProfilePicture
      tags: [employees]
      summary: Upload or replace an employee's profile picture
      description: >-
        multipart/form-data upload. JPEG/PNG/WebP only, validated by file
        signature (not just Content-Type), 5MB max. Re-encoded to a resized,
        EXIF-stripped JPEG before storage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Profile picture updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeEmployeeProfilePicture
      tags: [employees]
      summary: Remove an employee's profile picture
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile picture removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /organizations/{organizationId}/employees/{employeeId}/link-user:
    post:
      operationId: linkEmployeeToUser
      tags: [employees]
      summary: Link an employee record to a login account
      description: >-
        Optional. The target application user must already have an active
        membership in this organization — linking never grants access on its
        own.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkEmployeeUserInput"
      responses:
        "200":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Target user has no active membership in this organization, or is already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unlinkEmployeeFromUser
      tags: [employees]
      summary: Remove an employee record's link to a login account
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Employee not found, or not currently linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/separate:
    post:
      operationId: separateEmployee
      tags: [employees]
      summary: Separate (terminate) an employee
      description: >-
        The employee record is never deleted, only marked terminated with a
        date/reason (ADR-013). Rejected if already separated.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeparateEmployeeInput"
      responses:
        "200":
          description: Employee separated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Employee is already separated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/rehire:
    post:
      operationId: rehireEmployee
      tags: [employees]
      summary: Rehire a separated employee
      description: >-
        Starts a new employment period on the same record (ADR-013) — clears
        the separation date/reason; their prior values remain in the audit
        trail. Rejected if not currently separated.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee rehired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Employee is not currently separated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/transfer:
    post:
      operationId: transferEmployee
      tags: [employees]
      summary: Transfer an employee to a new department, branch, and/or position
      description: >-
        Records a dated employment_periods event (W22) alongside updating the
        employee's current placement; cross-org reference validation reuses
        the same check create/update already runs. Rejected if none of
        departmentId/branchId/positionId would actually change.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferEmployeeInput"
      responses:
        "200":
          description: Employee transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid reference, or no actual change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/promote:
    post:
      operationId: promoteEmployee
      tags: [employees]
      summary: Promote an employee to a new position
      description: >-
        Position/title change with an effective date, recorded as a dated
        employment_periods event (W22). Does not include compensation or
        salary — no such concept exists in this schema. Rejected if the
        target position is the employee's current one.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteEmployeeInput"
      responses:
        "200":
          description: Employee promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Invalid reference, or no actual change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/confirm:
    post:
      operationId: confirmEmployee
      tags: [employees]
      summary: Confirm an employee off probation
      description: >-
        Formalizes the existing employmentStatus "probation" -> "active"
        transition into an audited, dated employment_periods event (W22).
        Rejected if the employee is not currently on probation.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmployeeInput"
      responses:
        "200":
          description: Employee confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          description: Employee is not currently on probation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/disciplinary-records:
    get:
      operationId: listEmployeeDisciplinaryRecords
      tags: [employees]
      summary: List an employee's disciplinary records
      description: >-
        Gated by employee.disciplinary.read, a narrower permission than
        employee.read (Architecture Decision 5) — the same precedent as
        employee.notes.read.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Disciplinary records for the employee, most recent action first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDisciplinaryRecord"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: addEmployeeDisciplinaryRecord
      tags: [employees]
      summary: Record a disciplinary action for an employee
      description: >-
        Append-only — there is no update or remove endpoint, so a new action
        never replaces a prior record.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddEmployeeDisciplinaryRecordInput"
      responses:
        "201":
          description: Disciplinary record added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDisciplinaryRecord"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/exit-process:
    get:
      operationId: listEmployeeExitProcesses
      tags: [employees]
      summary: List an employee's exit (off-boarding) processes
      description: >-
        One row per separation cycle — an employee separated, rehired, and
        separated again gets a new exit process each time, most recent first.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exit processes for the employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeExitProcess"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createEmployeeExitProcess
      tags: [employees]
      summary: Start the off-boarding process for an employee's current separation
      description: >-
        Attaches to the existing separation event (W15) — does not modify or
        duplicate separateEmployee. Rejected if the employee is not currently
        separated, or if an exit process already exists for this separation.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Exit process created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeExitProcess"
        "400":
          description: Employee is not currently separated, or an exit process already exists for this separation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/exit-process/{exitProcessId}:
    patch:
      operationId: updateEmployeeExitProcess
      tags: [employees]
      summary: Update checklist/clearance/exit-interview progress on an exit process
      description: Never creates a competing record — updates the same row in place.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: exitProcessId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeExitProcessInput"
      responses:
        "200":
          description: Exit process updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeExitProcess"
        "404":
          description: Employee or exit process not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/documents:
    get:
      operationId: listEmployeeDocuments
      tags: [employees]
      summary: List an employee's documents
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Documents for the employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDocument"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: uploadEmployeeDocument
      tags: [employees]
      summary: Upload a document for an employee
      description: >-
        multipart/form-data upload. PDF, JPEG, PNG, DOCX, and XLSX only,
        validated by file signature (not just Content-Type), 10MB max. Each
        upload creates a new document row — re-uploading does not replace or
        version a prior one; remove it separately if it should be superseded.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, categoryCode]
              properties:
                file:
                  type: string
                  format: binary
                categoryCode:
                  type: string
                  description: Code from the "document_category" Master Data domain.
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDocument"
        "400":
          description: Invalid file or missing category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/documents/{documentId}:
    delete:
      operationId: removeEmployeeDocument
      tags: [employees]
      summary: Remove an employee document
      description: Deletes both the stored file and its record.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Employee or document not found
          content:
