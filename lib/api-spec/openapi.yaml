    PreEmploymentRequirement:
      type: object
      description: >-
        A single checklist item tracked against an application before
        employee conversion. Column list is exactly §9's
        `pre_employment_requirements` row. No dedicated permission exists —
        visibility/write reuse the application's own read/manage pair.
        requirementCode is a Master Data reference (free text, not
        FK-validated), the same convention as candidate_documents.categoryCode.
      required: [id, organizationId, applicationId, requirementCode, status, satisfiedAt, notes, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        requirementCode:
          type: string
          description: Free text (e.g. right-to-work doc, medical, reference-complete) — no fixed/Ghana-specific list is hard-coded.
        status:
          type: string
          enum: [pending, satisfied, waived]
        satisfiedAt:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PreEmploymentRequirementSummary:
      type: object
      description: Computed on every read, never stored — the same discipline as W52's scoreRollup/W55's panelSummary.
      required: [totalCount, pendingCount, satisfiedCount, waivedCount, readyForConversion]
      properties:
        totalCount:
          type: integer
        pendingCount:
          type: integer
        satisfiedCount:
          type: integer
        waivedCount:
          type: integer
        readyForConversion:
          type: boolean
          description: Mirrors §13's own convert-to-employee readiness rule ("every non-waived row is satisfied"). Vacuously true when no requirements are tracked. Informational only — does not itself gate or trigger conversion.

    PreEmploymentRequirementListResponse:
      type: object
      required: [items, summary]
      properties:
