          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Only a draft or pending requisition can be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/{id}/archive:
