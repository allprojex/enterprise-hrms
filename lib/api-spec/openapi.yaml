      properties:
        eventType:
          type: string
          enum: [clock_in, clock_out]

    AttendanceAdjustment:
      type: object
      required: [id, organizationId, employeeId, date, adjustmentType, reason, status, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        employeeId:
          type: integer
        date:
          type: string
          format: date
        adjustmentType:
          type: string
          enum: [manual_clock_in, manual_clock_out, mark_present, mark_absent, excuse_absence]
        correctedClockIn:
          type: ["string", "null"]
          format: date-time
        correctedClockOut:
          type: ["string", "null"]
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
          description: W65's HR direct-entry path always creates this as "approved" immediately. "pending" is reachable only by a later workstream's employee-initiated request path.
        requestedByMembershipId:
          type: ["integer", "null"]
        decidedByMembershipId:
          type: ["integer", "null"]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    RecordAttendanceAdjustmentInput:
      type: object
      required: [employeeId, date, adjustmentType, reason]
      properties:
        employeeId:
          type: integer
        date:
          type: string
          format: date
        adjustmentType:
          type: string
          enum: [manual_clock_in, manual_clock_out, mark_present, mark_absent, excuse_absence]
        correctedClockIn:
          type: string
          format: date-time
          description: Required when adjustmentType is manual_clock_in.
        correctedClockOut:
          type: string
          format: date-time
          description: Required when adjustmentType is manual_clock_out.
        reason:
          type: string

    DailyAttendanceSummary:
      type: object
      required: [organizationId, employeeId, date, status]
      properties:
        organizationId:
          type: integer
        employeeId:
          type: integer
        date:
          type: string
          format: date
          description: Organization-local civil date, never a browser-local or UTC-literal date.
        status:
          type: ["string", "null"]
          enum: [present, late, partial, absent, on_leave, holiday, non_working_day, null]
          description: >-
            null means no summary is generated for this date — before
            hireDate, on/after separationDate, or an otherwise-absent day
            suppressed because the employee's current employmentStatus is
            on_leave or suspended.
        firstClockIn:
          type: ["string", "null"]
          format: date-time
          description: Effective first clock-in for this civil date — an approved manual_clock_in adjustment overrides the raw event when present.
        lastClockOut:
          type: ["string", "null"]
          format: date-time
          description: Effective last clock-out for this civil date — an approved manual_clock_out adjustment overrides the raw event when present.
        workedMinutes:
          type: ["integer", "null"]
          description: firstClockIn to lastClockOut only (first-in/last-out, no multi-segment net-duration math). null unless status is present or late.
        lateMinutes:
          type: ["integer", "null"]
          description: Minutes past workStartTime + gracePeriodMinutes. 0 when on time. null unless status is present or late.
        earlyDepartureMinutes:
          type: ["integer", "null"]
          description: Minutes before workEndTime. Informational only — never its own status value. null unless status is present or late.

    AttendanceRegisterRow:
      type: object
      required: [employeeId, summaries]
      properties:
        employeeId:
          type: integer
        summaries:
          type: array
          description: One DailyAttendanceSummary per date in the requested range, for this employee. Employee identity/department/branch display names are resolved client-side from the already-loaded employee list, not duplicated here.
          items:
            $ref: "#/components/schemas/DailyAttendanceSummary"

    AttendanceRegisterResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceRegisterRow"
        total:
          type: integer
          description: Employee count matching the caller's authorized scope and department/branch/employeeId filters — computed before any status filter is applied.
        page:
          type: integer
        pageSize:
          type: integer

    AttendanceDashboardBreakdownItem:
      type: object
      required: [status, count]
      properties:
        status:
          type: ["string", "null"]
          enum: [present, late, partial, absent, on_leave, holiday, non_working_day, null]
          description: A DailyAttendanceSummary status, or null for "not applicable" (no summary generated for that day).
        count:
          type: integer

    AttendanceDashboard:
      type: object
      required: [date, totalEmployeesCount, statusBreakdown]
      properties:
        date:
          type: string
          format: date
        totalEmployeesCount:
          type: integer
          description: Employees in the caller's authorized scope (organization-wide, or self + direct reports).
        statusBreakdown:
          type: array
          description: All 8 buckets (7 statuses + null), zero-filled, in a fixed display order.
          items:
            $ref: "#/components/schemas/AttendanceDashboardBreakdownItem"

    LeaveBalanceSummary:
      type: object
      required: [leaveTypeId, leaveTypeName, available]
      properties:
        leaveTypeId:
          type: integer
        leaveTypeName:
          type: string
        available:
          type: string
          description: Decimal string, computed live as SUM(amount) over the immutable ledger — never a stored, directly editable value.

    LeaveBalanceEntry:
      type: object
      required:
        [
          id,
          organizationId,
          employeeId,
          leaveTypeId,
          leavePolicyId,
          entryType,
          amount,
          effectiveDate,
          createdAt,
        ]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        employeeId:
          type: integer
        leaveTypeId:
          type: integer
        leavePolicyId:
          type: integer
          description: Resolved server-side at posting time and never reinterpreted by a later policy change.
        entryType:
          type: string
          enum: [opening_balance, accrual, carry_forward, usage, reversal, expiry, manual_adjustment]
        amount:
          type: string
          description: Signed decimal string — positive credits the balance, negative debits it.
        effectiveDate:
          type: string
          format: date
        reason:
          type: ["string", "null"]
        relatedLeaveRequestId:
          type: ["integer", "null"]
        sourceReference:
          type: ["string", "null"]
          description: Idempotency key for postings not tied to a specific leave request.
        createdBy:
          type: ["integer", "null"]
        approvedBy:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    AdjustLeaveBalanceInput:
      type: object
      required: [leaveTypeId, amount, effectiveDate, reason]
      properties:
        leaveTypeId:
          type: integer
        amount:
          type: number
          description: Signed — positive credits the balance, negative debits it. Cannot be zero.
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          minLength: 1

    PublicHoliday:
      type: object
      required: [id, organizationId, name, date, scope, recurring, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
