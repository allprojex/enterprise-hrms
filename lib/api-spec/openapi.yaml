      summary: Archive (close) a draft or cancelled job requisition
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job requisition archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "400":
          description: Only a draft or cancelled requisition can be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/pending-approvals:
    get:
      operationId: listPendingRequisitionApprovals
      tags: [requisition-approvals]
      summary: List job requisitions awaiting the caller's approval decision
      description: >-
        Organization-wide only (requisition.approve holders) — this
        workstream implements no delegated-approver tier yet. Gated by the
        "recruitment" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending-approval requisitions in the organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobRequisition"

  /organizations/{organizationId}/job-requisitions/{id}/approvals:
    get:
      operationId: listRequisitionApprovals
      tags: [requisition-approvals]
      summary: Immutable approval decision history for a job requisition
      description: >-
        Same visibility as GET .../job-requisitions/{id} — returns 404 both
        when the requisition doesn't exist and when it exists but isn't
        visible to this caller.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approval decision history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequisitionApproval"
        "404":
          description: Job requisition not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/{id}/approve:
    post:
      operationId: approveJobRequisition
      tags: [requisition-approvals]
      summary: Approve a pending job requisition
      description: >-
        Requires requisition.approve. Atomically finalizes the single
        approval step and transitions the requisition pending_approval ->
        approved in one transaction; rejected with 409 if the requisition is
        no longer awaiting a decision (already decided, concurrently or
        otherwise).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveJobRequisitionInput"
      responses:
        "200":
          description: Job requisition approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Requisition is not currently awaiting a decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/job-requisitions/{id}/reject:
    post:
      operationId: rejectJobRequisition
      tags: [requisition-approvals]
      summary: Reject a pending job requisition
      description: >-
        Same authorization as approve. Terminal — no reopening/resubmission
        exists in this workstream's frozen scope.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectJobRequisitionInput"
      responses:
        "200":
          description: Job requisition rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRequisition"
        "404":
          description: Job requisition not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Requisition is not currently awaiting a decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies:
    get:
      operationId: listVacancies
      tags: [vacancies]
      summary: List vacancies
      description: >-
        Visibility-filtered per caller: organization-wide for vacancy.manage
        holders, otherwise scoped to vacancies whose linked requisition
        assigns the caller as recruiter or hiring manager (a vacancy carries
        no recruiter/hiring-manager column of its own — docs/PHASE_3A_RECRUITMENT_IMPLEMENTATION_PLAN.md §7/§9).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scheduled, published, paused, closed, archived]
        - name: requisitionId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered vacancy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacancyListResponse"
    post:
      operationId: createVacancy
      tags: [vacancies]
      summary: Create a vacancy
      description: >-
        Always created as draft. Only permitted from an approved requisition
        belonging to this organization — requisitions in any other status
        are rejected with 400. filledCount is never client-settable.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVacancyInput"
      responses:
        "201":
          description: Vacancy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: Invalid fields, requisition not approved, or a referenced ID does not belong to this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies/{id}:
    get:
      operationId: getVacancy
      tags: [vacancies]
      summary: Get a vacancy
      description: Returns 404 both when the vacancy doesn't exist and when it exists but isn't visible to this caller — never distinguishing the two.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vacancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "404":
          description: Vacancy not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateVacancy
      tags: [vacancies]
      summary: Update a draft vacancy
      description: Only permitted while status is draft — protected fields (status, filledCount, publicId, audit metadata) are never accepted here.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVacancyInput"
      responses:
        "200":
          description: Vacancy updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: Only a draft vacancy can be edited, or a validation/cross-org error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies/{id}/publish:
    post:
      operationId: publishVacancy
      tags: [vacancies]
      summary: Publish (or resume) a vacancy
      description: >-
        draft, scheduled, or paused -> scheduled or published. From draft,
        goes straight to published when openDate is unset or not in the
        future; otherwise becomes scheduled. Calling publish again on an
        already-scheduled vacancy always flips it live immediately (the
        manual operator flip — no background scheduler exists in this
        phase). Also used for the paused -> published "resume" direction,
        which likewise always goes straight to published.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vacancy published or scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: Only a draft, scheduled, or paused vacancy can be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies/{id}/pause:
    post:
      operationId: pauseVacancy
      tags: [vacancies]
      summary: Pause a published vacancy
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vacancy paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: Only a published vacancy can be paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies/{id}/close:
    post:
      operationId: closeVacancy
      tags: [vacancies]
      summary: Close a vacancy
      description: >-
        draft, scheduled, published, or paused -> closed. The single
        terminal-exit action this workstream implements (the frozen plan's
        separate `cancelled` state is folded into `closed` here — see
        lib/db/src/schema/vacancies.ts).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vacancy closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: A closed or archived vacancy cannot be closed again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/vacancies/{id}/archive:
    post:
      operationId: archiveVacancy
      tags: [vacancies]
      summary: Archive a closed vacancy
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vacancy archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vacancy"
        "400":
          description: Only a closed vacancy can be archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Vacancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications (internal ATS review)
      description: >-
        Visibility-filtered per caller: organization-wide for
        application.pipeline.move holders, otherwise scoped to applications
        whose linked requisition assigns the caller as recruiter or hiring
        manager (an application carries no recruiter/hiring-manager column
        of its own — resolved two hops out via its vacancy's requisition,
        docs/PHASE_3A_RECRUITMENT_IMPLEMENTATION_PLAN.md §7). No candidate-
        session ("own") tier exists — anonymous applicants never reach this
        route (W50 deferred, no candidate account/session mechanism exists).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: vacancyId
          in: query
          schema:
            type: integer
        - name: stageCategory
          in: query
          schema:
            type: string
            enum: [applied, screening, interview, assessment, offer, hired, rejected, withdrawn]
        - name: search
          in: query
          description: Matches candidate name or email.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated, visibility-filtered application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"

  /organizations/{organizationId}/applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application (candidate info, current stage, documents, immutable history)
      description: Returns 404 both when the application doesn't exist and when it exists but isn't visible to this caller — never distinguishing the two.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Application not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/move-stage:
    post:
      operationId: moveApplicationStage
      tags: [applications]
      summary: Move an application to another active, non-terminal stage in its vacancy's own workflow
      description: >-
        Validated server-side against the vacancy's own workflow stage
        list — never a client-supplied "next stage" trusted as-is.
        Rejected with 400 if the application is currently in a terminal
        stage (use reopen first), the vacancy has no configured workflow,
        or toStageId doesn't belong to that workflow. Terminal categories
        (hired/rejected/withdrawn) are reachable only through their own
        dedicated actions, never through this one.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveApplicationStageInput"
      responses:
        "200":
          description: Application moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [applications]
      summary: Reject an application
      description: Moves the application to the vacancy's workflow's rejected-category stage. 400 if no such stage is configured, or the application is already in a terminal stage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectApplicationInput"
      responses:
        "200":
          description: Application rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/withdraw:
    post:
      operationId: withdrawApplication
      tags: [applications]
      summary: Withdraw an application
      description: Moves the application to the vacancy's workflow's withdrawn-category stage. 400 if no such stage is configured, or the application is already in a terminal stage.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawApplicationInput"
      responses:
        "200":
          description: Application withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/reopen:
    post:
      operationId: reopenApplication
      tags: [applications]
      summary: Reopen a rejected or withdrawn application
      description: Moves the application from its terminal stage back to the vacancy's workflow's applied-category stage, clearing any rejection/withdrawal reason. 400 if the application isn't currently in a terminal stage, or no applied-category stage is configured.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReopenApplicationInput"
      responses:
        "200":
          description: Application reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/applications/{id}/scores:
    post:
      operationId: submitApplicationScore
      tags: [applications]
      summary: Submit a scoring entry for an application (W52)
      description: >-
        Append-only — a new row every time, never an edit. Distinct from
        stage movement: scoring evaluates an application without changing
        its stage, so this is gated by application.manage, not
        application.pipeline.move. applications.score is never written —
        the rollup is always recomputed on read (see ApplicationDetail.scoreRollup, §12).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitApplicationScoreInput"
      responses:
        "201":
          description: Score submitted — returns the refreshed application detail (including the recomputed scoreRollup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/candidates:
    get:
      operationId: listCandidates
      tags: [candidates]
      summary: List candidates (internal directory)
      description: >-
        Visibility-filtered per caller: organization-wide for
