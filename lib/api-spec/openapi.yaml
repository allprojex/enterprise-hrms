    LeaveDashboardMetrics:
      type: object
      description: >-
        W40 — HR Operations Dashboard. Every figure is computed live from
        leave_requests/leave_balance_entries/public_holidays (W33/W34/W37) —
        no cache, no new table. "Upcoming"/"expiring" figures use a shared
        30-day window from today.
      required:
        - employeesOnLeave
        - upcomingApprovedLeave
        - pendingApprovalCount
        - upcomingPublicHolidays
        - leaveUtilizationPercent
        - expiringCarryForwardBalances
        - requestsByStatus
      properties:
        employeesOnLeave:
          type: integer
          description: Distinct employees (in the viewer's scope) with an approved leave request spanning today.
        upcomingApprovedLeave:
          type: integer
          description: Approved leave requests (in scope) starting within the next 30 days, not yet started.
        pendingApprovalCount:
          type: integer
          description: Pending leave requests the viewer is authorized to approve — same scope GET .../leave-requests/pending-approvals (W35) uses.
        upcomingPublicHolidays:
          type: integer
          description: Organization-wide public holiday occurrences within the next 30 days.
        leaveUtilizationPercent:
          type: number
          description: 100 * (ledger usage) / (ledger opening_balance + accrual + carry_forward credits) across the viewer's scope; 0 when nothing has been credited yet.
        expiringCarryForwardBalances:
          type: integer
          description: Carry-forward ledger entries (in scope) expiring within the next 30 days, counted only under a policy whose carryForwardExpiryMonths is actually set.
        requestsByStatus:
          $ref: "#/components/schemas/LeaveRequestsByStatusCounts"

