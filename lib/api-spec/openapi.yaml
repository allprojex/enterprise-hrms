      properties:
        status:
          type: string
          enum: [assigned, in_progress, completed, failed, cancelled]
        count:
          type: integer

    LearningDashboard:
      type: object
      required:
        [
          activeCourseCount, enrollmentsAssignedCount, statusBreakdown,
          pendingApprovalCount, overdueCount, certificatesExpiringSoonCount,
        ]
      properties:
        activeCourseCount:
          type: integer
          description: Organization-wide count of courses with status = active, regardless of the caller's own enrollment scope.
        enrollmentsAssignedCount:
          type: integer
          description: Total enrollments in the caller's authorized scope (a raw count, not distinct employees).
        statusBreakdown:
          type: array
          description: All 5 enrollment statuses, zero-filled, fixed order.
          items:
            $ref: "#/components/schemas/LearningDashboardStatusItem"
        pendingApprovalCount:
          type: integer
          description: approvalStatus = pending, within scope.
        overdueCount:
          type: integer
          description: dueDate passed and status not in (completed, failed, cancelled).
        certificatesExpiringSoonCount:
          type: integer
          description: Active certificates with a fixed expiresAt within the next 30 days, within scope.

