        "400":
          description: Invalid date, scope, or recurring configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A holiday with this name already exists on this date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

