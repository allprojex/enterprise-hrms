          type: string
          enum: [in_progress, completed, flagged, unable_to_complete]
        resultSummary:
          type: ["string", "null"]
        vendorReference:
          type: ["string", "null"]

    OfferVersion:
      type: object
      description: >-
        One immutable revision of an offer's content — column list is
        exactly §9's `offer_versions` row, minus the raw
        generatedDocumentStorageKey (a reserved, never-populated internal
        file-storage reference, never exposed — same DTO-shaping discipline
        as W55/W56's own stripped internal-only columns). letterTemplateId
        is a plain, unpopulated reserved FK-shaped integer — no offer-letter
        template mechanism exists in this workstream's scope.
      required:
        - id
        - organizationId
        - offerId
        - versionNumber
        - proposedStartDate
        - employmentType
        - workplaceType
        - location
        - compensationSummary
        - conditions
        - expiryDate
        - letterTemplateId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        offerId:
          type: integer
        versionNumber:
          type: integer
        proposedStartDate:
          type: ["string", "null"]
          format: date
        employmentType:
          type: ["string", "null"]
          enum: [full_time, part_time, contract, intern, temporary, null]
        workplaceType:
          type: ["string", "null"]
          enum: [onsite, remote, hybrid, null]
        location:
          type: ["string", "null"]
        compensationSummary:
          description: Recruitment-scoped fields only (base salary, currency, bonus, benefits summary) — never a full payroll/compensation structure. Caller-supplied, unvalidated shape.
          type: ["object", "null"]
          additionalProperties: true
        conditions:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
          format: date
        letterTemplateId:
          type: ["integer", "null"]
          description: Reserved — no offer-letter template mechanism exists in this workstream's scope. Always null.
        status:
          type: string
          enum: [draft, pending_approval, approved, issued, accepted, declined, expired, withdrawn, superseded]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Offer:
      type: object
      description: >-
        A stable envelope per application — the actual content lives in
        OfferVersion, never here (§14). currentVersionId always points at
        the latest non-superseded version.
      required: [id, organizationId, applicationId, currentVersionId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        applicationId:
          type: integer
        currentVersionId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OfferDetail:
      type: object
      required: [offer, versions]
      properties:
        offer:
          $ref: "#/components/schemas/Offer"
        versions:
          type: array
          description: Every version of this offer, oldest first (versionNumber ascending) — including superseded ones, for full history.
          items:
            $ref: "#/components/schemas/OfferVersion"

    OfferListItem:
      type: object
      required: [offer, currentVersion, vacancyTitle, applicationId]
      properties:
        offer:
          $ref: "#/components/schemas/Offer"
        currentVersion:
          description: >-
            Null only for the brief instant between creating the offer
            envelope and its first version within the same transaction —
            never observable via this list endpoint in practice. Inlined
            (not $ref'd) because a nullable $ref/allOf combination breaks
            this repo's orval codegen (see the `offers` tag description /
            W55's own documented fix for the same issue).
          type: ["object", "null"]
          required:
            - id
            - organizationId
            - offerId
            - versionNumber
            - proposedStartDate
            - employmentType
            - workplaceType
            - location
            - compensationSummary
            - conditions
            - expiryDate
            - letterTemplateId
            - status
            - createdAt
            - updatedAt
          properties:
            id:
              type: integer
            organizationId:
              type: integer
            offerId:
              type: integer
            versionNumber:
              type: integer
            proposedStartDate:
              type: ["string", "null"]
              format: date
            employmentType:
              type: ["string", "null"]
              enum: [full_time, part_time, contract, intern, temporary, null]
            workplaceType:
              type: ["string", "null"]
              enum: [onsite, remote, hybrid, null]
            location:
              type: ["string", "null"]
            compensationSummary:
              type: ["object", "null"]
              additionalProperties: true
            conditions:
              type: ["string", "null"]
            expiryDate:
              type: ["string", "null"]
              format: date
            letterTemplateId:
              type: ["integer", "null"]
            status:
              type: string
              enum: [draft, pending_approval, approved, issued, accepted, declined, expired, withdrawn, superseded]
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        vacancyTitle:
          type: string
        applicationId:
          type: integer

    OfferListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OfferListItem"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    OfferApproval:
      type: object
      description: >-
        A single approval step's decision record — mirrors
        RequisitionApproval exactly (§9's own "mirrors requisition_approvals"
        instruction). This workstream writes only sequence 1. No reject
        route exists (see the `offers` tag description) — "rejected" is a
        structurally valid but currently unreachable decision value.
      required: [id, organizationId, offerVersionId, sequence, approverMembershipId, decision, decidedAt, comment, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        offerVersionId:
          type: integer
        sequence:
          type: integer
        approverMembershipId:
          type: ["integer", "null"]
          description: Resolved at decision time (who actually decided) — null while pending.
        decision:
          type: string
          enum: [pending, approved, rejected]
        decidedAt:
          type: ["string", "null"]
          format: date-time
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

