          description: Not authorized to view this employee's attendance events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance-adjustments:
    post:
      operationId: recordAttendanceAdjustment
      tags: [attendance-adjustments]
      summary: HR direct-entry correction (auto-approved), or an employee's own correction request (pending)
      description: >-
        One shared endpoint, two branches, decided by whether the caller
        holds attendance.manage — not by any request field. Requires
        attendance.read.own at minimum (every role has it).


        HR direct entry (attendance.manage holder): employeeId is
        caller-supplied (the target employee). Auto-decided in the same
        operation it's created (status "approved", decidedByMembershipId =
        requestedByMembershipId).


        Employee-initiated request (no attendance.manage): employeeId is
        always server-derived from the authenticated caller — a
        client-supplied employeeId in the body is ignored. Always created
        "pending"; never auto-approves itself. Decided later via
        POST .../attendance-adjustments/{id}/approve or .../reject.


        reason is always required for both branches. correctedClockIn is
        required when adjustmentType is manual_clock_in; correctedClockOut
        is required when adjustmentType is manual_clock_out. Gated by the
        "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAttendanceAdjustmentInput"
      responses:
        "201":
          description: Attendance adjustment recorded — status is "approved" for HR direct entry, "pending" for an employee-initiated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceAdjustment"
        "400":
          description: Invalid adjustmentType, missing date/reason, or a required corrected timestamp is missing for the given adjustmentType
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: No employee record linked to this account (employee-initiated branch only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found in this organization (HR direct-entry branch only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance-adjustments/{id}/approve:
    post:
      operationId: approveAttendanceAdjustment
      tags: [attendance-adjustments]
      summary: Approve a pending Attendance correction request
      description: >-
        Requires attendance.adjustment.approve — an organization-wide-only
        tier for this workstream (no delegated/manager approval). An
        atomic conditional update takes the row; a concurrent second
        decision on the same request receives 409, never a silent
        double-decision. Gated by the "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adjustment approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceAdjustment"
        "404":
          description: Adjustment not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Adjustment is not pending — already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance-adjustments/{id}/reject:
    post:
      operationId: rejectAttendanceAdjustment
      tags: [attendance-adjustments]
      summary: Reject a pending Attendance correction request
      description: >-
        Requires attendance.adjustment.approve. Same atomic terminal-state
        protection as approve — a rejected or already-approved request
        cannot be redecided. Gated by the "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adjustment rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceAdjustment"
        "404":
          description: Adjustment not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Adjustment is not pending — already decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/employees/{employeeId}/attendance/summary:
    get:
      operationId: getAttendanceDailySummary
      tags: [attendance-summary]
      summary: Daily Attendance summary — single date or a date range
      description: >-
        A computed read-model over attendance_events, approved
        attendance_adjustments, approved Leave, public holidays, and
        organization Attendance/timezone configuration — never a second
        source of truth, nothing is persisted or mutated by this read.
        Provide either `date` (single-day mode, returns one object) or both
        `from`/`to` (range mode, returns a dense array, one entry per date,
        max 100 days). Own resource, direct-report (team), or
        organization-wide (attendance.manage) — gated by attendance.read.own
        at the route level, refined by an authorization check against the
        specific employee. Gated by the "attendance" module. status is null
        when no summary is generated (before hireDate, on/after
        separationDate, or an otherwise-absent day for an employee whose
        current employmentStatus is on_leave/suspended).
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: Single-day mode, YYYY-MM-DD (organization-local civil date). Mutually exclusive with from/to.
          schema:
            type: string
            format: date
        - name: from
          in: query
          required: false
          description: Range mode start (inclusive), YYYY-MM-DD.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Range mode end (inclusive), YYYY-MM-DD. Range cannot exceed 100 days.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A single summary (date mode) or a dense array of summaries (from/to mode)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DailyAttendanceSummary"
                  - type: array
                    items:
                      $ref: "#/components/schemas/DailyAttendanceSummary"
        "400":
          description: Neither date nor from/to provided, an invalid date format, an inverted range, or a range exceeding 100 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Not authorized to view this employee's attendance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The organization's timezone (general.timezone) is not configured — required before an Attendance summary can be computed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance:
    get:
      operationId: listAttendanceRegister
      tags: [attendance-register]
      summary: Attendance Register — internal HR/manager list view
      description: >-
        A view over the W66 daily-summary read-model, paginated by
        employee (never a raw table scan, never a second summary engine).
        attendance.manage holders get organization-wide visibility;
        everyone else (attendance.read.own) sees only themselves and their
        direct reports (employees.reportingManagerId) — the same
        service-layer tier leaveCalendar.ts already uses, with no
        dedicated attendance.read.team permission. employeeId/
        departmentId/branchId filters can only narrow this authorized
        scope, never broaden it — an employeeId outside the caller's
        scope yields zero rows, not an error. status filters the computed
        page: a row is kept if at least one of its days matches; `total`
        reflects the employee-level scope/filter count before status
        filtering. A manager with zero direct reports receives a valid
        empty result, never an organization-wide fallback. Gated by the
        "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: true
          description: Inclusive range start, YYYY-MM-DD (organization-local civil date).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive range end, YYYY-MM-DD. Range cannot exceed 100 days. from=to gives a single-day ("daily") register; a wider range gives a "monthly" view.
          schema:
            type: string
            format: date
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
        - name: branchId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: One of the 7 DailyAttendanceSummary statuses (present, late, partial, absent, on_leave, holiday, non_working_day).
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: A page of the register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegisterResponse"
        "400":
          description: Missing/invalid from or to, an inverted or too-wide range, or an invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The organization's timezone (general.timezone) is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance/dashboard:
    get:
      operationId: getAttendanceDashboard
      tags: [attendance-reporting]
      summary: Attendance dashboard — status tile breakdown for a single date
      description: >-
        A zero-filled count of every W66 status (present, late, partial,
        absent, on_leave, holiday, non_working_day, and null/"not
        applicable") for a single organization-local civil date — "today"
        (organization-timezone-derived, never browser-local) by default, or
        an explicit ?date=. Computed live over the W66 read-model, never
        cached or persisted. Visibility mirrors the Attendance Register
        (W69) exactly: attendance.manage holders see the whole
        organization; everyone else sees only themselves and their direct
        reports. Gated by the "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: false
          description: YYYY-MM-DD, organization-local civil date. Defaults to organization-local "today".
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Dashboard status breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceDashboard"
        "400":
          description: Invalid date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The organization's timezone (general.timezone) is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /organizations/{organizationId}/attendance/reports/{reportKey}:
    get:
      operationId: runAttendanceReport
      tags: [attendance-reporting]
      summary: Run an attendance report
      description: >-
        Computes a registered attendance report (see GET /reports, category
        "attendance": attendance_daily_register, attendance_monthly_summary,
        attendance_late_arrivals, attendance_absenteeism) over a date range,
        scoped to the caller's own/team/organization-wide Attendance
        visibility tier (identical to the Register and Dashboard). from/to
        default to organization-local "today" when omitted, and reuse the
        same range validation as the Register (max 100 days, no inverted
        range). Pass ?format=csv for a CSV download instead of JSON.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: reportKey
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
      responses:
        "200":
          description: Attendance report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid/inverted/too-wide date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Unknown attendance report key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The organization's timezone (general.timezone) is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

