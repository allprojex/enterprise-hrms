        model:
          type: string
        serialNumber:
          type: ["string", "null"]
        branchId:
          type: ["integer", "null"]
        purchaseDate:
          type: ["string", "null"]
          format: date
        purchaseCost:
          type: ["number", "null"]
          minimum: 0
        purchaseCurrency:
          type: ["string", "null"]
        warrantyExpiryDate:
          type: ["string", "null"]
          format: date
        notes:
          type: string

    AssetListResponse:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
