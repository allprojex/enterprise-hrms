      summary: List attendance events for an employee
      description: >-
        employeeId omitted defaults to the caller's own history. Own
        resource, team (employees.reportingManagerId), or organization-wide
        (attendance.manage) — gated by attendance.read.own at the route
        level, refined by an authorization check against the specific
        employee. Gated by the "attendance" module.
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
        - name: employeeId
          in: query
