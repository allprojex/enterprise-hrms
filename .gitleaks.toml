# gitleaks configuration — WS-18 deployment unblock.
#
# The default ruleset is kept in full. This file adds exactly ONE narrowly
# scoped allowlist entry; nothing is disabled.
#
# ---------------------------------------------------------------------------
# Why this exists
# ---------------------------------------------------------------------------
#
# The `generic-api-key` rule looks for a key-ish label followed by a longish,
# high-entropy value. TypeScript type annotations have that exact shape:
#
#     key: SomePascalCaseTypeName;
#
# and three historical findings (commit cb143108, in
# artifacts/api-server/src/lib/employee360/types.ts and
# lib/api-client-react/src/generated/api.schemas.ts) are precisely this
# construct. Verified structurally, without ever printing the matched text:
#
#   - the matched span straddles the property label, the colon AND the trailing
#     semicolon — it is not a self-contained token;
#   - the "value" is a 21-character PascalCase identifier, a valid TypeScript
#     identifier, not base64/hex/JWT-shaped;
#   - it is DECLARED as a type in both flagged files and imported as a symbol
#     elsewhere — it is a type, not data;
#   - it never appears inside a string literal and never on the right-hand side
#     of an assignment.
#
# A type annotation is erased at compile time. It has no runtime value and
# therefore cannot be a credential.
#
# ---------------------------------------------------------------------------
# Why this exception is safe
# ---------------------------------------------------------------------------
#
# The regex below excuses a match ONLY when the whole match is a bare
# TypeScript type annotation:
#
#   * no quote character of any kind may appear in the match — a real secret in
#     TypeScript is quoted (`key: "sk_live_..."`, `const KEY = '...'`), and a
#     quoted value can never satisfy this pattern;
#   * the value must be a PascalCase identifier — letters and digits only,
#     starting uppercase. Anything containing `+ / = . - _ :` or starting with a
#     digit or lowercase (which covers essentially every real API key, JWT,
#     base64 blob, hex digest and connection string) does not match;
#   * the match must terminate at a semicolon, as a type annotation does.
#
# It is scoped to the single `generic-api-key` rule, so every other rule —
# AWS keys, private keys, JWTs, Stripe/Slack/GitHub tokens, connection strings
# — remains fully active everywhere, including in these same files.
#
# This is deliberately NOT a path-based exclusion of generated code: excluding
# whole files would also hide genuine secrets that appear in them. Scoping to
# the syntax instead keeps the files under full scrutiny.
#
# Proven by negative control (see docs/SECURITY.md §16): a synthetic
# `generic-api-key`-shaped secret placed in one of these same files is STILL
# detected after this allowlist is in force.

title = "Enterprise HRMS gitleaks configuration"

[extend]
# Inherit the complete upstream default ruleset. Nothing is removed.
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "TypeScript type annotations (`key: SomeTypeName;`) are compile-time types, not values. Unquoted PascalCase identifier terminated by a semicolon; anything quoted or containing non-identifier characters is still reported."
  regexTarget = "match"
  regexes = [
    '''^[A-Za-z_$]*\s*:\s*[A-Z][A-Za-z0-9]*\s*;?$''',
  ]
