<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Served by the service worker (public/sw.js) when a navigation fails
      because there is no network connection. Static and identical for every
      tenant and user: it shows no application data and loads nothing from
      /api. Same-origin stylesheet and script only, so it satisfies the edge
      CSP (script-src 'self') without inline script.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#2A4074" />
    <title>Offline · HRIS Plus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/offline.css" />
    <script src="/offline.js" defer></script>
  </head>
  <body>
    <main class="card" aria-labelledby="offline-title">
      <img class="icon" src="/icons/pwa-192.png" alt="" width="64" height="64" />
      <p class="product">HRIS Plus</p>
      <h1 id="offline-title">You're offline</h1>
      <p>
        HRIS Plus needs an internet connection to load your organisation's information. Nothing is
        stored on this device while you are offline.
      </p>
      <p>Check your Wi-Fi or mobile data, then try again.</p>
      <!-- A plain link reloads the page the person was opening, even with JavaScript disabled. -->
      <a class="retry" href="" id="retry">Retry</a>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
