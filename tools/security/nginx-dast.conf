server {
  listen 80;
  location / {
    proxy_pass http://ws18api2:3001;
    proxy_set_header Host $host;
    # Overwrites any client-supplied value — this is what makes TRUST_PROXY=1
    # safe. $remote_addr is the real peer as seen by nginx.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
