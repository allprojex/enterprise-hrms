# Enterprise HRMS — Production edge configuration for hrms.afripebbles.com.
# SOURCE OF TRUTH: this file is installed on the VPS as
#   /etc/nginx/sites-available/hrms.afripebbles.com  (symlinked from sites-enabled)
# together with deploy/nginx/snippets/hrms-security-headers.conf as
#   /etc/nginx/snippets/hrms-security-headers.conf
# Rollout: install both files, `nginx -t`, then `systemctl reload nginx` (graceful; never restart).
#
# Topology (WS-18 proxy contract): Internet -> Nginx (this, ONE hop) -> HRMS API container on
# 127.0.0.1:3001 (TRUST_PROXY=1). The static SPA, built from the same release checkout, is served
# from /var/www/enterprise-hrms. The ORIGINAL Host is passed through unmodified (tenant
# resolution reads the raw Host header); X-Forwarded-Host and X-Tenant-Hostname are stripped so
# no caller can name a tenant. Only port 443/80 are public; 3001 is loopback-only.
#
# Header ownership:
#   static surface -> snippets/hrms-security-headers.conf (HSTS, X-Robots-Tag, XFO DENY, nosniff,
#                     Referrer-Policy, Permissions-Policy, CSP report-only)
#   /api/          -> Helmet in the container is authoritative (CSP, XFO, nosniff, Referrer-Policy,
#                     COOP/CORP). The edge adds HSTS (hiding Helmet's copy so exactly ONE is sent)
#                     and X-Robots-Tag. Nothing else is duplicated.
#
# The TLS listener, certificate paths and the HTTP->HTTPS redirect below are the ones Certbot
# installed (`certbot --nginx -d hrms.afripebbles.com`); Certbot renews the certificate in place.

server {
    server_name hrms.afripebbles.com;
    server_tokens off;

    root /var/www/enterprise-hrms;
    index index.html;

    access_log /var/log/nginx/hrms.afripebbles.com.access.log;
    error_log  /var/log/nginx/hrms.afripebbles.com.error.log;

    include /etc/nginx/snippets/hrms-security-headers.conf;

    client_max_body_size 25m;

    # No sitemap for an authenticated application.
    location = /sitemap.xml { return 404; }

    # Served from the release's public/robots.txt (User-agent: * / Disallow: /); explicit so a
    # missing file can never fall through to the SPA document.
    location = /robots.txt {
        include /etc/nginx/snippets/hrms-security-headers.conf;
        default_type text/plain;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  "";
        proxy_set_header X-Tenant-Hostname "";
        proxy_read_timeout 120s;
        proxy_redirect off;

        # Exactly one HSTS on API responses: hide Helmet's, emit the edge's.
        proxy_hide_header Strict-Transport-Security;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location /assets/ {
        include /etc/nginx/snippets/hrms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/hrms-security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hrms.afripebbles.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hrms.afripebbles.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP: redirect only. No HSTS here (the header is only meaningful over HTTPS).
server {
    if ($host = hrms.afripebbles.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name hrms.afripebbles.com;
    return 404; # managed by Certbot
}
