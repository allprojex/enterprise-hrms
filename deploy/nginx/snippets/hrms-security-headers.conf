# Enterprise HRMS — browser-facing security headers for the STATIC surface (SPA document,
# assets, robots). Included in every static `location` because an `add_header` inside a
# location replaces the server-level set; one include keeps every surface identical.
#
# NOT included in /api/: Helmet inside the API container is authoritative for CSP,
# X-Frame-Options, X-Content-Type-Options, Referrer-Policy, COOP/CORP on API responses.
# The edge adds only HSTS and X-Robots-Tag there (see the site config).
#
# Installed on the VPS as /etc/nginx/snippets/hrms-security-headers.conf.

# HSTS: the edge is the single emitter for this host. One year, subdomains, NO preload
# (preload would commit the afripebbles.com apex and every other service on it).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Never indexed: the application is authenticated, multi-tenant HR data. Supplements
# (never replaces) authentication. Also declared by index.html and robots.txt at source.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP for the SPA — REPORT-ONLY in this release. Enforcement is a separate, later
# authorization once real browser sessions have shown zero violations.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
